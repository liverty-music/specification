name: Buf BSR Push on Release

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write

jobs:
  buf-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup buf CLI
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          setup_only: true

      - name: Push to BSR with release label
        run: buf push --error-format github-actions --create --git-metadata --label "${{ github.event.release.tag_name }}"
