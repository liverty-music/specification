name: Buf PR Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            src:
              - "proto/**"
              - "buf.yaml"
              - "Makefile"
              - ".github/workflows/**"

  buf-checks:
    needs: changes
    if: needs.changes.outputs.src == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Native mode: annotations on the diff plus a summary comment. Breaking
      # detection compares against the PR base and is skipped when the
      # `buf skip breaking` label is applied. Push stays release-only
      # (buf-release.yml), so push and archive are off here.
      - name: Buf lint, format and breaking
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          format: true
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          push: false
          archive: false
          pr_comment: true


  # The ubiquitous-language guard (scripts/check-forbidden-words.py). It reads
  # the whole tree in about a second, so it runs on every PR and push with no
  # path filter and also catches violations already on main.
  forbidden-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check forbidden words
        run: python3 scripts/check-forbidden-words.py

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, buf-checks, forbidden-words]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: buf-checks
          jobs: ${{ toJSON(needs) }}
