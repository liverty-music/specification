name: Buf PR Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            src:
              - "proto/**"
              - "buf.yaml"
              - "buf.gen.yaml"
              - "Makefile"
              - ".github/workflows/**"

  buf-checks:
    needs: changes
    if: needs.changes.outputs.src == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup buf CLI
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          setup_only: true

      - name: Run buf lint
        run: buf lint

      - name: Check buf format
        run: buf format -d --exit-code

      - name: Check breaking changes
        if: "!contains(github.event.pull_request.labels.*.name, 'buf skip breaking')"
        run: buf breaking --against '.git#branch=origin/main'

  buf-checks-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping Buf PR checks"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, buf-checks, buf-checks-skip]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: buf-checks, buf-checks-skip
          jobs: ${{ toJSON(needs) }}
