name: CI

# One workflow, one `CI Success`. Branch protection requires that check by
# name only, so a second workflow publishing its own `CI Success` would let
# either one satisfy it (liverty-music/backend#669), and a workflow without
# one is not a gate at all: OpenSpec Checks used to be a separate workflow
# that a pull request could merge past while it failed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            src:
              - "proto/**"
              - "buf.yaml"
              - "Makefile"
              - ".github/workflows/**"
            openspec:
              - "openspec/**"
              - "scripts/check-spec-layout.py"
              - "scripts/check-story-diagrams.py"
              - "scripts/check-scenario-coverage.py"
              - ".github/workflows/ci.yml"

  buf-checks:
    needs: changes
    if: needs.changes.outputs.src == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Native mode: annotations on the diff plus a summary comment. Breaking
      # detection compares against the PR base and is skipped when the
      # `buf skip breaking` label is applied. Push stays release-only
      # (buf-release.yml), so push and archive are off here.
      - name: Buf lint, format and breaking
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          format: true
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          push: false
          archive: false
          pr_comment: true


  # The ubiquitous-language guard (scripts/check-forbidden-words.py). It reads
  # the whole tree in about a second, so it runs on every PR and push with no
  # path filter and also catches violations already on main.
  forbidden-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check forbidden words
        run: python3 scripts/check-forbidden-words.py

  openspec-checks:
    needs: changes
    # Pull requests only: the steps diff against the pull request's base.
    if: needs.changes.outputs.openspec == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the version pinned in README.md / AGENTS.md.
      OPENSPEC_VERSION: 1.13.2
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install OpenSpec CLI
        run: npm install -g --no-audit --no-fund "@fission-ai/openspec@${OPENSPEC_VERSION}"

      # Structural validity of every main spec. Not strict: some existing main
      # specs still carry a short or placeholder Purpose (warnings, not errors).
      - name: Validate main specs
        run: openspec validate --specs --no-interactive

      # Every main spec and active delta sits on a liverty-clean-arch path.
      # Also a pre-commit hook, which does not run where pre-commit is not
      # installed (Claude Code on the web, fresh clones).
      - name: Check spec layout
        run: python3 scripts/check-spec-layout.py

      # Every usecase method a story names is drawn in its Purpose's
      # usecase-beta fence. Main specs only, like the rest of this job.
      - name: Check story diagrams
        run: python3 scripts/check-story-diagrams.py

      # Changes are judged only when this PR touches them, so an in-progress
      # change on main never blocks unrelated PRs.
      - name: Find changes touched by this PR
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          active=$(git diff --name-only "${BASE_SHA}...HEAD" -- openspec/changes/ \
            | grep -v '^openspec/changes/archive/' | cut -d/ -f3 | sort -u \
            | while read -r c; do [ -d "openspec/changes/${c}" ] && echo "${c}"; done | paste -sd' ' -)
          echo "active=${active}" >> "$GITHUB_OUTPUT"
          echo "Active changes touched: ${active:-none}"

      # Same bar as the pre-archive hook. Planning lands in steps (a proposal
      # PR first, specs later), so a change whose delta specs are not written
      # yet is deferred rather than failed.
      - name: Validate touched changes (strict)
        if: steps.touched.outputs.active != ''
        env:
          CHANGES: ${{ steps.touched.outputs.active }}
        run: |
          read -ra changes <<< "$CHANGES"
          status=0
          for c in "${changes[@]}"; do
            specs=$(openspec status --change "${c}" --json 2>/dev/null | jq -r '.artifacts[] | select(.id == "specs") | .status')
            if [ "${specs}" != "done" ] && ! grep -qE '^skip_specs:[[:space:]]*true' "openspec/changes/${c}/.openspec.yaml" 2>/dev/null; then
              echo "::notice::${c}: delta specs not written yet (specs: ${specs:-unknown}); strict validation deferred until they are."
              continue
            fi
            openspec validate "${c}" --type change --strict --no-interactive || status=1
          done
          exit "${status}"

      # Only directories this PR adds under changes/archive/ are judged below,
      # so older archives do not block unrelated PRs.
      - name: Find changes archived in this PR
        id: archived
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          names=$(git diff --name-only --diff-filter=A "${BASE_SHA}...HEAD" -- openspec/changes/archive/ \
            | cut -d/ -f4 | sort -u | paste -sd' ' -)
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "Archived in this PR: ${names:-none}"

      # An archived change must have every task checked.
      - name: Check archived changes are complete
        if: steps.archived.outputs.names != ''
        env:
          ARCHIVED: ${{ steps.archived.outputs.names }}
        run: |
          read -ra archived <<< "$ARCHIVED"
          openspec validate --archived --json --no-interactive > archived.json || true
          incomplete=$(jq -r --args '
            ($ARGS.positional) as $ids
            | .items[]
            | select(.id as $id | $ids | index($id))
            | select(.valid == false)
            | "\(.id): \([.issues[].message] | join("; "))"
          ' "${archived[@]}" < archived.json)
          if [ -n "$incomplete" ]; then
            echo "::error::Archived with unfinished tasks. Finish them (or move the leftovers to a follow-up change) before archiving."
            echo "$incomplete"
            exit 1
          fi
          echo "All changes archived in this PR have every task completed."

      # Archive happens after the implementation PRs merge, so their main
      # branches must carry an @spec-annotated test for every ADDED/MODIFIED
      # scenario (or an @spec-manual exemption in the change). The repos are
      # public, so an anonymous shallow clone works today. With the
      # IMPLEMENTING_REPOS_TOKEN secret set (Contents: read on the three
      # repositories), the clone authenticates, so it keeps working when one
      # of them turns private (cloud-provisioning
      # docs/runbooks/repository-visibility.md). The token reaches git through
      # GIT_CONFIG_* environment variables, never a URL or an argument. An
      # expired token fails the clone even of a public repository: renew the
      # secret, or delete it while every repository is public.
      - name: Clone implementing repositories
        if: steps.archived.outputs.names != ''
        env:
          TOKEN: ${{ secrets.IMPLEMENTING_REPOS_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
            export GIT_CONFIG_VALUE_0
          fi
          for r in backend frontend cloud-provisioning; do
            git clone --quiet --depth 1 "https://github.com/liverty-music/${r}.git" "${RUNNER_TEMP}/repos/${r}"
          done

      - name: Check archived scenarios are covered by tests
        if: steps.archived.outputs.names != ''
        env:
          ARCHIVED: ${{ steps.archived.outputs.names }}
        run: |
          read -ra archived <<< "$ARCHIVED"
          status=0
          for c in "${archived[@]}"; do
            python3 scripts/check-scenario-coverage.py "archive/${c}" --repos "${RUNNER_TEMP}"/repos/* || status=1
          done
          exit "$status"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, buf-checks, forbidden-words, openspec-checks]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: buf-checks, openspec-checks
          jobs: ${{ toJSON(needs) }}
