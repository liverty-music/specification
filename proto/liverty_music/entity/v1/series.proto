syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/organizer.proto";
import "liverty_music/entity/v1/series_image.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// SeriesId is a globally unique identifier for an event series.
// A series groups one or more events that share metadata such as the tour
// title or official source URL. Examples: a multi-stop tour, a multi-day
// single-venue run, or a festival.
message SeriesId {
  // A UUID string mapping to the series's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// SeriesType classifies the shape of an event series so that consumers
// (notifications, UI, search) can apply the appropriate presentation and
// filtering rules. New values may be appended; existing values must not be
// renumbered.
enum SeriesType {
  // Default value; must not be used in API requests.
  SERIES_TYPE_UNSPECIFIED = 0;
  // A series of events at multiple venues by the same set of performers,
  // typically branded with a tour name (e.g. "Eras Tour 2026").
  SERIES_TYPE_TOUR = 1;
  // A standalone engagement at a single venue, spanning one or more
  // consecutive days (e.g. a single concert or "Tokyo Dome 3 Days").
  SERIES_TYPE_SINGLE = 2;
  // A multi-performer event such as a music festival
  // (e.g. "FUJI ROCK FESTIVAL 2026").
  SERIES_TYPE_FESTIVAL = 3;
}

// Visibility controls who can reach a first-party (organizer-authored) series.
// It is meaningful only for series that carry an `organizer_id`; discovered
// series leave it VISIBILITY_UNSPECIFIED. The final shape is declared now so
// that later authoring extensions are purely additive. New values may be
// appended; existing values must not be renumbered.
enum Visibility {
  // Default value. Applies to discovered (non-first-party) series, which have
  // no organizer-controlled visibility; must not be persisted for a first-party
  // series.
  VISIBILITY_UNSPECIFIED = 0;
  // The series appears in normal discovery, lists, and follower notifications.
  VISIBILITY_PUBLIC = 1;
  // The series is reachable only through a signed tokenized share URL and is
  // excluded from discovery, lists, and notifications.
  VISIBILITY_UNLISTED = 2;
  // Field 3 is reserved for a password-protected visibility, should one be
  // planned.
  reserved 3;
  reserved "VISIBILITY_PASSWORD";
}

// PublishState is the publish lifecycle of an Event of a first-party series.
// An Event of a discovered series has none and leaves it
// PUBLISH_STATE_UNSPECIFIED. A first-party Series reports a state derived from
// its Events (see Series.publish_state). New values may be appended; existing
// values must not be renumbered.
enum PublishState {
  // Default value. Applies to an Event of a discovered (non-first-party)
  // series, which does not pass through the organizer authoring lifecycle;
  // must not be persisted for an Event of a first-party series.
  PUBLISH_STATE_UNSPECIFIED = 0;
  // The event is being authored. It holds no slot of the catalog, is not a
  // Concert, and is not visible on any fan surface. A new event of a
  // first-party series starts here. A draft that will not happen is removed,
  // never cancelled.
  PUBLISH_STATE_DRAFT = 1;
  // The event has been published. It is publicly visible when its series'
  // visibility is PUBLIC, and followers of a PUBLIC series are told about it.
  PUBLISH_STATE_PUBLISHED = 2;
  // The published event has been cancelled. This is terminal: the event is
  // dropped from fan lists, keeps its event page with a cancellation banner,
  // keeps its slot, and never changes again.
  PUBLISH_STATE_CANCELLED = 3;
  // Field 4 is reserved for a scheduled-publish state, should one be planned.
  reserved 4;
  reserved "PUBLISH_STATE_SCHEDULED";
}

// Series is the parent aggregation above Event. It owns metadata that is
// shared across every stop or day of the same engagement, ensuring fields
// like title and source URL are stored exactly once per series rather than
// duplicated on every event row.
message Series {
  // The unique identifier for this series.
  SeriesId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The official title shared by all events in this series, such as a tour
  // name or festival name.
  Title title = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The classification of this series. Determines how UI and notifications
  // group and present the constituent events. `not_in: [0]` rejects the
  // SERIES_TYPE_UNSPECIFIED zero value at the proto boundary, matching the
  // spec invariant that SERIES_TYPE_UNSPECIFIED SHALL never be persisted —
  // `defined_only` alone would accept 0 because it is a declared enum value.
  SeriesType type = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  ];

  // The official source URL for series-level information (tour page,
  // festival page, or announcement page). Optional because not every
  // discovered series has a dedicated landing page. A nil wrapper
  // skips inner-Url validation by protovalidate's default presence
  // semantics (Ignore.IGNORE_UNSPECIFIED), so callers omitting the
  // field never hit the Url.value min_len / uri rules.
  Url source_url = 4 [(google.api.field_behavior) = OPTIONAL];

  // Field 5 (`merch_url`) was retired with the merch-url discovery feature.
  // The number and name are reserved so they are never reused and downstream
  // regeneration stays wire-safe.
  reserved 5;
  reserved "merch_url";

  // The free-form body text of the series page, authored by an Organizer.
  // Optional: discovered series and organizer series without a write-up leave
  // it unset. A nil wrapper skips inner-Description validation by protovalidate's
  // default presence semantics.
  Description description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Field 7 held the cover image, first as a single served Url and then as a
  // kind-tagged object under its former name; it is replaced by cover_image (field 12). The
  // name cover_image is reused with a new number and type, so the old
  // field 7 Url never decodes as a SeriesImage.
  reserved 7;
  reserved "media";

  // Who can reach this series. Set only for first-party (organizer-authored)
  // series; discovered series leave it VISIBILITY_UNSPECIFIED. Not constrained
  // to a non-zero value because this entity also represents discovered series.
  Visibility visibility = 8 [(google.api.field_behavior) = OPTIONAL];

  // The publish state of this series, derived by the server from its Events:
  // PUBLISHED when at least one Event is PUBLISHED; CANCELLED when none is
  // PUBLISHED and at least one is CANCELLED; DRAFT when every Event is DRAFT.
  // The series stores no state of its own, so a write never sets it.
  // Discovered series leave it PUBLISH_STATE_UNSPECIFIED.
  PublishState publish_state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The Organizer that authored this series. Present marks the series as
  // first-party; absent means the series originated from the discovery
  // pipeline. Optional for that reason. The unlisted share token is a
  // backend-only concern and is intentionally absent from this read entity.
  OrganizerId organizer_id = 10 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer that authored this series, resolved by the server and set
  // exactly when organizer_id is set: its id, name and, once entered, the
  // 特商法 business details a fan's checkout shows. A fan-facing read never sets
  // its platform fee rate.
  Organizer organizer = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The cover image shown on the series page, uploaded by its Organizer and
  // served as processed variants. Optional: absent for discovered series and
  // for organizer series without an uploaded image. A nil message skips the
  // inner SeriesImage validation by protovalidate's default presence semantics.
  SeriesImage cover_image = 12 [(google.api.field_behavior) = OPTIONAL];
}
