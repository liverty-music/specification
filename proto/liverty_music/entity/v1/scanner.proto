syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/public_key.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// ScannerId is a globally unique identifier for a Scanner.
// Server-generated surrogate id.
message ScannerId {
  // A UUID string mapping to the Scanner's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// ScannerNumber is the number the server gives a Scanner within its event, in
// creation order: the event's first Scanner is 1, the next 2, and so on. A
// number is never reused, even after its Scanner is REVOKED, so a number
// always means the same device in admission records. Staff and the Organizer
// see it as a label such as 受付1; the label is rendered by the client.
message ScannerNumber {
  // The number, 1 or more.
  int32 value = 1 [(buf.validate.field).int32.gte = 1];
}

// ScannerLinkToken is the secret part of the link the Organizer hands to venue
// staff for a Scanner. The server mints it from at least 128 random bits (32
// random bytes, base64url without padding, 43 characters), compares it in
// constant time, and returns it only while the Scanner is UNUSED. Holding it
// alone is not enough to admit: every call through the Scanner must also be
// signed by the device it is bound to.
message ScannerLinkToken {
  // The base64url token. Between 22 and 64 characters of the base64url alphabet.
  string value = 1 [(buf.validate.field).string = {
    min_len: 22
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

// ScannerStatus is the lifecycle of a Scanner:
// UNUSED → IN_USE → REVOKED, or UNUSED → REVOKED.
enum ScannerStatus {
  // Default value, rejected at the boundary: a persisted Scanner always records
  // a concrete status.
  SCANNER_STATUS_UNSPECIFIED = 0;

  // Created but no device has opened its link yet. Every new Scanner starts
  // UNUSED; its link token is still returned to the Organizer.
  SCANNER_STATUS_UNUSED = 1;

  // A device opened the link and bound its public key; only that device can
  // call through the Scanner. The link token is no longer returned.
  SCANNER_STATUS_IN_USE = 2;

  // The Organizer revoked the Scanner; every call through it is refused,
  // including a scan already sent but not yet decided. Terminal.
  SCANNER_STATUS_REVOKED = 3;
}

// Scanner is one device's right to admit fans to one event during that event's
// admission window, created by an Organizer for venue staff who have no
// account of their own. It grants nothing but admission to that event. The
// Organizer hands it over as a link that carries its link token; the first
// device that opens the link creates an ECDSA P-256 key pair and binds the
// public key, and every later call must be signed with that device's private
// key, so a forwarded link is useless on another device.
message Scanner {
  // The unique identifier for this Scanner. Server-generated surrogate id.
  ScannerId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The one event the Scanner admits to. Its concert must be owned by the
  // creating Organizer and published.
  EventId event_id = 2 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).required = true
  ];

  // The Scanner's number within its event, assigned on creation.
  ScannerNumber number = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The secret part of the Scanner's link. Set only while the Scanner is
  // UNUSED, in the responses that return it to the owning Organizer (Create
  // and ListByEvent); never returned once a device is bound, and never to the
  // scanner device.
  ScannerLinkToken link_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The public key of the device the Scanner is bound to. Absent until a
  // device opens the link; set once and never changed.
  PublicKey bound_public_key = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The Scanner's lifecycle status. Server-owned.
  ScannerStatus status = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // When a device first opened the link. Absent until the Scanner is bound.
  google.protobuf.Timestamp bind_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the Organizer revoked the Scanner. Absent until revoked.
  google.protobuf.Timestamp revoke_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AdmissionWindow is when a Scanner can admit, derived from its event's
// current local date and start time in Japan time: from 3 hours before the
// start time until 04:00 on the day after the local date. The open time does
// not affect it, because an event may have none. A time is inside it when
// it is at or after open_time and before close_time. An event without a start
// time has no admission window. The window is fixed, not configurable.
message AdmissionWindow {
  // The window always closes after it opens.
  option (buf.validate.message).cel = {
    id: "admission_window.order"
    message: "close_time must be after open_time"
    expression: "this.close_time > this.open_time"
  };

  // When admission opens (inclusive).
  google.protobuf.Timestamp open_time = 1 [(buf.validate.field).required = true];

  // When admission closes (exclusive).
  google.protobuf.Timestamp close_time = 2 [(buf.validate.field).required = true];
}
