syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/identity_verification.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/user.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// TicketId is a globally unique identifier for a single issued Ticket.
// Server-generated surrogate id.
message TicketId {
  // A UUID string mapping to the ticket's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// TicketStatus is the lifecycle of an issued Ticket. A ticket is issued as
// ISSUED and voided when its Order is refunded (event cancellation or
// dispute). Admission at the venue is not a status: it is recorded as the
// ticket's `admit_time`, which is kept when the ticket is later voided. New values may be appended and
// existing values must not be renumbered.
enum TicketStatus {
  // Default value, rejected at the boundary: a persisted Ticket always records a
  // concrete status.
  TICKET_STATUS_UNSPECIFIED = 0;

  // Issued and valid — the normal state on issuance from an Order.
  TICKET_STATUS_ISSUED = 1;

  // Voided — the ticket's Order was refunded (cancellation / dispute), so the
  // ticket is no longer valid for entry.
  TICKET_STATUS_VOIDED = 2;
}

// Ticket is one account-bound admission right to an event, issued from an
// Order (a won LotteryEntry or a Committed Checkout). Admission at the venue is
// recorded on it as `admit_time`.
//
// A ticket is admissible exactly when it is ISSUED and has no `admit_time`:
// a VOIDED ticket is refused, and an admitted ticket is never admitted again.
//
// Every issued Ticket is a covered ticket (特定興行入場券) carrying ALL THREE legal
// conditions:
//   (i)   the face states resale without the Organizer's consent is prohibited
//         (`resale_without_consent_prohibited`, always true);
//   (ii)  the face specifies date/venue (via `event_id`) + the eligible person
//         (the ticket's User; admission is general with no seat map);
//   (iii) the User's 本人確認 is bound to the account: the face shows the User's
//         current full name and phone number, and `identity_verification_id`
//         is set where the sale required verification.
message Ticket {
  // The unique identifier for this ticket. Server-generated surrogate id.
  TicketId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The Order that issued this ticket. One Order issues all tickets of its
  // source, each referencing that Order here.
  OrderId order_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The User account the ticket is bound to: the user of the Order that issued
  // it. It never changes; official resale voids this ticket and issues a new
  // one on the new Order instead of reassigning it.
  UserId user_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The event this ticket admits to. Supplies the covered-ticket face's
  // date/venue (condition ii); the event's current start time also gates the
  // Organizer payout.
  EventId event_id = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Covered-ticket condition (i): the face states resale without the Organizer's
  // consent is prohibited. Constrained to true — every issued ticket asserts this
  // so it qualifies as a 特定興行入場券.
  bool resale_without_consent_prohibited = 7 [(buf.validate.field).bool.const = true];

  // The ticket's lifecycle status (ISSUED on issuance; VOIDED on refund).
  // Server-owned.
  TicketStatus status = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // When the ticket was issued (the Order's capture and issuance time). Server-owned.
  google.protobuf.Timestamp issue_time = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // When the ticket was admitted at the venue. Absent until admitted; set
  // once, together with its Admission, and kept when the ticket
  // is later VOIDED (a refund after entry does not erase that the User was
  // admitted). Server-owned.
  google.protobuf.Timestamp admit_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IdentityVerification this ticket is bound to, set only when the sale
  // required verification. Unset otherwise.
  IdentityVerificationId identity_verification_id = 11 [(google.api.field_behavior) = OPTIONAL];

  // Field 5 was the 本人確認 details copied onto the ticket, which now live on
  // the User. Field 3 is the user_id under a former name. Field 6 was the
  // IdentityVerification reference under its former names, replaced by
  // identity_verification_id.
  reserved 5, 6;
  reserved "holder_identity", "holder_id", "verified_identity_ref", "kyc_id";
}
