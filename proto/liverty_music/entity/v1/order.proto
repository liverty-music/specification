syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/checkout.proto";
import "liverty_music/entity/v1/lottery_entry.proto";
import "liverty_music/entity/v1/user.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// OrderId is a globally unique identifier for a single Order — the purchase
// record of one won LotteryEntry or one Committed Checkout. Server-generated
// surrogate id; it never encodes any payment data.
message OrderId {
  // A UUID string mapping to the order's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// PaymentProvider names which payment provider holds an Order's captured
// payment. The Order stores only the payment provider's IDs, so switching
// provider is a config/adapter change, not a proto break. New values may be
// appended; existing values must not be renumbered.
enum PaymentProvider {
  // Default value, rejected at the boundary: a persisted Order always records a
  // concrete provider.
  PAYMENT_PROVIDER_UNSPECIFIED = 0;

  // The MVP payment provider. The LotteryEntry or Checkout owns the
  // CardAuthorization that is captured; the Order records only the provider's
  // IDs for the captured payment.
  PAYMENT_PROVIDER_STRIPE = 1;

  // A challenger provider kept swappable behind the provider IDs (#778).
  // Reserved so adopting it is a no-proto-break provider switch.
  PAYMENT_PROVIDER_KOMOJU = 2;
}

// Payment is the payment provider's IDs for the captured payment of an Order's
// source, plus the display-only facets safe to retain. It never holds raw card
// data: NEVER a PAN, CVC, or expiry. It is recorded from the source's captured
// CardAuthorization — the Order performs no separate charge of its own. It is
// a value object embedded in an Order, not a standalone addressable entity.
message Payment {
  // ProviderPaymentId is the payment provider's ID for a captured payment.
  // Opaque; meaningful only to the provider.
  message ProviderPaymentId {
    // The provider's payment id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // ProviderPaymentMethodId is the payment provider's ID for the payment method
  // used. Opaque; meaningful only to the provider.
  message ProviderPaymentMethodId {
    // The provider's payment method id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // Which provider holds the captured payment. Drives which adapter interprets
  // the provider IDs below.
  PaymentProvider provider = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Display-only card brand facet (e.g. "visa", "mastercard"), safe to show the
  // User. Optional, never used for authorization. The accepted card brands rule
  // is the CardAuthorization's (a lottery entry rejects American Express; a
  // first-come checkout accepts every brand), not applied here.
  string card_brand = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 40
  ];

  // Display-only last four digits of the card, safe to show the User. Optional;
  // this is NOT the PAN (only the trailing four, which providers permit storing).
  string card_last4 = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {pattern: "^([0-9]{4})?$"}
  ];

  // The payment provider's ID for the captured payment. The Order references it
  // and never charges it again.
  ProviderPaymentId provider_payment_id = 6 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The payment provider's ID for the payment method used, when the provider
  // exposes one. Optional.
  ProviderPaymentMethodId provider_payment_method_id = 7 [(google.api.field_behavior) = OPTIONAL];

  // Fields 2 and 3 were the provider's ids as bare strings under the provider's
  // own object names, replaced by provider_payment_id and
  // provider_payment_method_id.
  reserved 2, 3;
  reserved "payment_intent_ref", "payment_method_ref";
}

// OrderStatus is the lifecycle of an Order. There is deliberately NO `pending`
// state: the Order is created from an already-captured payment, so it is `paid`
// on creation (the state before capture lives on the CardAuthorization of the
// LotteryEntry or the Checkout, not here). New values may be appended; existing
// values must not be renumbered.
enum OrderStatus {
  // Default value, rejected at the boundary: a persisted Order always records a
  // concrete status.
  ORDER_STATUS_UNSPECIFIED = 0;

  // Paid — the normal state on creation. The Order is built from its source's
  // captured payment, so funds are already captured (held on the platform
  // balance) when the Order exists.
  ORDER_STATUS_PAID = 1;

  // Refunded — the captured payment was refunded (event cancellation 中止 or
  // dispute) with a payment provider refund plus a claw-back of the
  // Organizer's payout.
  ORDER_STATUS_REFUNDED = 2;

  // Failed — the capture-succeeded-but-issuance-refunded edge: the capture
  // succeeded but the Tickets could not be issued, so it refunded the captured
  // payment to avoid money-captured-with-no-ticket. Distinct from `refunded`,
  // which follows a successfully issued Order.
  ORDER_STATUS_FAILED = 3;
}

// Order is a provider- and method-agnostic purchase record: the payment
// provider's IDs for the captured payment, the Order's own status, its total
// amount and currency, the capture time, and display-only facets. It has
// exactly one source — a won LotteryEntry or a Committed Checkout — and ONE
// Order covers all N tickets of that source. At most one Order exists per
// source (issuance idempotency).
//
// It is created only from an already-captured payment (the won entry's or the
// checkout's captured CardAuthorization); the Order performs no separate
// off-session charge. The Order NEVER stores a PAN, CVC, or expiry — only the
// payment provider's IDs and safe display facets (PCI SAQ A).
message Order {
  // ProviderRefundId is the payment provider's ID for a refund of an Order.
  // Opaque; meaningful only to the provider.
  message ProviderRefundId {
    // The provider's refund id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // The unique identifier for this order. Server-generated surrogate id.
  OrderId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The User account that bought the tickets: the user of the won LotteryEntry
  // or of the Checkout. The tickets this Order issues are bound to this account.
  UserId user_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // What this Order was bought through. Exactly one is set, and at most one
  // Order exists per source (issuance idempotency, enforced server-side).
  oneof source {
    option (buf.validate.oneof).required = true;

    // The won LotteryEntry this Order is purchased by.
    LotteryEntryId lottery_entry_id = 10;

    // The first-come Checkout this Order completes: one that was committed and
    // charged.
    CheckoutId checkout_id = 11;
  }

  // The payment provider's IDs for the source's captured payment plus safe
  // display facets. Never raw card data.
  Payment payment = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The order's own status — `paid` on creation (see OrderStatus: no `pending`).
  OrderStatus status = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // The total captured amount, a positive whole number in the currency's
  // smallest unit. For the MVP (JPY) this is yen, which has no minor unit, so the
  // value is the yen total (the per-ticket price × ticket count).
  int64 amount = 6 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gt = 0
  ];

  // The ISO 4217 currency code of `amount`, fixed to JPY for the MVP but carried
  // as a field so the record stays currency-agnostic. Three upper-case letters.
  string currency = 7 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      len: 3
      pattern: "^[A-Z]{3}$"
    }
  ];

  // When the Order was recorded as paid (after the lottery draw's capture or the
  // checkout's charge). Because the Order is created already paid, this is
  // effectively its creation time.
  // Server-owned.
  google.protobuf.Timestamp pay_time = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The payment provider's ID for the refund issued to the user. Absent unless
  // the Order was refunded for a cancellation. Server-owned.
  ProviderRefundId provider_refund_id = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the purchase confirmation email was sent to the user. Absent until
  // sent; set once. Server-owned.
  google.protobuf.Timestamp confirmation_send_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Fields 3 and 9 were the lottery application and the reservation sources,
  // replaced by lottery_entry_id and checkout_id. Field 2 was renamed from
  // buyer_id.
  reserved 3, 9;
  reserved "application_id", "reservation_id", "buyer_id";
}
