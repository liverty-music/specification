syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/user.proto";

// Organizer represents a vetted ticket-selling business - a record label, management agency,
// promoter or self-publishing artist - that an admin creates to manage the
// artists it represents. Existence is the vetting: an Organizer exists only
// because an admin created it, so there is no separate `verified` flag and no
// self-serve registration. An Organizer is distinct from an Artist — an artist
// self-publishing gets its own Organizer with a distinct OrganizerId. The
// people who run an Organizer sign in through its own Organization at the
// identity provider, named by the Organizer's short name.
//
// The provider Organizer ID (the identity provider's ID for the Organizer's
// Organization) and the owner email are backend-only concerns and are
// intentionally not part of this consumer entity.
message Organizer {
  // ProviderOrganizerId is the identity provider's ID for the Organizer's
  // Organization. Only calls between backend workloads carry it.
  message ProviderOrganizerId {
    // The identity provider's organization id, at least 1 character.
    string value = 1 [(buf.validate.field).string.min_len = 1];
  }

  // The unique identifier for the Organizer.
  OrganizerId id = 1 [(buf.validate.field).required = true];

  // The display name of the Organizer (e.g., the label or promoter name).
  OrganizerName name = 2 [(buf.validate.field).required = true];

  // The platform fee applied to the Organizer's future Orders, in basis points
  // (hundredths of a percent): 0 to 3000, i.e. 0% to 30%. 800 (8%) for a new
  // Organizer. Set by an admin. Each Settlement keeps the rate it was created
  // with, so a change never alters an issued Order's split. A fan-facing read
  // never sets it.
  int32 platform_fee_rate_bps = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 3000
    }
  ];

  // The 販売業者の名称 (the legal name of the business) in the 特商法
  // (Specified Commercial Transactions Act) disclosure shown to fans when they
  // buy the Organizer's tickets. Entered by an admin during vetting. The five
  // business details are absent until entered, and the Organizer's events can
  // go on sale only once all five are present.
  LegalName legal_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer's 代表者 (representative), in the 特商法 disclosure. Absent
  // until entered.
  RepresentativeName representative_name = 6 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer's business address, in the 特商法 disclosure. Absent until
  // entered.
  BusinessAddress business_address = 7 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer's business phone number in E.164 form, in the 特商法
  // disclosure. Absent until entered.
  PhoneNumber business_phone_number = 8 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer's contact email, in the 特商法 disclosure. Absent until
  // entered.
  Email contact_email = 9 [(google.api.field_behavior) = OPTIONAL];

  // The Organizer's short name: a unique, never-changed handle chosen by an
  // admin at creation. It names the Organizer's Organization at the identity
  // provider and the organizer console's sign-in address
  // (`?org=<short name>`). Set on admin and organizer reads; a fan-facing read
  // never sets it.
  OrganizerShortName short_name = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The Organizer's lifecycle status. Set on admin reads; a fan-facing read
  // never sets it.
  OrganizerStatus status = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Field 3 was the business details as one value, replaced by the five fields
  // above.
  reserved 3;
  reserved "seller_details";
}

// OrganizerStatus is where an Organizer is in its lifecycle: provisioning,
// then active, and deactivated from either. A deactivated Organizer can be
// deleted.
enum OrganizerStatus {
  // The status is not set, as on a fan-facing read.
  ORGANIZER_STATUS_UNSPECIFIED = 0;
  // The Organizer's Organization at the identity provider is not ready yet.
  ORGANIZER_STATUS_PROVISIONING = 1;
  // The Organizer is in operation.
  ORGANIZER_STATUS_ACTIVE = 2;
  // The Organizer is turned off: the backend refuses every operation on it
  // except Delete.
  ORGANIZER_STATUS_DEACTIVATED = 3;
}

// LegalName is an Organizer's 販売業者の名称 (the legal name of the
// business) shown in the 特商法 (Specified Commercial Transactions Act) disclosure,
// e.g. the registered company name.
message LegalName {
  // The legal name, 1 to 200 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// RepresentativeName is the 代表者 (representative) of an Organizer, shown in the
// 特商法 disclosure.
message RepresentativeName {
  // The representative's name, 1 to 100 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// BusinessAddress is an Organizer's business address (所在地), shown in the 特商法
// disclosure.
message BusinessAddress {
  // The address, 1 to 300 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
}

// OrganizerId is a globally unique identifier for an Organizer.
message OrganizerId {
  // A UUID string mapping to the Organizer's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// OrganizerName represents the public display name of an Organizer.
message OrganizerName {
  // The name string, required to be between 1 and 200 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// OrganizerShortName is an Organizer's short name: 3 to 32 lowercase letters
// `a`-`z`, digits and hyphens, starting with a letter, e.g. `xx-records`.
// `admin` and `liverty-music` are reserved for the admin and product
// Organizations.
message OrganizerShortName {
  // The short name string.
  string value = 1 [(buf.validate.field).string = {
    pattern: "^[a-z][a-z0-9-]{2,31}$"
    not_in: [
      "admin",
      "liverty-music"
    ]
  }];
}
