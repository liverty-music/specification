syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/user.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// NotificationId is a globally unique identifier for a stored notification record.
//
// The identifier is minted by the backend when the notification is first
// persisted and is also propagated into the dispatched push payload
// (data.notification_id), so clients can reference the same notification when
// marking it read.
message NotificationId {
  // A UUID string identifying the notification record.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// NotificationType is what produced a Notification. New values may be
// appended; existing values must not be renumbered.
enum NotificationType {
  reserved 4;
  reserved "NOTIFICATION_TYPE_ORDER_CONFIRMATION";

  // Default value; never stored.
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  // New concerts of an artist the fan follows.
  NOTIFICATION_TYPE_NEW_CONCERTS = 1;
  // A reminder of a ticket sale.
  NOTIFICATION_TYPE_SALES_REMINDER = 2;
  // The announcement of a discovered ticket sale.
  NOTIFICATION_TYPE_TICKET_SALE_ANNOUNCEMENT = 3;
  // The result of a lottery the fan lost.
  NOTIFICATION_TYPE_LOTTERY_LOSS = 5;
  // An official resale application whose card authorization expired before a
  // ticket was found; nothing was charged.
  NOTIFICATION_TYPE_RESALE_ENTRY_LAPSED = 6;
  // An official resale application that ended without a ticket: none left at
  // the last draw, the concert cancelled, a win that could not be charged, or
  // a win whose payment could not be completed before the show; nothing was
  // charged.
  NOTIFICATION_TYPE_RESALE_ENTRY_LOST = 7;
  // The concert of a Paid Order was cancelled (中止) and the tickets the fan
  // still holds are refunded.
  NOTIFICATION_TYPE_CONCERT_CANCELLED = 8;
  // An Order was refunded for a cancelled concert, with the amount.
  NOTIFICATION_TYPE_ORDER_REFUNDED = 9;
  // A lottery the fan won, with its paid Order.
  NOTIFICATION_TYPE_LOTTERY_WIN = 10;
  // An official resale application the fan won, with its paid Order.
  NOTIFICATION_TYPE_RESALE_WIN = 11;
}

// NotificationMessage is the content of a Notification, rendered by the server
// in the fan's language each time it is pushed or listed.
message NotificationMessage {
  // The title shown on the device.
  string title = 1 [(buf.validate.field).string.min_len = 1];
  // The body shown on the device.
  string body = 2 [(buf.validate.field).string.min_len = 1];
  // A later message with the same tag replaces an earlier one on the device.
  string tag = 3;
  // The in-app link and the notification id, read by the app when the fan
  // opens the message.
  map<string, string> data = 4;
}

// Notification is the durable record of one message sent to one fan: what it
// is about and whether the fan has read it. It exists whether or not the push
// reached the fan.
message Notification {
  reserved 5, 6, 8, 10;
  reserved "delivery_status", "failure_reason", "deliver_time", "dismiss_time";

  // The notification's identity, also carried inside the pushed message.
  NotificationId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The fan the Notification is for.
  UserId user_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // What produced it.
  NotificationType type = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // The content, rendered when the Notification is read from the server.
  NotificationMessage message = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // When the Notification was recorded.
  google.protobuf.Timestamp create_time = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // When the fan read it. Absent until read.
  google.protobuf.Timestamp read_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}
