syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/series.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// SalesPhaseId is a globally unique identifier for a single ticket-sales phase.
// Each phase is a distinct selling opportunity (e.g. a fan-club presale or a
// general lottery round) within a series, and this surrogate id is the phase's
// only hard identity — the handle that the reminder sent-log references.
message SalesPhaseId {
  // A UUID string mapping to the sales phase's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// SalesMethod classifies how tickets are allocated within a sales phase. It is
// the only classification of a phase. New values may be appended; existing
// values must not be renumbered.
enum SalesMethod {
  // Default value; never a valid state for a stored phase.
  SALES_METHOD_UNSPECIFIED = 0;
  // Tickets are allocated by lottery (抽選販売): applicants enter a draw and only
  // winners proceed to payment. The dominant method in the Japanese live market.
  SALES_METHOD_LOTTERY = 1;
  // Tickets are sold first-come, first-served (先着販売) until they sell out.
  SALES_METHOD_FIRST_COME = 2;
}

// SalesPhase models one ticket-sales opportunity for a series (tour): one
// application period under one method, such as a fan-club lottery, a playguide
// presale or a general on-sale. A single tour can announce several phases, and
// each phase belongs to one Series and applies to that series as a whole.
//
// The required milestones depend on the method. Every phase has an apply start
// time. A lottery also has an apply end time and may have a lottery result time.
// A first-come phase may omit its apply end time, which means the sale ends when
// tickets run out, and never has a lottery result time.
message SalesPhase {
  // A lottery has a close; only a lottery has a result time. CEL sees enums as
  // integers, so 1 is SALES_METHOD_LOTTERY.
  option (buf.validate.message).cel = {
    id: "sales_phase.method_milestones"
    message: "a lottery requires apply_end_time, and only a lottery may have lottery_result_time"
    expression: "this.method == 1 ? has(this.apply_end_time) : !has(this.lottery_result_time)"
  };

  // The unique identifier for this sales phase. Server-generated surrogate id;
  // it is the phase's only hard identity. Re-discovery converges to it through
  // the series, the method and the apply start date in Japan time.
  SalesPhaseId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The series (tour) this phase belongs to. A phase applies to its series as a
  // whole, and the phases relevant to an event are resolved via that event's
  // series (event → series → the series' phases).
  SeriesId series_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // How tickets are allocated. Required: a phase is either a lottery or a
  // first-come sale.
  SalesMethod method = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // When applications open (受付開始). Required — it anchors the "application
  // open" reminder.
  google.protobuf.Timestamp apply_start_time = 8 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // When applications close (受付終了). Required for a lottery, where it anchors
  // the 24-hour-before reminder. Absent on a first-come phase that ends when
  // tickets run out. Must be after `apply_start_time`.
  google.protobuf.Timestamp apply_end_time = 9 [(google.api.field_behavior) = OPTIONAL];

  // When lottery results are announced (当落発表). Only on a lottery, and absent
  // when not yet announced. Anchors the result-day reminder; must not be before
  // `apply_end_time`.
  google.protobuf.Timestamp lottery_result_time = 10 [(google.api.field_behavior) = OPTIONAL];

  // Field 3 was `repeated EventId event_ids` (per-event coverage subset),
  // removed when the phase became series-level. Fields 5, 6, 7, 11 and 12 were
  // `channel`, `provider_name`, `sequence`, `payment_deadline_time` and `url`,
  // removed when the method became the only classification. Reserved to
  // prevent reuse.
  reserved 3, 5, 6, 7, 11, 12;
  reserved "event_ids", "channel", "provider_name", "sequence", "payment_deadline_time", "url";
}
