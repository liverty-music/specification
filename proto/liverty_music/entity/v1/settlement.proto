syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/organizer.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// SettlementId is a globally unique identifier for a single Settlement — one
// Order's payout record. Server-generated surrogate id.
message SettlementId {
  // A UUID string mapping to the settlement's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// SettlementStatus is the lifecycle of a Settlement (an Order's payout). New values
// may be appended; existing values must not be renumbered.
enum SettlementStatus {
  // Default value, rejected at the boundary: a persisted Settlement always records
  // a concrete status.
  SETTLEMENT_STATUS_UNSPECIFIED = 0;

  // Held — the captured funds stay with the platform and the release gate
  // (event start time + dispute buffer) has not passed; no payout has been made.
  SETTLEMENT_STATUS_HELD = 1;

  // Released — the payee split(s) have been paid out to the Organizer's
  // PayoutAccount (the platform retains its fee as the remainder).
  SETTLEMENT_STATUS_RELEASED = 2;

  // Reversed — a refund or dispute clawed the paid-out split(s) back (event
  // cancellation or chargeback).
  SETTLEMENT_STATUS_REVERSED = 3;
}

// SettlementSplit is one payee's share of a Settlement, plus the payment
// provider's IDs for the payout that pays it and any reversal that claws it
// back. The payout is modelled as a SET of splits so additional payees (venue,
// artist) can be added later without a schema break; the MVP has exactly one
// split — the Organizer — and the platform fee is the retained remainder, never
// a split. Each split is paid out separately, tied to the Settlement's captured
// charge, and the sum of all splits never exceeds the Order's amount.
message SettlementSplit {
  // ProviderPayoutId is the payment provider's ID for the payout of a split.
  // Opaque; meaningful only to the provider.
  message ProviderPayoutId {
    // The provider's payout id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // ProviderPayoutReversalId is the payment provider's ID for the claw-back of
  // a split's payout. Opaque; meaningful only to the provider.
  message ProviderPayoutReversalId {
    // The provider's payout reversal id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // The payee that receives this split. For the MVP this is always the Organizer.
  OrganizerId payee_organizer_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The payee's net share, a positive whole number in the Order currency's smallest
  // unit (yen for the JPY MVP). The sum of all splits must not exceed the charge.
  int64 amount = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gt = 0
  ];

  // The payment provider's ID for the payout of this split. Absent until the
  // split is released. Server-owned.
  ProviderPayoutId provider_payout_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The payment provider's ID for the claw-back of this split on a refund or
  // dispute. Absent unless reversed. Server-owned.
  ProviderPayoutReversalId provider_payout_reversal_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Fields 3 and 4 were the provider's ids under the provider's own object
  // names, replaced by provider_payout_id and provider_payout_reversal_id.
  reserved 3, 4;
  reserved "transfer_ref", "transfer_reversal_ref";
}

// Settlement is the payout record for one Order's captured money under the
// 収納代行 (collection agency) scheme, with the Organizer as seller of record:
// the money stays with the platform while the Settlement is Held, each payee's
// split is paid out to the payee's PayoutAccount when it is Released, the
// platform keeps the remainder as its fee, and payouts are clawed back when it
// is Reversed. It stores only the payment provider's IDs and its own status,
// never a raw provider status.
message Settlement {
  // ProviderChargeId is the payment provider's ID for the captured charge a
  // Settlement's payouts are tied to. Opaque; meaningful only to the provider.
  message ProviderChargeId {
    // The provider's charge id, 1 to 255 characters.
    string value = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // The unique identifier for this settlement. Server-generated surrogate id.
  SettlementId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The Order this settlement pays out. One Settlement per Order.
  OrderId order_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The payout splits. Exactly one (the Organizer) in the MVP; the platform fee is
  // the retained remainder, not a split. The sum of split amounts never exceeds the
  // Order's captured amount.
  repeated SettlementSplit splits = 4 [(buf.validate.field).repeated.min_items = 1];

  // The settlement's own status — `held` until the release gate passes, then
  // `released`, or `reversed` after a refund/dispute clawback.
  SettlementStatus status = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // When the splits were paid out. Empty while the settlement is still held.
  // Server-owned.
  google.protobuf.Timestamp release_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The payment provider's ID for the captured charge the payouts are tied to.
  // Absent until resolved at release. Server-owned.
  ProviderChargeId provider_charge_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The Organizer receiving the payout. Server-owned.
  OrganizerId organizer_id = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The event whose start time gates the release. Server-owned.
  EventId event_id = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // When the Settlement was recorded. Server-owned.
  google.protobuf.Timestamp create_time = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // Field 3 was the provider's charge id as a bare string, replaced by
  // provider_charge_id. Field 7 was the platform fee rate, which the
  // Organizer carries.
  reserved 3, 7;
  reserved "charge_ref", "platform_fee_rate_bps";
}
