syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/series.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// TicketSaleId is a globally unique identifier for a single TicketSale.
message TicketSaleId {
  // A UUID string mapping to the ticket sale's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// TicketSaleName is the label of a TicketSale that fans and the Organizer's
// members see, for example ファンクラブ先行 (fan-club presale) or 一般発売
// (general sale).
message TicketSaleName {
  // The name, 1 to 100 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// TicketSaleMethod is how a TicketSale allocates its tickets. New values may be
// appended; existing values must not be renumbered.
enum TicketSaleMethod {
  // Default value, rejected at the boundary: a persisted sale always records a
  // concrete method.
  TICKET_SALE_METHOD_UNSPECIFIED = 0;

  // First come, first served: a fan who starts a Checkout while tickets remain
  // holds them for 15 minutes and buys them by completing the Checkout.
  TICKET_SALE_METHOD_FIRST_COME = 1;

  // Lottery (抽選): fans enter a LotteryEntry with a card authorization during
  // the window, at most once for each event the sale names, and after the
  // window closes one draw per TicketStock allocates its remaining tickets.
  // Winners are charged; the other card authorizations are released.
  TICKET_SALE_METHOD_LOTTERY = 2;
}

// VerificationRequirement is whether fans must hold an Active
// IdentityVerification to take part in a TicketSale, and if so whether the
// driver's-licence method is admitted. The zero value means no requirement and
// is the valid default. New values may be appended; existing values must not be
// renumbered.
enum VerificationRequirement {
  // No verification is required (None, the default). Anyone may take part; only
  // per-account limits apply.
  VERIFICATION_REQUIREMENT_UNSPECIFIED = 0;

  // Verified-any: an Active IdentityVerification by any method is required,
  // including the driver's licence (weaker dedupe).
  VERIFICATION_REQUIREMENT_VERIFIED_ANY = 1;

  // JPKI-only: an Active IdentityVerification by マイナンバーカード (My Number
  // Card, JPKI) is required; the driver's licence is not admitted. For the
  // highest-demand shows.
  VERIFICATION_REQUIREMENT_JPKI_ONLY = 2;
}

// TicketSale is the platform's own sale opportunity for some or all events of
// an Organizer's Series, such as a fan-club presale or a general sale (受付):
// its name, how tickets are allocated, the window in which fans take part,
// whether they must hold an Active IdentityVerification and the events it
// sells. It sells every TicketStock of those events, and every sale of an
// event sells from the same stocks. Two sales of one event never overlap
// (checked server-side).
//
// This message carries an Organizer's sale only. A discovered sale (a sale
// announced on an artist's official pages for a Series without an Organizer)
// is also stored as a TicketSale on the server, with a name and an end time
// and no event, but it is never returned over RPC: it reaches fans only as
// push notifications.
//
// A closed LOTTERY sale is drawn once none of its entries is ENTERED; there is
// no stored draw time.
message TicketSale {
  // The sale window must end after it starts.
  option (buf.validate.message).cel = {
    id: "ticket_sale.window"
    message: "sale_end_time must be after sale_start_time"
    expression: "this.sale_end_time > this.sale_start_time"
  };

  // A lottery window lasts 1 to 14 days inclusive. CEL has no day unit, so 1
  // day is 24h and 14 days are 336h; CEL sees enums as integers, so 2 is
  // TICKET_SALE_METHOD_LOTTERY.
  option (buf.validate.message).cel = {
    id: "ticket_sale.lottery_window"
    message: "a lottery window must last 1 to 14 days"
    expression:
      "this.method != 2"
      "|| (this.sale_end_time - this.sale_start_time >= duration('24h')"
      "&& this.sale_end_time - this.sale_start_time <= duration('336h'))"
  };

  // A sale names each event at most once.
  option (buf.validate.message).cel = {
    id: "ticket_sale.distinct_events"
    message: "event_ids must name each event at most once"
    expression: "this.event_ids.map(e, e.value).unique()"
  };

  // The unique identifier for this sale. Server-generated surrogate id.
  TicketSaleId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // How the sale allocates its tickets. Chosen when the sale is created.
  TicketSaleMethod method = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // When the sale opens. Entered and shown in Japan time.
  google.protobuf.Timestamp sale_start_time = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // When the sale closes. After the sale start; for a lottery, 1 to 14 days
  // after it. For a lottery, before the start of every event the sale names;
  // for a first-come sale, no later than the start of any of them (checked
  // server-side). Entered and shown in Japan time.
  google.protobuf.Timestamp sale_end_time = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The Series whose events the sale offers.
  SeriesId series_id = 14 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The label fans and the Organizer's members see, for example ファンクラブ先行.
  TicketSaleName name = 15 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Whether fans must hold an Active IdentityVerification to take part.
  // UNSPECIFIED (None) when not given.
  VerificationRequirement verification_requirement = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true
  ];

  // The events the sale sells, at least one, each an event of the sale's
  // Series (checked server-side). The sale sells every TicketStock of these
  // events, including a stock created while the sale runs.
  repeated EventId event_ids = 20 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Fields 2, 6 to 9 and 11 to 13 were the per-event sale's event, price,
  // per-account limit, quantity, sold count, held count, state and low stock,
  // which moved to TicketType and then to TicketStock and Event. Field 10 was a creation time that was never
  // exposed.
  // Field 17 was the draw time under its former name, replaced by draw_time.
  // Field 18 was the sale's TicketTypes, replaced by event_ids and the events'
  // TicketStocks. Field 19 was the draw time, removed because a lottery is
  // drawn once none of its entries is ENTERED.
  reserved 2, 6 to 13, 17, 18, 19;
  reserved "event_id", "price", "per_account_limit", "quantity", "sold_count", "create_time", "held_count", "state", "low_stock", "drawn_time", "ticket_types", "draw_time";
}
