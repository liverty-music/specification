syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/event.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// Concert is the music kind of Event: one Event together with the Artists
// performing at it. The generic Event holds the date, venue and Series
// reference; Concert adds only what is specific to music.
//
// A Concert carries ids, not the Series or Artists themselves. Every response
// that returns Concerts also returns each Series and Artist they refer to,
// once each, in its `series` and `artists` lists; the Concert reaches its
// Series through `event.series_id` and its Artists through `artist_ids`.
message Concert {
  option (buf.validate.message).cel = {
    id: "concert.distinct_artists"
    message: "artist_ids must not repeat an artist"
    expression: "this.artist_ids.map(a, a.value).unique()"
  };

  // Field numbers 1-12 held the previous flat shape (id, venue, dates, the
  // embedded Series and the performing Artists), now carried by `event`,
  // `artist_ids` and the response's side lists. Reserved so a stale client
  // fails loudly instead of misreading.
  reserved 1 to 12;
  reserved "id", "artist_id", "venue_id", "local_date", "start_time", "open_time", "title", "source_url", "venue", "listed_venue_name", "series", "performers";

  // The Event this Concert is. The Concert's id is the Event's id, and its
  // Series is the one `event.series_id` names.
  Event event = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The ids of the Artists performing at this Concert, in display order.
  // Always contains at least one id, each at most once; more than one is used
  // for festivals, co-headlining bills and support acts. The Artists
  // themselves are in the response's `artists` list.
  repeated ArtistId artist_ids = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).repeated.min_items = 1
  ];
}
