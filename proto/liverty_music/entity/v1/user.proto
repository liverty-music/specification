syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/coordinates.proto";
import "liverty_music/entity/v1/entity.proto";

// UserId is a globally unique identifier for a platform user.
message UserId {
  // A UUID string representing the user's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// FullName is the 本人確認 (identity check) name of a User, shown on their
// tickets and prefilled at lottery entry and checkout.
message FullName {
  // The full name (氏名), 1 to 200 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// PhoneNumber is a phone number in E.164 form: "+" then 2 to 15 digits, the
// first not 0 (e.g. "+819012345678"). A domestic format such as "090-1234-5678"
// is rejected.
message PhoneNumber {
  // The E.164 phone number, at most 16 characters.
  string value = 1 [(buf.validate.field).string = {
    max_len: 16
    pattern: "^\\+[1-9][0-9]{1,14}$"
  }];
}

// User represents a registered person on the Liverty Music platform.
// Users are notified of upcoming concerts based on their following and favorite artists.
message User {
  // ProviderUserId is the identity provider's ID for a User: the subject of the
  // User's sign-in token. It links the sign-in account to the local User.
  message ProviderUserId {
    // The identity provider's user id, at least 1 character.
    string value = 1 [(buf.validate.field).string.min_len = 1];
  }

  // The unique identifier for the user.
  UserId id = 1 [(buf.validate.field).required = true];

  // The primary email address used for account identity and notifications.
  Email email = 2 [(buf.validate.field).required = true];

  reserved 3;

  // The user's display name, synced from the identity provider.
  string name = 5;

  // The user's home area — the geographic region where the user regularly attends
  // live events without considering it a trip (遠征).
  // Used as the baseline for proximity classification: events in the home area
  // are classified as HOME, nearby areas as NEARBY, and everything else as AWAY.
  // Absent until the user explicitly selects their area during onboarding or in settings.
  Home home = 6;

  // The user's preferred display language as an ISO 639-1 two-letter code
  // (e.g., "ja", "en"). Used to render the UI in the user's chosen language
  // and to localize user-facing notifications.
  //
  // Absent (NULL in storage) until the client first asserts a preference —
  // either via Create at signup or via SetPreferredLanguage for legacy
  // rows that predate this field. Clients observing an absent value SHALL
  // backfill it by calling SetPreferredLanguage with their currently
  // effective locale, so that subsequent sessions can rely on the backend
  // as the single source of truth for the user's language preference.
  optional string preferred_language = 7 [(buf.validate.field).string = {
    min_len: 2
    pattern: "^[a-z]{2}$"
  }];

  // The 本人確認 (identity check) name shown on the user's tickets and
  // prefilled at lottery entry and checkout. Absent until the user first gives
  // it, at lottery entry, at checkout or in their settings.
  FullName full_name = 10 [(google.api.field_behavior) = OPTIONAL];

  // The 本人確認 contact phone number shown on the user's tickets. Absent until
  // the user first gives it, at lottery entry, at checkout or in their settings.
  PhoneNumber phone_number = 11 [(google.api.field_behavior) = OPTIONAL];

  // The identity provider's ID for the User.
  ProviderUserId provider_user_id = 12 [(buf.validate.field).required = true];

  // Field 9 was the 本人確認 details as one value, replaced by full_name and
  // phone_number. Field 4 was the identity provider's id under its former name,
  // replaced by provider_user_id. Field 8 was a verification level that was
  // never populated; a client reads the caller's Active IdentityVerification
  // instead.
  reserved 4, 8, 9;
  reserved "holder_identity", "external_id", "verification_level";
}

// Home represents the user's home area as a structured geographic location,
// expressed through a hierarchy of internationally standardized codes.
//
// A user's home area is the geographic region where they regularly attend
// live events without considering it a trip (遠征). This concept anchors the
// proximity classification system (see Proximity enum):
//   - HOME:   the event's venue falls within the user's home area.
//   - NEARBY: the event is within 200km of the user's home centroid.
//   - AWAY:   the event is beyond 200km, has no known area, or the user has no home set.
//
// Proximity assignment granularity:
//   - When level_2 is set, admin_area comparison uses level_2 (finer granularity).
//   - When level_2 is absent, admin_area comparison uses level_1 (coarser granularity).
//
// The centroid (a Coordinates value) is resolved automatically at write time
// from the level_1 (or level_2) code. It serves as the reference point for
// NEARBY distance calculations.
//
// Code system contract:
//   - level_1 is always an ISO 3166-2 subdivision code, worldwide, without exception.
//   - level_2 uses a country-specific standard determined by country_code:
//       "JP" -> future use (not yet defined; Phase 1 always omits level_2)
//       "US" -> FIPS county code (e.g., "06037" for Los Angeles County)
//       "DE" -> AGS (Amtlicher Gemeindeschluessel, e.g., "09162" for Munich)
//     Additional country mappings will be documented here as they are introduced.
//
// Phase 1 note: The initial release supports Japan only. All Japanese home areas
// are expressed as a country_code of "JP" and a level_1 prefecture code (e.g.,
// "JP-13" for Tokyo). The level_2 field will always be absent in Phase 1.
//
// Redundancy rationale: country_code can be derived from the level_1 prefix, but
// is stored as a dedicated field to enable efficient country-level queries and to
// make the country unambiguous at a glance without parsing the subdivision code.
message Home {
  // The ISO 3166-1 alpha-2 country code identifying the user's home country
  // (e.g., "JP" for Japan, "US" for the United States, "DE" for Germany).
  // Always required. Exactly two uppercase Latin letters.
  string country_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];

  // The ISO 3166-2 subdivision code identifying the user's home region at the
  // first-order administrative division level — prefecture in Japan, state in
  // the US, Land in Germany, and so on (e.g., "JP-13", "US-NY", "DE-BY").
  // Always required. Format: two-letter country code, hyphen, one-to-three
  // character subdivision identifier (total length 4-6 characters).
  string level_1 = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Z]{2}-[A-Z0-9]{1,3}$"
  ];

  // An optional finer-grained area code within the level_1 subdivision.
  // The code system is determined by country_code (see message-level comment).
  // Absent when the user's home is defined at level_1 granularity only.
  // Phase 1 (Japan-only) always omits this field.
  optional string level_2 = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 20
  ];

  // The approximate geographic centroid of this home area.
  // Populated automatically at write time by resolving the level_1 (or level_2)
  // code to its centroid coordinates. Used as the reference point for proximity
  // calculations (e.g., Concert.ProximityTo). Absent when the centroid cannot
  // be resolved (unsupported country).
  optional Coordinates centroid = 4;

  reserved 5;
  reserved "centroid_latitude", "centroid_longitude";
}
