syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/entity.proto";

// UserId is a globally unique identifier for a platform user.
message UserId {
  // A UUID string representing the user's unique identity.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// FullName is the 本人確認 (identity check) name of a User, shown on their
// tickets and prefilled at lottery entry and checkout.
message FullName {
  // The full name (氏名), 1 to 200 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// PhoneNumber is a phone number in E.164 form: "+" then 2 to 15 digits, the
// first not 0 (e.g. "+819012345678"). A domestic format such as "090-1234-5678"
// is rejected.
message PhoneNumber {
  // The E.164 phone number, at most 16 characters.
  string value = 1 [(buf.validate.field).string = {
    max_len: 16
    pattern: "^\\+[1-9][0-9]{1,14}$"
  }];
}

// EmailVerificationCode is the one-time code in a User's verification email.
// It confirms the User's email address while it is the latest code issued for
// that address and less than 1 hour old. It is a credential and must not be
// logged.
message EmailVerificationCode {
  // The code as issued by the identity provider, 1 to 32 characters.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// TimeZone is an IANA time zone name (e.g., "Asia/Tokyo").
message TimeZone {
  // The IANA name.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// User represents a registered person on the Liverty Music platform.
// Users are notified of upcoming concerts based on their following and favorite artists.
message User {
  // ProviderUserId is the identity provider's ID for a User: the subject of the
  // User's sign-in token. It links the sign-in account to the local User.
  message ProviderUserId {
    // The identity provider's user id, at least 1 character.
    string value = 1 [(buf.validate.field).string.min_len = 1];
  }

  // The unique identifier for the user.
  UserId id = 1 [(buf.validate.field).required = true];

  // The primary email address used for account identity and notifications.
  Email email = 2 [(buf.validate.field).required = true];

  reserved 3;

  // The user's display name, synced from the identity provider.
  string name = 5;

  // The user's home area — the geographic region where the user regularly attends
  // live events without considering it a trip (遠征).
  // Used as the baseline for proximity classification: events in the home area
  // are classified as HOME, nearby areas as NEARBY, and everything else as AWAY.
  // Absent until the user explicitly selects their area during onboarding or in settings.
  Home home = 6;

  // The user's preferred display language as an ISO 639-1 two-letter code
  // (e.g., "ja", "en"). Used to render the UI in the user's chosen language
  // and to localize user-facing notifications.
  //
  // Set when the user is created (Create requires it) and changed through
  // SetPreferredLanguage. A stored user always has one.
  string preferred_language = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 2
      pattern: "^[a-z]{2}$"
    }
  ];

  // The 本人確認 (identity check) name shown on the user's tickets and
  // prefilled at lottery entry and checkout. Absent until the user first gives
  // it, at lottery entry, at checkout or in their settings.
  FullName full_name = 10 [(google.api.field_behavior) = OPTIONAL];

  // The 本人確認 contact phone number shown on the user's tickets. Absent until
  // the user first gives it, at lottery entry, at checkout or in their settings.
  PhoneNumber phone_number = 11 [(google.api.field_behavior) = OPTIONAL];

  // The identity provider's ID for the User.
  ProviderUserId provider_user_id = 12 [(buf.validate.field).required = true];

  // When the user last signed in, as reported by the identity provider.
  // Absent until the first sign-in is recorded. Server-owned.
  google.protobuf.Timestamp last_login_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The user's preferred time zone as an IANA name (e.g., "Asia/Tokyo").
  // Absent when not set.
  TimeZone time_zone = 14 [(google.api.field_behavior) = OPTIONAL];

  // Field 9 was the 本人確認 details as one value, replaced by full_name and
  // phone_number. Field 4 was the identity provider's id under its former name,
  // replaced by provider_user_id. Field 8 was a verification level that was
  // never populated; a client reads the caller's Active IdentityVerification
  // instead.
  reserved 4, 8, 9;
  reserved "holder_identity", "external_id", "verification_level";
}

// Home is the first-level Area where a user regularly attends live events
// without considering it a trip (遠征). It anchors the proximity
// classification (see the Proximity enum):
//   - HOME:   the event's venue is in the user's home Area.
//   - NEARBY: the event is within 200km of the home Area's reference point.
//   - AWAY:   the event is beyond 200km, has no known area, or the user has no
//     home set.
//
// An Area is identified by its code, the one vocabulary every stored area
// shares: an ISO 3166-2 code for a first-level subdivision ("JP-13" for Tokyo,
// "US-CA" for California), or the ISO 3166-1 code of a country or territory
// that has no subdivision of its own ("HK" for Hong Kong). A lower-level
// subdivision, a withdrawn code and a region are not Areas a Home can name.
// The server reads the Area's reference point from its own reference data, so
// a client sends and receives only the codes below.
message Home {
  // The ISO 3166-1 alpha-2 country code of the home Area (e.g., "JP" for
  // Japan, "US" for the United States). Always required. Exactly two uppercase
  // Latin letters.
  string country_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];

  // The code of the first-level Area of the home: an ISO 3166-2 subdivision
  // code such as "JP-13", "US-NY" or "DE-BY", or the country code of a
  // territory with no subdivision, such as "HK". Always required. Format: two
  // uppercase letters, optionally followed by a hyphen and one to three
  // uppercase letters or digits. A well-formed code that is no first-level Area
  // (e.g., "JP-99") is rejected by the server.
  string level_1 = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Z]{2}(-[A-Z0-9]{1,3})?$"
  ];

  // Field 3 was a finer-grained area code and field 4 the home area's
  // centroid. Homes name a first-level Area only, and the server resolves its
  // reference point itself. Field 5 was the centroid's latitude and longitude
  // before they were one Coordinates value.
  reserved 3, 4, 5;
  reserved "level_2", "centroid", "centroid_latitude", "centroid_longitude";
}
