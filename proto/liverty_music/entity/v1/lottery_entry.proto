syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/ticket_sale.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// LotteryEntryState is the lifecycle of a LotteryEntry:
//
//   ENTERED --> WON | LOST
//
// An entry is created ENTERED. New values may be appended; existing values
// must not be renumbered.
enum LotteryEntryState {
  // Default value, rejected at the boundary: a persisted entry always has a
  // concrete state.
  LOTTERY_ENTRY_STATE_UNSPECIFIED = 0;

  // Made when the fan confirmed, and awaiting the draw. The card authorization
  // reserves the amount but no money is captured. An entry cannot be given up.
  LOTTERY_ENTRY_STATE_ENTERED = 1;

  // Selected in the draw: the Order's card authorization was captured and the
  // Order is made Paid from it.
  LOTTERY_ENTRY_STATE_WON = 2;

  // Not selected in the draw: the card authorization was released and the
  // Order is VOID. Kept in draw order among the TicketStock's losers.
  LOTTERY_ENTRY_STATE_LOST = 3;

  // Value 4 was WITHDRAWN, an entry the fan gave up before the draw; a fan can
  // no longer give up an entry. Value 5 was DRAFT, an entry being built before
  // it was confirmed; an entry is now made only when the fan confirms.
  reserved 4, 5;
  reserved "LOTTERY_ENTRY_STATE_WITHDRAWN", "LOTTERY_ENTRY_STATE_DRAFT";
}

// LotteryEntry is how one fan's Order takes part in a LOTTERY TicketSale: a
// request for a companion group of tickets of the Order's TicketStock,
// allocated all-or-nothing, paid by the Order's CardAuthorization placed on
// the fan's card for the amount until the draw. It is made when the fan
// confirms after authenticating their card, and takes part in the draw from
// then on. A fan enters a sale at most once for each event it names (enforced
// server-side). The TicketStock, the ticket count, the card authorization and
// the referral code are the Order's. The fan's 本人確認 (identity check)
// details are the User's full name and phone number.
message LotteryEntry {
  // The unique identifier for this entry. Server-generated surrogate id.
  LotteryEntryId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The Order the entry applies for, PENDING until the draw. One LotteryEntry
  // per Order.
  OrderId order_id = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The LOTTERY TicketSale entered, a sale that names the event of the
  // Order's TicketStock.
  TicketSaleId ticket_sale_id = 12 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // The entry's current lifecycle state (its result once the draw has run).
  // Server-owned.
  LotteryEntryState state = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // The entry's position in its sale's random draw order for its TicketStock,
  // unique within the sale and stock. Absent before the draw; set only by the
  // draw. For a LOST entry it is the waiting-list order. Server-owned.
  optional int64 draw_position = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Field 2 was the sale the entry belonged to, replaced by ticket_type_id.
  // Field 5 was the 本人確認 details copied onto the entry, which now live on
  // the User. Fields 3 and 8 are user_id and draw_position under former
  // names. Field 4 was the ticket count under its former name, replaced by
  // ticket_count. Field 6 held the card authorization in a message of its
  // own, replaced by card_authorization_id. Fields 3, 9, 10 and 11 were the
  // user, the TicketType, the card authorization and the ticket count, which
  // are now the Order's.
  reserved 2, 3, 4, 5, 6, 9, 10, 11;
  reserved "phase_id", "identity", "applicant_id", "draw_sequence", "requested_ticket_count", "authorization", "user_id", "ticket_type_id", "card_authorization_id", "ticket_count";
}
