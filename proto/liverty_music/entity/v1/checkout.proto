syntax = "proto3";

// Package liverty_music.entity.v1 defines core business entities for the Liverty Music platform.
package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/ticket_sale.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// CheckoutStatus is the lifecycle of a Checkout. New values may be appended;
// existing values must not be renumbered.
//
//   HELD --> COMMITTED --> COMPLETED
//   HELD --> EXPIRED | RELEASED
//   COMMITTED --> RELEASED   (only when the card was never charged)
enum CheckoutStatus {
  // Default value, rejected at the boundary: a persisted Checkout always
  // records a concrete status.
  CHECKOUT_STATUS_UNSPECIFIED = 0;

  // The tickets are held for the fan until the hold expiry. Counted in the
  // TicketStock's held count only while the hold has not lapsed.
  CHECKOUT_STATUS_HELD = 1;

  // The tickets were committed against the TicketStock while the hold lasted.
  // The card is then charged and the Order made Paid.
  CHECKOUT_STATUS_COMMITTED = 2;

  // The card was charged and the Order became Paid with its Tickets issued.
  CHECKOUT_STATUS_COMPLETED = 3;

  // The hold lapsed before the tickets were committed. The fan was not charged.
  CHECKOUT_STATUS_EXPIRED = 4;

  // The checkout ended without a charge: the fan started again with another
  // count, or the card could no longer be charged after the commit and the
  // tickets were given back.
  CHECKOUT_STATUS_RELEASED = 5;
}

// Checkout is how one fan's Order is bought first come, first served: during a
// FIRST_COME TicketSale it holds the Order's tickets of its TicketStock for 15
// minutes, never extended, while the fan confirms their 本人確認 (identity check)
// details and authorizes their card. It ends with the tickets committed,
// charged and issued, or with the hold released, any card authorization
// released and the Order VOID. The TicketStock, the ticket count, the amount,
// the card authorization and the referral code are the Order's. A fan has at
// most one holding Checkout per TicketStock, and a charged Checkout is never
// released. The fan's full name and phone number are the User's.
message Checkout {
  // The unique identifier for this checkout. Server-generated.
  CheckoutId id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The Order the checkout buys, PENDING while the checkout runs. One
  // Checkout per Order.
  OrderId order_id = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The FIRST_COME TicketSale the checkout buys from, a sale that names the
  // event of the Order's TicketStock. Server-owned: Start picks the open
  // first-come sale of the stock's event.
  TicketSaleId ticket_sale_id = 15 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // The checkout's lifecycle status. Server-owned.
  CheckoutStatus status = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // When the hold lapses: 15 minutes after the checkout started, never
  // extended. The tickets can be committed only before this instant.
  // Server-owned.
  google.protobuf.Timestamp hold_expire_time = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).required = true
  ];

  // When the tickets were committed against the stock. Unset unless the
  // checkout was ever committed; it stays set on a commit that was later given
  // back. Server-owned.
  google.protobuf.Timestamp commit_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the card was charged. Unset until charged, and set at most once.
  // Server-owned.
  google.protobuf.Timestamp capture_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Field 2 was the per-event sale, replaced by a ticket type and then by
  // ticket_sale_id. The fan (always the caller) and the start time are not
  // exposed. Field 6 was the 本人確認 details copied onto the checkout, which
  // now live on the User. Fields 4 and 5 were the ticket count and the amount,
  // and field 12 the TicketType, which are now the Order's. Field 13 marked a
  // resale Checkout; a Checkout no longer buys resale tickets.
  reserved 2, 3, 4, 5, 6, 9, 12, 13;
  reserved "user_id", "holder_identity", "create_time", "ticket_count", "amount", "ticket_type_id", "resale";
}
