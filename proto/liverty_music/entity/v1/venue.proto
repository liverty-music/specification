syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "liverty_music/entity/v1/area.proto";
import "liverty_music/entity/v1/coordinates.proto";
import "liverty_music/entity/v1/user.proto";

// Venue represents a physical location where concert events are hosted.
// It contains geographical and descriptive information to help fans find the event.
message Venue {
  // The unique identifier for the venue.
  VenueId id = 1 [(buf.validate.field).required = true];

  // The official name or title of the music venue.
  VenueName name = 2 [(buf.validate.field).required = true];

  // The first-level Area (prefecture, state, province, or a territory with no
  // subdivision) where the venue is located, expressed as its code (e.g.,
  // "JP-13" for Tokyo, "JP-40" for Fukuoka, "HK" for Hong Kong).
  // Populated only when the area is determinable with confidence from the source data.
  // Absent when the area cannot be determined — an incorrect value is strictly worse
  // than an absent one.
  AdminArea admin_area = 3;

  // The map place the venue was matched to. Present when the venue was matched
  // to a map place; absent for a venue known only by the name a source listed.
  PlaceId place_id = 4;

  // The WGS 84 position of the venue. Absent until resolved.
  optional Coordinates coordinates = 5;

  // The IANA time zone of the venue (e.g., "Asia/Seoul"), in which the
  // wall-clock times of its events are read. Set when the venue is created
  // from the zone the organizer or admin confirmed, or from the Area when the
  // whole Area has one zone; it always belongs to the venue's country. Absent
  // only for a venue stored before time zones were recorded.
  TimeZone time_zone = 6;

  // time_zone with the names a screen shows for it, from the reference data;
  // its time_zone equals time_zone. Present whenever time_zone is present, so
  // a client names the venue's zone without a list of its own. Output only:
  // the server fills it in on the venues it returns.
  optional TimeZoneOption time_zone_option = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// VenueId is a globally unique identifier for a concert venue.
message VenueId {
  // A UUID string representing the unique identity of the venue.
  string value = 1 [(buf.validate.field).string.uuid = true];
}

// VenueName represents the public name of a venue.
message VenueName {
  // The name string, required to be at least one character.
  string value = 1 [(buf.validate.field).string.min_len = 1];
}

// PlaceId is the external Google Places identifier for a venue location.
// It is an opaque, third-party string (not a Liverty Music UUID) used as the stable
// venue identity for staging-level deduplication and venue resolution, mirroring
// how Mbid wraps the external MusicBrainz identifier.
message PlaceId {
  // The Google Places place id. Opaque and externally assigned; validated only
  // for non-emptiness since its format is controlled by Google.
  string value = 1 [(buf.validate.field).string.min_len = 1];
}

// AdminArea is the code of the first-level Area where a venue is located: an
// ISO 3166-2 subdivision code for a country's first-level subdivision (e.g.,
// "JP-13" for Tokyo, "US-CA" for California), or the ISO 3166-1 country code
// of a country or territory that has no subdivision of its own (e.g., "HK" for
// Hong Kong).
//
// The pattern checks the form only. A lower-level subdivision, a withdrawn code
// or a region has the same form and is rejected by the server, which resolves
// the code against its reference data. A client that holds free text (e.g.,
// "東京都", "Tokyo") sends it as an AreaQuery for the server to resolve.
//
// Present only when the area is determinable with confidence from the source data.
message AdminArea {
  // The first-level Area code (e.g., "JP-13", "US-NY", "HK"): two uppercase
  // letters, optionally followed by a hyphen and one to three uppercase
  // letters or digits.
  string value = 1 [(buf.validate.field).string.pattern = "^[A-Z]{2}(-[A-Z0-9]{1,3})?$"];
}
