syntax = "proto3";

package liverty_music.entity.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/user.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/entity/v1;entityv1";

// HypeType represents the user's enthusiasm tier for a followed artist.
// It controls push notification scope and dashboard rendering behavior.
// Values are ordered by ascending enthusiasm: WATCH (lowest) to AWAY (highest).
enum HypeType {
  // Default value; must not be used in API requests.
  HYPE_TYPE_UNSPECIFIED = 0;
  // Dashboard view only. No push notifications are sent for this artist.
  HYPE_TYPE_WATCH = 1;
  // Push notifications only for concerts in the user's home area
  // (ISO 3166-2 subdivision match). This is a moderate engagement tier.
  HYPE_TYPE_HOME = 2;
  // Push notifications for concerts within physical proximity (≈200 km) of the
  // user's home area. A strong engagement tier between Home and Away.
  HYPE_TYPE_NEARBY = 3;
  // Push notifications for all concerts nationwide. Die-hard fan level.
  HYPE_TYPE_AWAY = 4;
}

// HypeSetBy says who set a Follow's hype level. The app never changes a level
// the fan set, and never lowers a level.
enum HypeSetBy {
  // Default value; must not be used.
  HYPE_SET_BY_UNSPECIFIED = 0;
  // The level a new Follow starts at, which nobody has chosen.
  HYPE_SET_BY_DEFAULT = 1;
  // The fan chose the level.
  HYPE_SET_BY_FAN = 2;
  // The app raised the level to match a concert the fan's own actions showed
  // interest in.
  HYPE_SET_BY_INFERENCE = 3;
}

// FollowedArtist represents an artist together with the fan's personal follow
// settings for that artist. It captures both who the artist is and how
// enthusiastically the fan wants to be kept informed about their concerts.
message FollowedArtist {
  // The artist that the fan is following.
  Artist artist = 1 [(buf.validate.field).required = true];
  // The fan's hype level for this artist, which determines the scope of
  // concert push notifications they receive.
  HypeType hype = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

// Follow is one fan's follow of one Artist with its hype level. FollowedArtist
// is the fan's own view of the same follow, which names no fan.
message Follow {
  // The fan who follows the artist.
  UserId user_id = 1 [(buf.validate.field).required = true];
  // The followed artist.
  ArtistId artist_id = 2 [(buf.validate.field).required = true];
  // The fan's hype level for the artist.
  HypeType hype = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Who set the hype level.
  HypeSetBy hype_set_by = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}
