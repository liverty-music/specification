syntax = "proto3";

// Package liverty_music.rpc.ticket.v1 provides the fan-facing ticket service:
// the surface a buyer uses to see an Order's payment result and the
// account-bound tickets issued from their captured lottery win, and to register
// the wallet public key of the device that shows those tickets at the venue. Issuance itself
// is not an RPC here — it is an internal process keyed on ④'s Won-captured signal
// (see liverty_music.rpc.issuance.v1). Refund/payout operations live in the
// admin surface (liverty_music.rpc.admin.order.v1). It imports entity types and follows
// Google AIP resource-oriented conventions.
package liverty_music.rpc.ticket.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/public_key.proto";
import "liverty_music/entity/v1/ticket.proto";
import "liverty_music/entity/v1/wallet_public_key.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/rpc/ticket/v1;ticketv1";

// TicketService is the fan-facing surface over a buyer's own Orders, issued
// Tickets and wallet public key. The caller is resolved from the token; a buyer can read only
// their own Order and their own tickets. No money movement happens here —
// issuance is internal (keyed on ④'s captured win) and refunds are admin ops.
service TicketService {
  // GetOrder returns one of the caller's own Orders — its payment result
  // (status, amount, capture time, display facets). The Order is created already
  // `paid` from ④'s captured winning payment.
  //
  // Possible errors:
  // - NOT_FOUND: No such Order for this caller. Non-revealing (an Order belonging
  //   to another account is reported the same as a missing one).
  // - INVALID_ARGUMENT: The order_id is missing or malformed.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  // List returns all account-bound tickets issued to the caller — the
  // covered tickets from their captured lottery wins, each with its status and,
  // once admitted at the venue, its admitted time.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc List(ListRequest) returns (ListResponse);

  // RegisterWalletPublicKey records the public key of the ECDSA P-256 key pair
  // the caller's device created (WebCrypto, non-extractable) for showing
  // tickets, so the device can sign AdmissionCodes at the venue without a
  // connection. The key becomes the caller's WalletPublicKey, replacing the
  // key of any device that showed tickets before; codes signed on that device
  // are refused from then on. Registering the key the caller already has
  // changes nothing. The caller is resolved from the token; the request never
  // names a User. Requires nothing beyond the caller's existing sign-in.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The public key is missing, or is not a valid P-256
  //   point (the caller's key is then unchanged).
  // - NOT_FOUND: The caller has no stored account.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc RegisterWalletPublicKey(RegisterWalletPublicKeyRequest) returns (RegisterWalletPublicKeyResponse);
}

// GetOrderRequest identifies the Order to return; it must belong to the caller.
message GetOrderRequest {
  // Required. The Order to return; resolved against the caller's account.
  entity.v1.OrderId order_id = 1 [(buf.validate.field).required = true];
}

// GetOrderResponse returns the caller's Order.
message GetOrderResponse {
  // The requested Order, including its payment result.
  entity.v1.Order order = 1 [(buf.validate.field).required = true];
}

// ListRequest carries no fields: the caller is resolved from the token
// and all of that account's issued tickets are returned.
message ListRequest {}

// ListResponse returns the caller's issued tickets.
message ListResponse {
  // The caller's account-bound covered tickets. Empty when the caller has none.
  repeated entity.v1.Ticket tickets = 1;
}

// RegisterWalletPublicKeyRequest carries the public key of the caller's device.
message RegisterWalletPublicKeyRequest {
  // Required. The device's public key: the uncompressed SEC1 point that
  // WebCrypto `exportKey("raw", publicKey)` returns.
  entity.v1.PublicKey public_key = 1 [(buf.validate.field).required = true];
}

// RegisterWalletPublicKeyResponse returns the registered key.
message RegisterWalletPublicKeyResponse {
  // The caller's WalletPublicKey, with its register time.
  entity.v1.WalletPublicKey wallet_public_key = 1 [(buf.validate.field).required = true];

  // True when this registration replaced a different device's key, so the
  // screen can say that tickets are now shown from this device only.
  bool replaced_other_key = 2;
}
