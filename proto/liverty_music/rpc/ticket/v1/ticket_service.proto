syntax = "proto3";

// Package liverty_music.rpc.ticket.v1 provides the fan-facing ticket service:
// the surface a fan uses to see the account-bound tickets issued to them from
// a lottery win or a first-come checkout. The fan's Orders are read through
// liverty_music.rpc.order.v1, and the key of the device that shows the entry
// QR code lives in liverty_music.rpc.wallet_public_key.v1. Issuance itself is
// not an RPC: it runs in internal backend jobs. Refunds live in the admin
// surface (liverty_music.rpc.admin.order.v1).
package liverty_music.rpc.ticket.v1;

import "liverty_music/entity/v1/ticket.proto";

option go_package = "github.com/liverty-music/specification/gen/go/liverty_music/rpc/ticket/v1;ticketv1";

// TicketService is the fan-facing surface over a fan's own issued Tickets.
// Every call requires a signed-in fan, who is always the caller; the fan is
// resolved from the token to their stored account and is never named in a
// request. No money moves here.
service TicketService {
  // List returns all account-bound tickets issued to the caller — the
  // covered tickets from their lottery wins and first-come checkouts, each
  // with its status and, once admitted at the venue, its admitted time.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  rpc List(ListRequest) returns (ListResponse);
}

// ListRequest carries no fields: the caller is resolved from the token
// and all of that account's issued tickets are returned.
message ListRequest {}

// ListResponse returns the caller's issued tickets.
message ListResponse {
  // The caller's account-bound covered tickets. Empty when the caller has none.
  repeated entity.v1.Ticket tickets = 1;
}
