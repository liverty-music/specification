syntax = "proto3";

// Package liverty_music.rpc.checkout.v1 provides the fan-facing
// CheckoutService: the signed-in fan's first-come checkout on a TicketType of
// a FIRST_COME TicketSale, from holding tickets to placing the order.
package liverty_music.rpc.checkout.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/card_authorization.proto";
import "liverty_music/entity/v1/checkout.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/ticket_type.proto";
import "liverty_music/entity/v1/user.proto";

// CheckoutService runs one fan's checkout on a first-come TicketType:
//
//   1. Start holds the chosen count for exactly 15 minutes (never extended).
//   2. AuthorizeCard records the 本人確認 name and phone number on the fan's
//      account and opens a card authorization for the amount, which the
//      browser authenticates (3D Secure) with the returned card authorization
//      secret.
//   3. Confirm places the order while the hold lasts: the tickets are
//      committed, the card is charged once and the Order and its Tickets are
//      issued.
//
// Get reads the checkout so the client can tell the fan what happened after a
// step fails. Every call requires a signed-in fan, who is always the caller;
// the fan is resolved from the token to their stored account and is never
// named in a request. A signed-in caller with no stored account fails with
// NOT_FOUND. A Checkout of another fan is reported as PERMISSION_DENIED
// without revealing whether it exists.
service CheckoutService {
  // Start holds a count of tickets of a first-come TicketType for the caller
  // for 15 minutes and returns the holding Checkout. Starting again with the
  // same count while the hold lasts returns the same Checkout, so a double
  // tap, a retry or a reload never holds twice. Starting with another count
  // replaces the hold only when the new one can be made; the replaced
  // checkout's card authorization is released. The count must be at most the
  // TicketType's per-account limit and, together with the caller's Issued
  // tickets for the event and the tickets of their committed checkouts not yet
  // issued, must still fit it. When the sale requires verification, the caller
  // must hold an Active IdentityVerification.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The TicketType does not exist, or the caller has no stored
  //   account.
  // - INVALID_ARGUMENT: The ticket_type_id is missing or malformed, or the
  //   ticket_count is missing, not greater than 0 or above the TicketType's
  //   per-account limit.
  // - FAILED_PRECONDITION: The TicketType's sale is not a FIRST_COME sale, its
  //   event's concert is not published (for example cancelled), the TicketType
  //   is not on sale (not yet open, sold out or ended), the sale requires
  //   verification and the caller holds no Active IdentityVerification, or the
  //   caller's tickets for the event plus the count exceed the per-account
  //   limit.
  // - RESOURCE_EXHAUSTED: Not enough tickets remain, including when every
  //   remaining ticket is held by other fans. The caller keeps any hold they
  //   already had.
  rpc Start(StartRequest) returns (StartResponse);

  // Get returns the caller's Checkout as it stands now. A HELD Checkout whose
  // hold has lapsed is returned EXPIRED; any other is returned with its stored
  // status. Its committed time tells whether it was ever committed and its
  // capture time whether it was charged. The checkout screen uses it to choose
  // the outcome it shows.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  // - INVALID_ARGUMENT: The checkout_id is missing or malformed.
  // - PERMISSION_DENIED: The Checkout does not exist or is another fan's.
  //   Non-revealing.
  rpc Get(GetRequest) returns (GetResponse);

  // AuthorizeCard records the 本人確認 full name and phone number on the
  // caller's account, for the next checkout's prefill and the ticket face, and
  // opens a CardAuthorization for the holding Checkout's amount. It returns the
  // card authorization secret, which the browser confirms with the payment
  // provider (3D Secure); the secret is never stored. Every card brand is
  // accepted, including American Express and card wallets (Apple Pay, Google
  // Pay). Authorizing the same Checkout again, for example after a declined
  // card, returns the same card authorization for another attempt. The Checkout
  // carries no name or phone number.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  // - INVALID_ARGUMENT: The checkout_id is missing or malformed, or the full
  //   name or phone number is missing or breaks the User's personal details
  //   rule (the phone number must be in E.164 form).
  // - PERMISSION_DENIED: The Checkout does not exist or is another fan's.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The hold has lapsed; the fan starts again.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc AuthorizeCard(AuthorizeCardRequest) returns (AuthorizeCardResponse);

  // Confirm places the order for the caller's Checkout: while the hold lasts,
  // the tickets are committed, the card is charged once, and the Order and its
  // account-bound covered tickets are issued, bound to the caller's
  // IdentityVerification when the sale requires verification. Calls for the
  // same Checkout are handled one after another, and a Checkout that already
  // has an Order returns it, so a double tap or a retry never charges twice. A
  // lapsed hold, a cancelled concert or a card not yet authenticated fails
  // before anything is charged. A charged Checkout is never charged again; if
  // issuing its Order fails, it is finished in the background and the Order is
  // found later through Get.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account, the Checkout's card
  //   authorization is not known to the payment provider, or the sale requires
  //   verification and the caller has no IdentityVerification. Nothing was
  //   charged.
  // - INVALID_ARGUMENT: The checkout_id is missing or malformed, or the card
  //   authorization's amount or currency does not match the Checkout.
  // - PERMISSION_DENIED: The Checkout does not exist or is another fan's.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The hold has lapsed or the Checkout was released,
  //   the concert is not published (for example cancelled), the Checkout has
  //   no card authorization, the card was not authenticated, or the card could no
  //   longer be charged (the tickets were given back). Nothing was charged.
  // - UNAVAILABLE: Card payments or issuance were temporarily unavailable. A
  //   committed Checkout is finished in the background; Get reports it once
  //   its Order is issued.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
}

// StartRequest names the TicketType and how many tickets to hold.
message StartRequest {
  // Required. The first-come TicketType to buy from.
  entity.v1.TicketTypeId ticket_type_id = 1 [(buf.validate.field).required = true];

  // Required. The tickets to hold, at least 1 and at most the TicketType's
  // per-account limit (never above 10).
  int32 ticket_count = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
}

// StartResponse returns the holding Checkout.
message StartResponse {
  // The holding Checkout: its id, ticket count, amount (price × count, 税込)
  // and hold expiry, from which the client counts down. A resumed Checkout
  // keeps its original hold expiry.
  entity.v1.Checkout checkout = 1 [(buf.validate.field).required = true];
}

// GetRequest names the Checkout to read.
message GetRequest {
  // Required. The caller's Checkout.
  entity.v1.CheckoutId checkout_id = 1 [(buf.validate.field).required = true];
}

// GetResponse returns the Checkout as it stands now.
message GetResponse {
  // The Checkout. A HELD Checkout whose hold has lapsed is returned EXPIRED.
  // Its committed time is set when it was ever committed, and its capture time
  // when it was charged.
  entity.v1.Checkout checkout = 1 [(buf.validate.field).required = true];
}

// AuthorizeCardRequest carries the Checkout and the 本人確認 details.
message AuthorizeCardRequest {
  // Required. The caller's holding Checkout.
  entity.v1.CheckoutId checkout_id = 1 [(buf.validate.field).required = true];

  // Required. The caller's real full name, printed on the tickets' face and
  // saved on the caller's account.
  entity.v1.FullName full_name = 2 [(buf.validate.field).required = true];

  // Required. The caller's phone number in E.164 form, saved on the caller's
  // account.
  entity.v1.PhoneNumber phone_number = 3 [(buf.validate.field).required = true];
}

// AuthorizeCardResponse returns the card authorization for the browser to
// authenticate.
message AuthorizeCardResponse {
  // The card authorization secret, which the browser confirms with the payment
  // provider's payment form (3D Secure). Short-lived; never stored by the
  // client or the server.
  entity.v1.CardAuthorizationSecret card_authorization_secret = 2 [(buf.validate.field).required = true];

  // Field 1 was the secret as a bare string under the provider's own name,
  // replaced by card_authorization_secret.
  reserved 1;
  reserved "client_secret";
}

// ConfirmRequest names the Checkout whose order to place.
message ConfirmRequest {
  // Required. The caller's authorized, holding Checkout.
  entity.v1.CheckoutId checkout_id = 1 [(buf.validate.field).required = true];
}

// ConfirmResponse returns the issued Order.
message ConfirmResponse {
  // The paid Order the Checkout completed as, whose source is the Checkout.
  entity.v1.Order order = 1 [(buf.validate.field).required = true];
}
