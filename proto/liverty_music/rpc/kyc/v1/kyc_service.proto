syntax = "proto3";

// Package liverty_music.rpc.kyc.v1 provides the fan-facing KYC (本人確認)
// surface (identity-ekyc). A fan verifies that they are a real person with
// their マイナンバーカード 公的個人認証 (JPKI) via **PocketSign Stamp**: Start opens
// a Stamp session and returns a redirect URL; the fan reads and signs their card
// in the **PocketSign app** (installed separately) — the platform never reads the
// card itself — and is returned to the platform's callback, which calls
// Create to finalize the session. Stamp rides on PocketSign Verify, so
// the result is a stable tenant-scoped person id (利用者ID via 当人認証) with NO
// 基本4情報 requested (MVP). The raw certificate/response is validated vendor-side
// and never persisted here; only the result (a Kyc keyed on that person id) is
// retained. The service also exposes the periodic 現況確認 re-check and a read of
// the caller's Kyc for the client. (MVP is JPKI-only; the 運転免許証 fallback is
// post-MVP.)
package liverty_music.rpc.kyc.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/kyc.proto";
import "liverty_music/entity/v1/user.proto";

// KycService is the signed-in fan's surface for binding their account to a
// verified real person and reading the result. It is a redirect flow via
// PocketSign Stamp: Start opens a Stamp session and returns a redirect URL; the
// fan signs in the PocketSign app and is returned to the platform's callback;
// Create finalizes the session and, on success, records the fan's Kyc and
// upgrades the account to KYC_VERIFIED. Every call acts for the signed-in
// caller, resolved to their stored User; no request names a fan.
service KycService {
  // Start opens a verification attempt (a PocketSign Stamp session) and
  // returns a **redirect URL** the client MUST open so the fan can read and sign
  // their card in the PocketSign app. The chosen method selects the credential
  // (MVP: JPKI 当人認証 → a stable 利用者ID, no 基本4情報). The session is short-lived
  // and is finalized by exactly one Create call. An anti-redirect nonce is
  // bound to the caller's session server-side and validated at Create.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: method is UNSPECIFIED or not a defined enum value.
  // - NOT_FOUND: The signed-in caller has no account.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The PocketSign service is not reachable.
  rpc Start(StartRequest) returns (StartResponse);

  // Create finalizes the Stamp session identified by session_id (received
  // on the PocketSign callback). On success the backend records the caller's
  // Kyc (keyed on the returned 利用者ID / person id), sets the account's
  // verification_level to KYC_VERIFIED, and retains only the result (raw
  // certificate/response validated vendor-side, never persisted here). On failure
  // or abandonment the account stays UNVERIFIED. If the returned person id already
  // backs another active verified account, the call is rejected (one person maps
  // to one verified account) with a recovery path. The server also validates the
  // anti-redirect nonce bound at Start.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: session_id is missing or malformed.
  // - NOT_FOUND: The signed-in caller has no account.
  // - PERMISSION_DENIED: The session's anti-redirect nonce does not match the
  //   caller's.
  // - FAILED_PRECONDITION: The session is not yet completed, expired, or its
  //   verification result was not OK (e.g. signature mismatch / revoked / expired).
  // - ALREADY_EXISTS: The verified person already has an active KYC_VERIFIED
  //   account; use account recovery instead of creating a second Kyc.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The PocketSign service is not reachable.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Recheck runs a 現況確認 (liveness) check for the caller's Kyc to detect
  // certificate revocation, a 基本4情報 change (move/name change), or expiry. On
  // a revoked/changed result it flags the Kyc as NEEDS_REVERIFICATION
  // (prompting re-verification) rather than hard-locking the account. This
  // mirrors the periodic backend re-check but lets the client refresh on
  // demand.
  //
  // Possible errors:
  // - NOT_FOUND: The signed-in caller has no account.
  // - FAILED_PRECONDITION: The account has no Kyc to re-check.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The Pocket Sign Verify service is not reachable.
  rpc Recheck(RecheckRequest) returns (RecheckResponse);

  // Get returns the caller's Kyc (method, dedupe strength, freshness status).
  // The client uses it to render verification state. The account's
  // verification level is read from liverty_music.rpc.user.v1.UserService.Get,
  // not here.
  //
  // Possible errors:
  // - NOT_FOUND: The signed-in caller has no account, or has never passed KYC.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Get(GetRequest) returns (GetResponse);
}

// StartRequest opens a verification attempt for the signed-in caller.
message StartRequest {
  reserved 1;
  reserved "user_id";

  // Which credential the fan will present: JPKI (high assurance, strong dedupe)
  // or the 運転免許証 IC fallback (weaker dedupe). UNSPECIFIED is rejected.
  entity.v1.VerificationMethod method = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// StartResponse carries the session handle and the URL the client opens.
message StartResponse {
  // An opaque handle for this verification attempt, correlating it with the
  // eventual Create call. Short-lived; consumed by exactly one Create. (Backed
  // by a PocketSign Stamp session.)
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // The URL the client MUST open so the fan can read and sign their card in the
  // PocketSign app. On completion the app returns the fan to the platform's
  // callback with this attempt's session id; the client then calls
  // Create. The client does NOT read the card itself.
  entity.v1.Url redirect_url = 2 [(buf.validate.field).required = true];
}

// CreateRequest finalizes the verification attempt opened by Start.
message CreateRequest {
  reserved 1;
  reserved "user_id";

  // The opaque handle returned by Start (the session id the platform
  // received on the PocketSign callback). The backend finalizes this session
  // with Pocket Sign to obtain the verified result; the raw certificate/
  // response is validated vendor-side and never persisted here. The card
  // signature happens in the PocketSign app, so no signed payload is sent on
  // this request.
  string session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Field 3 was `bytes signed_response` (the SDK-signed payload in the old
  // embedded-SDK challenge–response flow), removed when the flow moved to the
  // PocketSign Stamp redirect model (the app signs; the backend finalizes by
  // session_id). Reserved to prevent reuse.
  reserved 3;
  reserved "signed_response";
}

// CreateResponse returns the recorded Kyc.
message CreateResponse {
  // The Kyc recorded on success. Retains only the result (person key, method,
  // dedupe strength, status) — no raw certificate, no 個人番号.
  entity.v1.Kyc kyc = 1 [(buf.validate.field).required = true];

  // The account's verification level after this call (KYC_VERIFIED on
  // success). Echoed so the client need not re-read it.
  entity.v1.VerificationLevel verification_level = 2 [(buf.validate.field).enum.defined_only = true];
}

// RecheckRequest requests a 現況確認 (liveness) re-check for the caller's Kyc.
message RecheckRequest {
  reserved 1;
  reserved "user_id";
}

// RecheckResponse returns the freshness outcome of the re-check.
message RecheckResponse {
  // The Kyc's freshness status after the re-check (ACTIVE, or
  // NEEDS_REVERIFICATION when revoked/changed/expired).
  entity.v1.VerificationStatus status = 1 [(buf.validate.field).enum.defined_only = true];

  // The account's verification level after the re-check. A revoked/changed
  // result does not hard-lock the account; the level reflects the current state.
  entity.v1.VerificationLevel verification_level = 2 [(buf.validate.field).enum.defined_only = true];
}

// GetRequest reads the caller's Kyc. It names no fan; the caller is taken from
// the sign-in.
message GetRequest {}

// GetResponse returns the caller's Kyc.
message GetResponse {
  // The caller's Kyc.
  entity.v1.Kyc kyc = 1 [(buf.validate.field).required = true];
}
