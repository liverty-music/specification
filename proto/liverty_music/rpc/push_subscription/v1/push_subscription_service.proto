syntax = "proto3";

// Package liverty_music.rpc.push_subscription.v1 provides the
// PushSubscriptionService for managing a fan's browser push subscriptions.
package liverty_music.rpc.push_subscription.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/push_subscription.proto";

// PushSubscriptionService manages the lifecycle of browser push subscriptions
// for signed-in Liverty Music users. A push subscription represents a direct
// channel between the Liverty Music backend and a specific browser session,
// enabling the platform to proactively notify users about upcoming concerts,
// new releases from followed artists, and other time-sensitive events.
//
// Subscriptions are identified by the browser-provided endpoint URL, the
// natural key of a push subscription. A single user may hold multiple
// subscriptions simultaneously — one per active browser. Every call acts only
// on the signed-in caller's own subscriptions, resolved to their stored User;
// no request names a fan. An endpoint the caller has not registered is treated
// as absent whoever else has registered it, so a caller learns nothing about
// another fan's browsers.
service PushSubscriptionService {
  // Create registers the calling browser's push subscription for the
  // signed-in user. The subscription materials are obtained from the
  // browser's PushManager API and must be forwarded to this endpoint so the
  // platform can later deliver notifications to that browser session.
  //
  // If the endpoint is already registered, the existing record is updated
  // with the new key material (upsert behaviour).
  //
  // Possible errors:
  //   - UNAUTHENTICATED: The caller is not signed in.
  //   - NOT_FOUND: The signed-in caller has no account.
  //   - INVALID_ARGUMENT: The endpoint or the keys are missing, empty, or not
  //     well formed (the endpoint must be a valid URI).
  //   - INTERNAL: An unexpected error occurred while persisting the
  //     subscription.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Get retrieves the caller's push subscription for the supplied endpoint.
  // The settings page uses this RPC to determine whether a given browser's
  // subscription is known to the backend; a NOT_FOUND response triggers the
  // client's self-heal flow (re-registration via Create).
  //
  // Possible errors:
  //   - UNAUTHENTICATED: The caller is not signed in.
  //   - NOT_FOUND: The signed-in caller has no account, or has not registered
  //     the endpoint (whoever else has).
  //   - INVALID_ARGUMENT: The endpoint is missing or fails validation.
  //   - INTERNAL: An unexpected error occurred while querying the store.
  rpc Get(GetRequest) returns (GetResponse);

  // Delete removes the caller's push subscription for the supplied endpoint.
  // Only that browser's subscription is removed; other browsers registered by
  // the same user remain active. The operation is idempotent: deleting a
  // subscription the caller does not have, including an endpoint only another
  // fan has registered, removes nothing and returns a successful empty
  // response.
  //
  // Possible errors:
  //   - UNAUTHENTICATED: The caller is not signed in.
  //   - NOT_FOUND: The signed-in caller has no account.
  //   - INVALID_ARGUMENT: The endpoint is missing or fails validation.
  //   - INTERNAL: An unexpected error occurred while removing the
  //     subscription.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// CreateRequest carries the browser-generated Web Push subscription materials
// that the platform needs in order to deliver notifications to the calling
// browser session. The signed-in user is always the owner of the created
// subscription.
message CreateRequest {
  // Required. The push service endpoint URL provided by the browser's
  // PushManager API.
  entity.v1.PushEndpoint endpoint = 1 [(buf.validate.field).required = true];

  // Required. The ECDH public key and authentication secret generated by the
  // browser.
  entity.v1.PushKeys keys = 2 [(buf.validate.field).required = true];
}

// CreateResponse returns the persisted subscription entity so the client can
// record the minted PushSubscriptionId if desired.
message CreateResponse {
  // The newly created (or upserted) subscription, including its assigned id.
  entity.v1.PushSubscription subscription = 1 [(buf.validate.field).required = true];
}

// GetRequest identifies one of the caller's subscriptions by its endpoint.
message GetRequest {
  reserved 1;
  reserved "user_id";

  // Required. The push service endpoint URL identifying the specific browser
  // session.
  entity.v1.PushEndpoint endpoint = 2 [(buf.validate.field).required = true];
}

// GetResponse returns the caller's subscription for the requested endpoint. If
// the caller has none, the RPC returns NOT_FOUND rather than an empty response
// so clients can branch on the error path alone.
message GetResponse {
  // The caller's subscription for the requested endpoint.
  entity.v1.PushSubscription subscription = 1 [(buf.validate.field).required = true];
}

// DeleteRequest identifies one of the caller's subscriptions to remove by its
// endpoint.
message DeleteRequest {
  reserved 1;
  reserved "user_id";

  // Required. The push service endpoint URL identifying the specific browser
  // session to remove. Only this endpoint's subscription is deleted; other
  // registered browsers remain active.
  entity.v1.PushEndpoint endpoint = 2 [(buf.validate.field).required = true];
}

// DeleteResponse is returned upon successful removal, including the
// idempotent case where the caller had no subscription for the endpoint.
message DeleteResponse {}
