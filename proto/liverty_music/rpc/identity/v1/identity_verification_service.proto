syntax = "proto3";

// Package liverty_music.rpc.identity.v1 provides the fan-facing identity
// verification surface (identity-ekyc). A fan verifies their real identity with
// their マイナンバーカード 公的個人認証 (JPKI) via **PocketSign Stamp**: StartVerify opens
// a Stamp session and returns a redirect URL; the fan reads and signs their card
// in the **PocketSign app** (installed separately) — the platform never reads the
// card itself — and is returned to the platform's callback, which calls
// CompleteVerify to finalize the session. Stamp rides on PocketSign Verify, so
// the result is a stable tenant-scoped person id (利用者ID via 当人認証) with NO
// 基本4情報 requested (MVP). The raw certificate/response is validated vendor-side
// and never persisted here; only the result (a VerifiedIdentity keyed on that
// person id) is retained. The service also exposes the periodic 現況確認 re-check
// and a status read for the client. (MVP is JPKI-only; the 運転免許証 fallback is
// post-MVP.)
package liverty_music.rpc.identity.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/user.proto";
import "liverty_music/entity/v1/verified_identity.proto";

// IdentityVerificationService is the authenticated fan's surface for binding
// their account to a verified real person and reading that status. It is a
// redirect flow via PocketSign Stamp: StartVerify opens a Stamp session and
// returns a redirect URL; the fan signs in the PocketSign app and is returned to
// the platform's callback; CompleteVerify finalizes the session and, on success,
// upgrades the account to IDENTITY_VERIFIED. Every RPC follows the
// rpc-auth-scoping convention: the request carries an explicit user_id verified
// against the JWT-derived caller, and mismatches are rejected with
// PERMISSION_DENIED.
service IdentityVerificationService {
  // StartVerify opens a verification attempt (a PocketSign Stamp session) and
  // returns a **redirect URL** the client MUST open so the fan can read and sign
  // their card in the PocketSign app. The chosen method selects the credential
  // (MVP: JPKI 当人認証 → a stable 利用者ID, no 基本4情報). The session is short-lived
  // and is finalized by exactly one CompleteVerify call. An anti-redirect nonce is
  // bound to the caller's session server-side and validated at CompleteVerify.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: user_id is missing/malformed, or method is UNSPECIFIED
  //   or not a defined enum value.
  // - PERMISSION_DENIED: The supplied user_id does not match the authenticated
  //   caller.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The PocketSign service is not reachable.
  rpc StartVerify(StartVerifyRequest) returns (StartVerifyResponse);

  // CompleteVerify finalizes the Stamp session identified by session_id (received
  // on the PocketSign callback). On success the backend records a VerifiedIdentity
  // (keyed on the returned 利用者ID / person id), sets the account's
  // verification_level to IDENTITY_VERIFIED, and retains only the result (raw
  // certificate/response validated vendor-side, never persisted here). On failure
  // or abandonment the account stays UNVERIFIED. If the returned person id already
  // backs another active verified account, the call is rejected (one person maps
  // to one verified account) with a recovery path. The server also validates the
  // anti-redirect nonce bound at StartVerify.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: user_id or session_id is missing or malformed.
  // - PERMISSION_DENIED: The supplied user_id does not match the authenticated
  //   caller, or the session's anti-redirect nonce does not match the caller's.
  // - FAILED_PRECONDITION: The session is not yet completed, expired, or its
  //   verification result was not OK (e.g. signature mismatch / revoked / expired).
  // - ALREADY_EXISTS: The verified person already has an active IDENTITY_VERIFIED
  //   account; use account recovery instead of creating a second identity.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The PocketSign service is not reachable.
  rpc CompleteVerify(CompleteVerifyRequest) returns (CompleteVerifyResponse);

  // ReCheck runs a 現況確認 (liveness) check for the caller's verified identity to
  // detect certificate revocation, a 基本4情報 change (move/name change), or
  // expiry. On a revoked/changed result it flags the identity as
  // NEEDS_REVERIFICATION (prompting re-verification) rather than hard-locking the
  // account. This mirrors the periodic backend re-check but lets the client
  // refresh on demand.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: user_id is missing or malformed.
  // - PERMISSION_DENIED: The supplied user_id does not match the authenticated
  //   caller.
  // - FAILED_PRECONDITION: The account has no verified identity to re-check.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The Pocket Sign Verify service is not reachable.
  rpc ReCheck(ReCheckRequest) returns (ReCheckResponse);

  // GetMyVerificationStatus returns the caller's current verification level and,
  // when verified, the VerifiedIdentity backing the account (method, dedupe
  // strength, freshness status). The client uses it to render verification state
  // and to decide whether a verification-required event is satisfiable.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: user_id is missing or malformed.
  // - PERMISSION_DENIED: The supplied user_id does not match the authenticated
  //   caller.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc GetMyVerificationStatus(GetMyVerificationStatusRequest) returns (GetMyVerificationStatusResponse);
}

// StartVerifyRequest opens a verification attempt for the authenticated caller.
message StartVerifyRequest {
  // The caller's user identifier. Must match the userID derived from the
  // authenticated session; mismatches are rejected with PERMISSION_DENIED.
  entity.v1.UserId user_id = 1 [(buf.validate.field).required = true];

  // Which credential the fan will present: JPKI (high assurance, strong dedupe)
  // or the 運転免許証 IC fallback (weaker dedupe). UNSPECIFIED is rejected.
  entity.v1.VerificationMethod method = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// StartVerifyResponse carries the challenge the Pocket Sign Verify SDK signs
// against the card.
message StartVerifyResponse {
  // An opaque handle for this verification attempt, correlating it with the
  // eventual CompleteVerify call. Short-lived; consumed by exactly one
  // CompleteVerify. (Backed by a PocketSign Stamp session.)
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // The URL the client MUST open so the fan can read and sign their card in the
  // PocketSign app. On completion the app returns the fan to the platform's
  // callback with this attempt's session id; the client then calls
  // CompleteVerify. The client does NOT read the card itself.
  entity.v1.Url redirect_url = 2 [(buf.validate.field).required = true];
}

// CompleteVerifyRequest submits the SDK-signed response for validation.
message CompleteVerifyRequest {
  // The caller's user identifier. Must match the userID derived from the
  // authenticated session; mismatches are rejected with PERMISSION_DENIED.
  entity.v1.UserId user_id = 1 [(buf.validate.field).required = true];

  // The opaque handle returned by StartVerify (the session id the platform
  // received on the PocketSign callback). The backend finalizes this session
  // with Pocket Sign to obtain the verified result; the raw certificate/
  // response is validated vendor-side and never persisted here. The card
  // signature happens in the PocketSign app, so no signed payload is sent on
  // this request.
  string session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Field 3 was `bytes signed_response` (the SDK-signed payload in the old
  // embedded-SDK challenge–response flow), removed when the flow moved to the
  // PocketSign Stamp redirect model (the app signs; the backend finalizes by
  // session_id). Reserved to prevent reuse.
  reserved 3;
  reserved "signed_response";
}

// CompleteVerifyResponse returns the established verification.
message CompleteVerifyResponse {
  // The verification record created on success. Retains only the result (person
  // key, method, dedupe strength, status) — no raw certificate, no 個人番号.
  entity.v1.VerifiedIdentity verified_identity = 1 [(buf.validate.field).required = true];

  // The account's verification level after this call (IDENTITY_VERIFIED on
  // success). Echoed so the client need not re-read it.
  entity.v1.VerificationLevel verification_level = 2 [(buf.validate.field).enum.defined_only = true];
}

// ReCheckRequest requests a 現況確認 (liveness) re-check for the caller.
message ReCheckRequest {
  // The caller's user identifier. Must match the userID derived from the
  // authenticated session; mismatches are rejected with PERMISSION_DENIED.
  entity.v1.UserId user_id = 1 [(buf.validate.field).required = true];
}

// ReCheckResponse returns the freshness outcome of the re-check.
message ReCheckResponse {
  // The verified identity's freshness status after the re-check
  // (ACTIVE, or NEEDS_REVERIFICATION when revoked/changed/expired).
  entity.v1.VerificationStatus status = 1 [(buf.validate.field).enum.defined_only = true];

  // The account's verification level after the re-check. A revoked/changed
  // result does not hard-lock the account; the level reflects the current state.
  entity.v1.VerificationLevel verification_level = 2 [(buf.validate.field).enum.defined_only = true];
}

// GetMyVerificationStatusRequest reads the caller's verification status.
message GetMyVerificationStatusRequest {
  // The caller's user identifier. Must match the userID derived from the
  // authenticated session; mismatches are rejected with PERMISSION_DENIED.
  entity.v1.UserId user_id = 1 [(buf.validate.field).required = true];
}

// GetMyVerificationStatusResponse returns the caller's verification level and,
// when verified, the backing identity.
message GetMyVerificationStatusResponse {
  // The account's current verification level (UNVERIFIED or IDENTITY_VERIFIED).
  entity.v1.VerificationLevel verification_level = 1 [(buf.validate.field).enum.defined_only = true];

  // The verification record backing the account. Absent when the account is
  // UNVERIFIED.
  entity.v1.VerifiedIdentity verified_identity = 2;
}
