syntax = "proto3";

package liverty_music.rpc.user.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/user.proto";

// UserService provides operations for managing user accounts and profiles.
//
// Every per-user call acts on the signed-in caller's own User: no request
// names a User, and the backend resolves the caller from the sign-in identity.
// A returned User carries its id, email, provider user ID, name, preferred
// language when set, home (country code, level 1 and, when set, level 2,
// without a centroid), and its full name and phone number when set. Whether the
// User is verified is read from
// liverty_music.rpc.identity_verification.v1.IdentityVerificationService.Get.
// RequestPasskeyRecovery is the only call that needs no sign-in.
service UserService {
  // Get retrieves the profile of the authenticated user, so the same profile
  // is restored on every device.
  //
  // Possible errors:
  // - NOT_FOUND: No user record exists for the authenticated identity.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Get(GetRequest) returns (GetResponse);

  // Create registers a new user profile in the system, or returns the
  // existing profile when the caller's provider user ID (the identity
  // provider's ID for the User, the token's subject) is already provisioned.
  //
  // Like every per-user call, the request carries no user id: the backend
  // identifies the caller via the provider user ID extracted from the JWT.
  //
  // Create is idempotent on a duplicate provider user ID: a second call for
  // the same provider user ID returns the existing user as a successful response
  // (CreateResponse.user populated) rather than ALREADY_EXISTS. The
  // pre-existing email and name fields on the stored row are NOT overwritten
  // — the duplicate call is a read, not an upsert. This gives the frontend a
  // uniform "resolve-or-provision" bootstrap RPC (e.g., on a fresh device).
  //
  // The home field may be provided when the user has already selected their
  // home area during the onboarding flow (before account creation). Supplying
  // it here persists the home area atomically with the initial user record,
  // avoiding a separate SetHome call immediately after sign-up. On the
  // idempotent-return path, home is ignored — use SetHome to change an
  // already-provisioned user's home area.
  //
  // The preferred_language field is optional on the wire so this RPC
  // remains backward-compatible during a rolling deploy where the new
  // backend may be live before all frontend clients have been updated.
  // Updated clients MUST send their currently effective locale; the
  // value, when present, is persisted atomically with the new user row.
  // Absent values are stored as NULL and trigger the same client-side
  // backfill path as legacy rows (see SetPreferredLanguage and the
  // user-profile-hydration capability). On the idempotent-return path,
  // preferred_language is IGNORED — the existing row's language is not
  // overwritten, mirroring the rule for home. Use
  // SetPreferredLanguage to change an already-provisioned user's
  // preferred display language.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The provided user data is missing required fields or is malformed.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Update changes the authenticated user's full name, phone number or both;
  // a field left unset keeps its value. The lottery entry and checkout screens
  // prefill these values, and the ticket face shows the current ones.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: Neither field is given, or a given value breaks the
  //   User's personal details rule (for example a phone number not in E.164
  //   form).
  // - NOT_FOUND: No user record exists for the authenticated identity.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // SetPreferredLanguage sets or changes the authenticated user's
  // preferred display language.
  //
  // The preferred language determines the locale used to render the UI and
  // user-facing notifications. Users typically set this at signup (carried
  // in the Create RPC) and may update it later from settings. A malformed
  // language is rejected before the caller is resolved, so it fails the same
  // way for every caller.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: preferred_language is empty or not a valid ISO 639-1 two-letter code.
  // - NOT_FOUND: No user record exists for the authenticated identity.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetPreferredLanguage(SetPreferredLanguageRequest) returns (SetPreferredLanguageResponse);

  // SetHome sets or changes the authenticated user's home area.
  //
  // The home area determines how the dashboard classifies live events into
  // "Home", "Nearby", and "Away" lanes. Users typically set this during
  // onboarding and may update it later from settings.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The home is missing, or contains an unrecognized or malformed code.
  // - NOT_FOUND: No user record exists for the authenticated identity.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetHome(SetHomeRequest) returns (SetHomeResponse);

  // ResendEmailVerification triggers a new email verification message for the
  // authenticated user via the identity provider. Whether
  // verification is available, resolving the caller, and the limit of 3
  // resends per 10 minutes per User are decided by the backend usecase.
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The user's email is already verified.
  // - NOT_FOUND: No user record exists for the authenticated identity.
  // - RESOURCE_EXHAUSTED: The user has exceeded the resend rate limit.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The email verification service is not configured.
  rpc ResendEmailVerification(ResendEmailVerificationRequest) returns (ResendEmailVerificationResponse);

  // RequestPasskeyRecovery asks for a link, sent to the given address, that
  // registers a new passkey on the device it is opened on. The fan app calls
  // it from the "can't sign in" screen, so it needs no sign-in and uses no
  // sign-in identity even when one is presented. It answers with the same
  // empty response, in the same time, whether or not the address belongs to a
  // User; the link is sent only when it belongs to a User whose address is
  // verified. At most 3 links are requested for one address, letter case
  // ignored, in any 60 minutes; a further request for that address succeeds
  // without requesting one.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The email is missing or not an email address of at
  //   most 165 characters.
  // - RESOURCE_EXHAUSTED: The client made more than 10 requests in the last 60
  //   minutes.
  rpc RequestPasskeyRecovery(RequestPasskeyRecoveryRequest) returns (RequestPasskeyRecoveryResponse);
}

// GetRequest is the request for retrieving the authenticated user's profile.
// It names no User; the caller is taken from the sign-in.
message GetRequest {
  reserved 1;
  reserved "user_id";
}

// GetResponse contains the profile information of the requested user.
message GetResponse {
  // The user entity representing the requested profile.
  entity.v1.User user = 1 [(buf.validate.field).required = true];
}

// CreateRequest provides the necessary details to register a new user profile.
// The provider user ID (the token's subject) and name are extracted from the
// authenticated JWT context by the backend and MUST NOT be provided by the
// client. See the Create RPC documentation for the idempotent-return semantics
// on a duplicate provider user ID.
message CreateRequest {
  // Required. The user's email address for account identity.
  entity.v1.Email email = 1 [(buf.validate.field).required = true];

  // Optional. The user's home area, when it has already been selected during
  // the onboarding flow before account creation. Providing this field here
  // persists the home area atomically with the initial user record. When
  // absent, the home area remains unset and can be configured later via
  // SetHome. Ignored on the idempotent-return path (duplicate provider user
  // ID) — the existing row's home is not overwritten.
  entity.v1.Home home = 2;

  // Optional on the wire to keep this RPC backward-compatible during a
  // rolling deploy where the new backend may serve old frontend clients
  // briefly. Updated clients SHALL send their currently effective locale
  // as an ISO 639-1 two-letter code (e.g., "ja", "en"). When present,
  // the value is validated against `^[a-z]{2}$` and persisted atomically
  // with the new user record so subsequent sessions can render the UI in
  // the user's chosen language without relying on browser storage.
  //
  // When absent, the user row is created with a NULL preferred_language
  // — semantically equivalent to a legacy row pending backfill — and the
  // client backfills it on next hydration via SetPreferredLanguage.
  // This keeps the old-client transition window safe without requiring
  // perfectly synchronized deploys.
  //
  // Ignored on the idempotent-return path (duplicate provider user ID) — the
  // existing row's preferred_language is not overwritten, mirroring the
  // rule for home.
  optional string preferred_language = 3 [(buf.validate.field).string = {
    min_len: 2
    pattern: "^[a-z]{2}$"
  }];
}

// CreateResponse returns the user profile as successfully created.
message CreateResponse {
  // The newly created user entity, including its assigned identifier.
  entity.v1.User user = 1 [(buf.validate.field).required = true];
}

// UpdateRequest carries the caller's new full name and phone number and the
// mask naming which of them to change.
//
// The nested User's own rules (its required id, email and provider user id) are
// not evaluated, because the request names no User and carries only the
// fields to change. The backend validates each value the mask names by its
// entity rule (FullName, PhoneNumber) before any change and rejects a
// malformed one with INVALID_ARGUMENT.
message UpdateRequest {
  option (buf.validate.message).cel = {
    id: "update.some_field"
    message: "at least one of full_name and phone_number must be given"
    expression: "has(this.full_name) || has(this.phone_number)"
  };

  // The new full name. Unset keeps the current one.
  optional entity.v1.FullName full_name = 1;

  // The new phone number, in E.164 form. Unset keeps the current one.
  optional entity.v1.PhoneNumber phone_number = 2;
}

// UpdateResponse returns the user profile after the change.
message UpdateResponse {
  // The updated user entity.
  entity.v1.User user = 1 [(buf.validate.field).required = true];
}

// SetHomeRequest provides the new home area for the authenticated user. It
// names no User; the caller is taken from the sign-in.
message SetHomeRequest {
  reserved 1;
  reserved "user_id";

  // Required. The structured home area representing the user's geographic base
  // for live event attendance. See entity.v1.Home for the full code system contract.
  entity.v1.Home home = 2 [(buf.validate.field).required = true];
}

// SetHomeResponse returns the updated user profile after the home area change.
message SetHomeResponse {
  // The updated user entity with the new home area applied.
  entity.v1.User user = 1 [(buf.validate.field).required = true];
}

// SetPreferredLanguageRequest provides the new preferred language for the
// authenticated user. It names no User; the caller is taken from the sign-in.
message SetPreferredLanguageRequest {
  reserved 1;
  reserved "user_id";

  // Required. The new preferred display language as an ISO 639-1 two-letter
  // code (e.g., "ja", "en"). Empty values and codes outside the
  // `^[a-z]{2}$` pattern are rejected with INVALID_ARGUMENT.
  string preferred_language = 2 [(buf.validate.field).string = {
    min_len: 2
    pattern: "^[a-z]{2}$"
  }];
}

// SetPreferredLanguageResponse returns the updated user profile after the
// preferred language change.
message SetPreferredLanguageResponse {
  // The updated user entity with the new preferred language applied.
  entity.v1.User user = 1 [(buf.validate.field).required = true];
}

// ResendEmailVerificationRequest is the request for resending the email
// verification message. It names no User; the caller is taken from the
// sign-in.
message ResendEmailVerificationRequest {
  reserved 1;
  reserved "user_id";
}

// ResendEmailVerificationResponse is returned when the verification email has
// been successfully queued for delivery.
message ResendEmailVerificationResponse {}

// RequestPasskeyRecoveryRequest carries the address to send the passkey
// registration link to.
message RequestPasskeyRecoveryRequest {
  // Required. The email of the account the person cannot sign in to.
  entity.v1.Email email = 1 [(buf.validate.field).required = true];
}

// RequestPasskeyRecoveryResponse is empty, so the answer never reveals whether
// the address belongs to a User.
message RequestPasskeyRecoveryResponse {}
