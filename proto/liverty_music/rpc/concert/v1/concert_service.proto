syntax = "proto3";

package liverty_music.rpc.concert.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/geo_location.proto";
import "liverty_music/entity/v1/series.proto";
import "liverty_music/entity/v1/user.proto";

// ConcertService provides operations for managing the catalog of musical concerts.
// It acts as the primary data source for upcoming live music events.
//
// Every response that returns concerts also returns, once each, every Series and
// Artist those concerts refer to, in its `series` and `artists` lists. A concert
// carries only the id of its Series (through its Event) and the ids of its
// Artists. Every returned Series carries its organizer id, description, cover
// media, visibility and publish state when it has them, on every call alike.
service ConcertService {
  // List retrieves a collection of concert events, filtered by the performing artist.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The request is missing a required field or contains invalid data.
  // - NOT_FOUND: No concerts were found for the specified artist.
  rpc List(ListRequest) returns (ListResponse);

  // Get retrieves the concert of one event for its public event page.
  // Authentication is not required. Only an event of a first-party series that
  // is PUBLIC and PUBLISHED or CANCELLED has an event page.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The event ID is missing or is not a UUID.
  // - NOT_FOUND: No event has the ID, or the event has no event page. The same
  //   error is returned in every case, so the existence of a draft or unlisted
  //   event is not revealed.
  rpc Get(GetRequest) returns (GetResponse);

  // ListBySeries retrieves every concert of one series that has an event page,
  // ordered by date and, on the same date, by start time. Authentication is
  // not required. Used by the event page to offer the series' other dates.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The series ID is missing or is not a UUID.
  // - NOT_FOUND: No series has the ID, or the series has no event page. The
  //   same error is returned in every case.
  rpc ListBySeries(ListBySeriesRequest) returns (ListBySeriesResponse);

  // ListByFollower retrieves all concerts for artists followed by the authenticated user.
  // The caller's identity is determined from the authentication context.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The user identity could not be verified.
  rpc ListByFollower(ListByFollowerRequest) returns (ListByFollowerResponse);

  // ListByArtists retrieves concerts for the specified artists, grouped by date
  // and classified by geographic proximity to the caller's home area.
  // Authentication is not required; the caller provides artist IDs and home explicitly.
  // The primary filter axis is artist_ids; proximity grouping is a property of the
  // response format, not the filter.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The request is missing required fields, contains invalid data,
  //   or exceeds the maximum number of artist IDs (50).
  rpc ListByArtists(ListByArtistsRequest) returns (ListByArtistsResponse);

  // ListByLocation retrieves all concerts in the catalog whose venues are HOME or NEARBY
  // relative to a geographic reference point, within a date range, grouped by date and
  // proximity. Authentication is not required. AWAY-tier concerts (beyond 200 km with a
  // different admin_area) are excluded from the response.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The request is missing required fields, the location is invalid,
  //   from is after to, or the date range exceeds 30 days.
  rpc ListByLocation(ListByLocationRequest) returns (ListByLocationResponse);
}

// ListRequest is the request for retrieving concerts associated with a specific artist.
message ListRequest {
  // Required. The unique identifier of the artist whose concerts are to be listed.
  entity.v1.ArtistId artist_id = 1 [(buf.validate.field).required = true];
}

// ListResponse contains the collection of concerts matching the ListRequest.
message ListResponse {
  // The collection of concert events found.
  repeated entity.v1.Concert concerts = 1;

  // Every Series the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Series series = 2;

  // Every Artist the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Artist artists = 3;
}

// GetRequest is the request for retrieving the concert of one event.
message GetRequest {
  // Required. The unique identifier of the event.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// GetResponse contains the concert of the requested event.
message GetResponse {
  // The concert of the requested event.
  entity.v1.Concert concert = 1;

  // The Series the returned concert refers to.
  repeated entity.v1.Series series = 2;

  // Every Artist the returned concert refers to, once each.
  repeated entity.v1.Artist artists = 3;
}

// ListBySeriesRequest is the request for retrieving the concerts of one series.
message ListBySeriesRequest {
  // Required. The unique identifier of the series.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];
}

// ListBySeriesResponse contains the concerts of the requested series.
message ListBySeriesResponse {
  // The concerts of the series, ordered by date and, on the same date, by
  // start time.
  repeated entity.v1.Concert concerts = 1;

  // Every Series the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Series series = 2;

  // Every Artist the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Artist artists = 3;
}

// ListByFollowerRequest is the request for retrieving concerts for all artists
// followed by the authenticated user. The user identity is determined from the
// authentication context.
message ListByFollowerRequest {
  // Optional. The inclusive start of the date range (venue-local calendar date).
  // When provided, only concerts whose local event date is on or after this date
  // are returned, including dates in the past when it precedes the current date.
  // When omitted, the result defaults to concerts on or after the current date
  // (today onward). Dashboard callers should send the client's local date to
  // anchor the "today" boundary to the caller's timezone.
  entity.v1.LocalDate from = 1;
}

// ListByFollowerResponse contains concerts for all artists followed by the caller,
// grouped by date and classified by geographic proximity.
message ListByFollowerResponse {
  reserved 1;
  reserved "concerts";

  // Concert groups ordered by date ascending. Each group contains concerts
  // for a single date, classified into home/nearby/away buckets based on
  // the geographic proximity between the user's home area and each venue.
  repeated ProximityGroup groups = 2;

  // Every Series the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Series series = 3;

  // Every Artist the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Artist artists = 4;
}

// ProximityGroup contains concerts for a single calendar date, classified into
// three geographic proximity buckets relative to the authenticated user's home area.
message ProximityGroup {
  reserved "distant";

  // The calendar date for this group.
  entity.v1.LocalDate date = 1 [(buf.validate.field).required = true];

  // Concerts at venues within the user's home area (admin_area matches home.level_1).
  repeated entity.v1.Concert home = 2;

  // Concerts at venues within 200km of the user's home area centroid.
  repeated entity.v1.Concert nearby = 3;

  // Concerts at venues beyond 200km, with unknown location, or when the user has no home set.
  repeated entity.v1.Concert away = 4;
}

// ListByArtistsRequest specifies the artists and home area for proximity-grouped
// concert retrieval. Used during onboarding when the caller is not yet authenticated.
message ListByArtistsRequest {
  // Required. The artists whose concerts are to be listed.
  // Maximum 50 artist IDs per request.
  repeated entity.v1.ArtistId artist_ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 50
  ];

  // Required. The caller's home area, used for proximity classification.
  entity.v1.Home home = 2 [(buf.validate.field).required = true];
}

// ListByArtistsResponse contains concerts for the specified artists,
// grouped by date and classified by geographic proximity.
message ListByArtistsResponse {
  // Concert groups ordered by date ascending. Each group contains concerts
  // for a single date, classified into home/nearby/away buckets based on
  // the geographic proximity between the provided home area and each venue.
  repeated ProximityGroup groups = 1;

  // Every Series the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Series series = 2;

  // Every Artist the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Artist artists = 3;
}

// ListByLocationRequest specifies a geographic reference point and a date range for
// discovering all concerts in the catalog near that point. Used by the Dashboard
// "All Nearby" mode; no authentication is required.
//
// The from <= to ordering is enforced here via a message-level CEL constraint. The
// "to - from <= 30 days" maximum is enforced in the server use-case layer because
// protovalidate CEL has no calendar-day arithmetic for google.type.Date, and switching
// the fields to google.protobuf.Timestamp would reintroduce the timezone ambiguity that
// LocalDate deliberately avoids.
message ListByLocationRequest {
  option (buf.validate.message).cel = {
    id: "list_by_location.from_before_to"
    message: "from must not be later than to"
    expression:
      "this.from.value.year < this.to.value.year"
      "|| (this.from.value.year == this.to.value.year"
      "    && (this.from.value.month < this.to.value.month"
      "        || (this.from.value.month == this.to.value.month"
      "            && this.from.value.day <= this.to.value.day)))"
  };

  // Required. The geographic reference point for proximity classification.
  entity.v1.GeoLocation location = 1 [(buf.validate.field).required = true];

  // Required. The inclusive start of the date range (venue-local calendar date).
  entity.v1.LocalDate from = 2 [(buf.validate.field).required = true];

  // Required. The inclusive end of the date range (venue-local calendar date).
  // Must not be earlier than from, and the span must not exceed 30 days.
  entity.v1.LocalDate to = 3 [(buf.validate.field).required = true];
}

// ListByLocationResponse contains all concerts near the reference point in the given
// date range, grouped by date and classified by proximity. The away field of every
// group is always empty — AWAY-tier concerts are excluded from this response.
message ListByLocationResponse {
  // Concert groups ordered by date ascending. Each group contains concerts for a single
  // date, classified into home/nearby buckets based on the geographic proximity between
  // the reference point and each venue. Groups with no HOME or NEARBY concerts are omitted.
  repeated ProximityGroup groups = 1;

  // Every Series the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Series series = 2;

  // Every Artist the returned concerts refer to, once each, in the order the
  // concerts first refer to them.
  repeated entity.v1.Artist artists = 3;
}
