syntax = "proto3";

// Package liverty_music.rpc.resale_entry.v1 provides the fan-facing
// ResaleEntryService: the signed-in fan's application for official resale
// (公式リセール) tickets of one sold-out TicketStock, from the card
// authorization to the entry and its result. The daily draws, which allocate
// listings to entries, charge the winners and release the others, run as an
// internal backend job, not an RPC. Listing a ticket for resale is
// liverty_music.rpc.resale_listing.v1.
package liverty_music.rpc.resale_entry.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/card_authorization.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/referral.proto";
import "liverty_music/entity/v1/resale_entry.proto";
import "liverty_music/entity/v1/seat_type.proto";
import "liverty_music/entity/v1/ticket_stock.proto";
import "liverty_music/entity/v1/user.proto";

// ResaleEntryService runs one fan's resale application in two steps:
//
//   1. AuthorizeCard records the 本人確認 name and phone number on the fan's
//      account and opens a card authorization for a count of tickets, which
//      the browser authenticates (3D Secure) with the returned card
//      authorization secret. No entry exists yet.
//   2. Confirm makes the fan's PENDING Order and the ENTERED entry from the
//      authenticated card authorization, so it takes part in the next draw.
//
// Once the fan completes authentication, the platform also makes the entry by
// itself, so an entry is made even when the browser closes before Confirm.
// Draws run at 12:00 Japan time on every day before the event's day and on
// the event's day at its resale deadline, 12:00 or 3 hours before the start
// time if that is earlier, which is the last draw. A draw allocates each entry
// all its tickets or none; an entry not allocated stays ENTERED for the next
// draw until the last. The card is charged only when the entry wins. A fan has
// at most one ENTERED resale entry per event and may withdraw it while it
// waits for a draw. List reads the fan's entries and their results. Every call
// requires a signed-in fan, who is always the caller; the fan is resolved from
// the token to their stored account and is never named in a request. A
// signed-in caller with no stored account fails with NOT_FOUND.
service ResaleEntryService {
  // AuthorizeCard records the 本人確認 full name and phone number on the
  // caller's account, then opens a CardAuthorization for the stock's seat type
  // price times the ticket count and returns it with the card authorization
  // secret, which the browser confirms with the payment provider (3D Secure);
  // the secret is never stored. The stock's resale must be open (the stock is
  // SOLD_OUT and its event's resale deadline has not passed) and its event
  // published; the count, together with the tickets the caller holds for the
  // event (the issued Tickets of their PAID Orders and the counts of their
  // PENDING Orders), must fit the event's per-account limit; every ticket the
  // caller holds for the event must be of the stock's SeatType; and when any
  // sale of the event requires verification, the caller must hold an Active
  // IdentityVerification. A referral_code goes with the card authorization
  // onto the Order Confirm makes. No Order or entry is stored and no money is
  // captured.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The TicketStock does not exist, or the caller has no stored
  //   account.
  // - INVALID_ARGUMENT: The ticket_stock_id is missing or malformed, the
  //   ticket_count is not greater than 0, the referral_code is given and
  //   malformed, or the full name or phone number is missing or breaks the
  //   User's personal details rule (the phone number must be in E.164 form).
  // - FAILED_PRECONDITION: The stock's resale is not open, its concert is not
  //   published (for example cancelled), the caller's tickets for the event
  //   plus the count exceed the per-account limit, the caller holds tickets
  //   of another SeatType for the event, or a sale of the event requires
  //   verification and the caller holds no Active IdentityVerification.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc AuthorizeCard(AuthorizeCardRequest) returns (AuthorizeCardResponse);

  // Confirm makes the caller's PENDING Order and ENTERED entry from their card
  // authorization, after checking that it is Authorized for the stock's seat
  // type price times its ticket count, that the stock's resale is still open,
  // that the application still fits the event and that the caller has no
  // other ENTERED resale entry for the event. Confirming a card authorization
  // that already made an entry returns that entry. A card authorization
  // Confirm rejects is released at once, so the fan is not charged. No money
  // is captured at entry.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account, or the TicketStock no
  //   longer exists; the card authorization is released.
  // - INVALID_ARGUMENT: The card_authorization_id is missing or malformed.
  // - PERMISSION_DENIED: The card authorization does not exist, is not for a
  //   resale entry or is another fan's. Non-revealing.
  // - FAILED_PRECONDITION: The card authorization is not Authorized (card
  //   authentication not completed, or already captured or released); or it
  //   is rejected and released: the stock's resale is no longer open, or the
  //   application no longer fits the event.
  // - ALREADY_EXISTS: The caller already has another ENTERED resale entry for
  //   the event; the card authorization is released.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);

  // List returns all of the caller's resale entries, in any state, newest
  // first, with their Orders, TicketStocks and SeatTypes. An ENTERED entry
  // carries the time of its event's next draw. A caller who never applied
  // gets an empty list.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  rpc List(ListRequest) returns (ListResponse);

  // Withdraw ends the caller's ENTERED entry before a draw decides it and
  // returns it WITHDRAWN: its Order becomes VOID and its card authorization is
  // released after the call returns, so nothing is charged. An entry a draw
  // has already decided cannot be withdrawn. No email or push is sent.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The entry does not exist or is another fan's, or the caller
  //   has no stored account.
  // - INVALID_ARGUMENT: The resale_entry_id is missing or malformed.
  // - FAILED_PRECONDITION: The entry is no longer ENTERED: a draw already made
  //   it WON, LOST or LAPSED, or it was already WITHDRAWN.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
}

// AuthorizeCardRequest carries the stock, the count and the 本人確認 details.
message AuthorizeCardRequest {
  // Required. The sold-out TicketStock to apply for.
  entity.v1.TicketStockId ticket_stock_id = 1 [(buf.validate.field).required = true];

  // Required. The tickets requested for the companion group, allocated
  // all-or-nothing: at least 1 and at most the event's per-account limit
  // (never above 10).
  int32 ticket_count = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Required. The caller's real full name, saved on the caller's account.
  entity.v1.FullName full_name = 3 [(buf.validate.field).required = true];

  // Required. The caller's phone number in E.164 form, saved on the caller's
  // account.
  entity.v1.PhoneNumber phone_number = 4 [(buf.validate.field).required = true];

  // Optional. The referral code of the link the fan came from. It is kept on
  // the Order Confirm makes; a malformed code fails with INVALID_ARGUMENT.
  // Absent for an entry without a code.
  optional entity.v1.ReferralCode referral_code = 5;
}

// AuthorizeCardResponse returns the card authorization for the browser to
// authenticate.
message AuthorizeCardResponse {
  // The card authorization opened; Confirm names it.
  entity.v1.CardAuthorizationId card_authorization_id = 1 [(buf.validate.field).required = true];

  // The card authorization secret, which the browser confirms with the payment
  // provider's payment form (3D Secure). Short-lived; never stored by the
  // client or the server.
  entity.v1.CardAuthorizationSecret card_authorization_secret = 2 [(buf.validate.field).required = true];
}

// ConfirmRequest names the card authorization to make the entry from.
message ConfirmRequest {
  // Required. The caller's card authorization from AuthorizeCard.
  entity.v1.CardAuthorizationId card_authorization_id = 1 [(buf.validate.field).required = true];
}

// ConfirmResponse returns the entry and its Order.
message ConfirmResponse {
  // The entry, ENTERED, with the time of its event's next draw.
  entity.v1.ResaleEntry resale_entry = 1 [(buf.validate.field).required = true];

  // The entry's PENDING Order: its stock, ticket count and amount.
  entity.v1.Order order = 2 [(buf.validate.field).required = true];
}

// ListRequest takes no fields: the caller's own entries are listed.
message ListRequest {}

// ListResponse returns the caller's resale entries.
message ListResponse {
  // The caller's entries, newest first. Empty when the caller never applied.
  repeated entity.v1.ResaleEntry resale_entries = 1;

  // The entries' Orders, one for each entry above, with the stock and ticket
  // count each entry is for.
  repeated entity.v1.Order orders = 2;

  // The TicketStocks the entries are for, each once, with the event and seat
  // type of each.
  repeated entity.v1.TicketStock ticket_stocks = 3;

  // The SeatTypes of the stocks above, each once, with their names and
  // prices.
  repeated entity.v1.SeatType seat_types = 4;
}

// WithdrawRequest names the entry to withdraw.
message WithdrawRequest {
  // Required. One of the caller's resale entries.
  entity.v1.ResaleEntryId resale_entry_id = 1 [(buf.validate.field).required = true];
}

// WithdrawResponse returns the withdrawn entry.
message WithdrawResponse {
  // The entry, WITHDRAWN.
  entity.v1.ResaleEntry resale_entry = 1 [(buf.validate.field).required = true];
}
