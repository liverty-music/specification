syntax = "proto3";

// Package liverty_music.rpc.lottery_entry.v1 provides the fan-facing
// LotteryEntryService: the signed-in fan's entry into the lottery for one
// TicketType of a LOTTERY TicketSale, from the Draft to the confirmed entry,
// its withdrawal before the draw and its result. The draw itself (which
// captures the winners' holds and releases the others) runs as an internal
// backend job, not an RPC. Sales are configured through
// liverty_music.rpc.organizer.ticket_sale.v1.
package liverty_music.rpc.lottery_entry.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/lottery_entry.proto";
import "liverty_music/entity/v1/ticket_type.proto";
import "liverty_music/entity/v1/user.proto";

// LotteryEntryService runs one fan's lottery entry, in the same steps as a
// first-come checkout:
//
//   1. Start makes a Draft entry for a count of tickets; nothing is held on the
//      card yet.
//   2. Authorize records the 本人確認 name and phone number on the fan's
//      account and opens a card hold for the amount, which the browser
//      authenticates (3D Secure) with the returned client secret.
//   3. Confirm checks the hold and makes the entry Entered, so it takes part
//      in the draw.
//
// Withdraw gives up an entry before the draw, and ListByTicketType reads the
// fan's entries, whose state after the draw is the result. No money is
// captured here. Every call requires a signed-in fan, who is always the
// caller; the fan is resolved from the token to their stored account and is
// never named in a request. A signed-in caller with no stored account fails
// with NOT_FOUND.
service LotteryEntryService {
  // Start makes a Draft entry for the caller on a TicketType of a LOTTERY sale
  // whose window is open, or resumes it: starting again with the same count
  // returns the same Draft, and starting with another count withdraws the
  // Draft and makes a new one. The count must be at most the TicketType's
  // per-account limit and, together with the caller's Issued tickets for the
  // TicketType's event, must still fit it. When the sale requires
  // verification, the caller must hold an Active Kyc. A caller whose entry for
  // the TicketType is already Entered, Won or Lost cannot start another; one
  // whose only earlier entry is Withdrawn can.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The TicketType does not exist, or the caller has no stored
  //   account.
  // - INVALID_ARGUMENT: The ticket_type_id is missing or malformed, or the
  //   ticket_count is not greater than 0 or is above the TicketType's
  //   per-account limit.
  // - FAILED_PRECONDITION: The TicketType's sale is not a LOTTERY sale or its
  //   window is not open, the sale requires verification and the caller holds
  //   no Active Kyc, the caller's Issued tickets for the event plus the count
  //   exceed the per-account limit, or the caller already has an Entered, Won
  //   or Lost entry for the TicketType.
  rpc Start(StartRequest) returns (StartResponse);

  // Authorize records the 本人確認 full name and phone number on the caller's
  // account, then opens a card hold for the TicketType's price times the
  // entry's ticket count on the caller's Draft entry and returns the hold's
  // client secret, which the browser confirms with the payment provider (3D
  // Secure); the secret is never stored. Authorizing a Draft that already has
  // a hold, for example after a declined card, returns that hold for another
  // attempt. No money is captured.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  // - INVALID_ARGUMENT: The lottery_entry_id is missing or malformed, or the
  //   full name or phone number is missing or breaks the User's personal
  //   details rule (the phone number must be in E.164 form).
  // - PERMISSION_DENIED: The entry does not exist or is another fan's.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The entry is not a Draft, or its sale's window is
  //   not open.
  // - UNAVAILABLE: Card payments are temporarily unavailable; the Draft has no
  //   hold.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // Confirm makes the caller's authorized Draft entry Entered, so it takes
  // part in the draw, after checking that its hold has completed card
  // authentication and is held in yen for the TicketType's price times the
  // entry's ticket count on an accepted card (every brand except American
  // Express). Confirming an Entered entry again returns it unchanged. No money
  // is captured at entry.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account, or the entry's hold is not
  //   known to the payment provider.
  // - INVALID_ARGUMENT: The lottery_entry_id is missing or malformed, or the
  //   hold's amount or currency does not match the entry.
  // - PERMISSION_DENIED: The entry does not exist or is another fan's.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The entry is not a Draft with a hold, its sale's
  //   window is not open, the card was not authenticated or its hold is not
  //   waiting to be captured, or the card is American Express.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);

  // Withdraw gives up the caller's Draft or Entered entry before the draw,
  // also after the window has closed: it releases the entry's card hold, when
  // it has one, and only then makes the entry Withdrawn. When the release
  // fails, its error is returned and the entry keeps its state. The caller may
  // start a new entry while the window is still open.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The entry does not exist, or the caller has no stored account.
  // - INVALID_ARGUMENT: The lottery_entry_id is missing or malformed.
  // - PERMISSION_DENIED: The entry is another fan's.
  // - FAILED_PRECONDITION: The entry is not withdrawable: the draw has already
  //   run for it, or it is already Withdrawn.
  // - UNAVAILABLE: Card payments are temporarily unavailable; the entry keeps
  //   its state.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);

  // ListByTicketType returns the caller's entries for a TicketType, Withdrawn
  // ones included, newest first, so the fan sees whether they have entered
  // and, after the draw, whether they won. A caller who never entered gets an
  // empty list.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The TicketType does not exist, or the caller has no stored
  //   account.
  // - INVALID_ARGUMENT: The ticket_type_id is missing or malformed.
  rpc ListByTicketType(ListByTicketTypeRequest) returns (ListByTicketTypeResponse);
}

// StartRequest names the TicketType and how many tickets to enter for.
message StartRequest {
  // Required. The TicketType of a LOTTERY sale to enter.
  entity.v1.TicketTypeId ticket_type_id = 1 [(buf.validate.field).required = true];

  // Required. The tickets requested for the companion group, allocated
  // all-or-nothing: at least 1 and at most the TicketType's per-account limit
  // (never above 10).
  int32 ticket_count = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
}

// StartResponse returns the Draft entry.
message StartResponse {
  // The caller's Draft entry, with no hold yet unless a resumed Draft already
  // has one.
  entity.v1.LotteryEntry lottery_entry = 1 [(buf.validate.field).required = true];
}

// AuthorizeRequest carries the Draft entry and the 本人確認 details.
message AuthorizeRequest {
  // Required. The caller's Draft entry.
  entity.v1.LotteryEntryId lottery_entry_id = 1 [(buf.validate.field).required = true];

  // Required. The caller's real full name, saved on the caller's account.
  entity.v1.FullName full_name = 2 [(buf.validate.field).required = true];

  // Required. The caller's phone number in E.164 form, saved on the caller's
  // account.
  entity.v1.PhoneNumber phone_number = 3 [(buf.validate.field).required = true];
}

// AuthorizeResponse returns the card hold for the browser to authenticate.
message AuthorizeResponse {
  // The payment provider's client secret for the card hold, which the browser
  // confirms with the provider's payment form (3D Secure). Opaque and
  // short-lived; never stored by the client or the server.
  string client_secret = 1 [(buf.validate.field).string.min_len = 1];
}

// ConfirmRequest names the entry to confirm.
message ConfirmRequest {
  // Required. The caller's authorized Draft entry.
  entity.v1.LotteryEntryId lottery_entry_id = 1 [(buf.validate.field).required = true];
}

// ConfirmResponse returns the confirmed entry.
message ConfirmResponse {
  // The entry, now Entered.
  entity.v1.LotteryEntry lottery_entry = 1 [(buf.validate.field).required = true];
}

// WithdrawRequest names the entry to withdraw.
message WithdrawRequest {
  // Required. The caller's Draft or Entered entry.
  entity.v1.LotteryEntryId lottery_entry_id = 1 [(buf.validate.field).required = true];
}

// WithdrawResponse is empty: a successful withdrawal returns nothing beyond
// the OK status.
message WithdrawResponse {}

// ListByTicketTypeRequest names the TicketType whose entries to list.
message ListByTicketTypeRequest {
  // Required. The TicketType whose entries of the caller to list.
  entity.v1.TicketTypeId ticket_type_id = 1 [(buf.validate.field).required = true];
}

// ListByTicketTypeResponse returns the caller's entries for the TicketType.
message ListByTicketTypeResponse {
  // The caller's entries for the TicketType, Withdrawn ones included, newest
  // first. Empty when the caller never entered.
  repeated entity.v1.LotteryEntry lottery_entries = 1;
}
