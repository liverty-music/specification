syntax = "proto3";

// Package liverty_music.rpc.lottery_entry.v1 provides the fan-facing
// LotteryEntryService: the signed-in fan's entry into a LOTTERY TicketSale for
// one TicketStock of an event the sale names, from the card authorization to
// the entry and its result. The draw itself (which captures the winners' card
// authorizations and releases the others) runs as an internal backend job, not
// an RPC. Sales are configured through
// liverty_music.rpc.organizer.ticket_sale.v1.
package liverty_music.rpc.lottery_entry.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/card_authorization.proto";
import "liverty_music/entity/v1/lottery_entry.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/referral.proto";
import "liverty_music/entity/v1/ticket_sale.proto";
import "liverty_music/entity/v1/ticket_stock.proto";
import "liverty_music/entity/v1/user.proto";

// LotteryEntryService runs one fan's lottery entry in two steps:
//
//   1. AuthorizeCard records the 本人確認 name and phone number on the fan's
//      account and opens a card authorization for a count of tickets, which
//      the browser authenticates (3D Secure) with the returned card
//      authorization secret. No entry exists yet.
//   2. Confirm makes the fan's PENDING Order and the Entered entry from the
//      authenticated card authorization, so it takes part in the draw.
//
// To change the count, the fan authorizes again; a card authorization whose
// authentication was never completed holds nothing on the card. Once the fan
// completes authentication, the platform also makes the entry by itself, so
// an entry is made even when the browser closes before Confirm. A confirmed
// entry cannot be given up. A fan enters a sale at most once for each event it
// names. ListByTicketType reads the fan's entries in a sale, whose states
// after the draw are the results. No money is captured here. Every call
// requires a signed-in fan, who is always the caller; the fan is resolved from
// the token to their stored account and is never named in a request. A
// signed-in caller with no stored account fails with NOT_FOUND.
service LotteryEntryService {
  // AuthorizeCard records the 本人確認 full name and phone number on the
  // caller's account, then opens a CardAuthorization for the stock's seat type
  // price times the ticket count and returns it with the card authorization
  // secret, which the browser confirms with the payment provider (3D Secure);
  // the secret is never stored. The sale must be a LOTTERY sale whose window
  // is open and that names the stock's event; the count must be at most the
  // event's per-account limit and, together with the tickets the caller holds
  // for the event (the issued Tickets of their PAID Orders and the counts of
  // their PENDING Orders), must still fit it; every ticket the caller holds for
  // the event must be of the stock's SeatType; when the sale requires
  // verification, the caller must hold an Active IdentityVerification; and the
  // caller must have no entry in the sale for the stock's event. A
  // referral_code goes with the card authorization onto the Order Confirm
  // makes. No Order or entry is stored and no money is captured.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The sale or the TicketStock does not exist, or the caller has
  //   no stored account.
  // - INVALID_ARGUMENT: The ticket_sale_id or ticket_stock_id is missing or
  //   malformed, the ticket_count is not greater than 0 or is above the
  //   event's per-account limit, the referral_code is given and malformed, or
  //   the full name or phone number is missing or breaks the User's personal
  //   details rule (the phone number must be in E.164 form).
  // - FAILED_PRECONDITION: The sale is not a LOTTERY sale, does not name the
  //   stock's event or its window is not open, the sale requires verification
  //   and the caller holds no Active IdentityVerification, the caller's
  //   tickets for the event plus the count exceed the per-account limit, the
  //   caller holds tickets of another SeatType for the event, or the caller
  //   already has an entry in the sale for the stock's event.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc AuthorizeCard(AuthorizeCardRequest) returns (AuthorizeCardResponse);

  // Confirm makes the caller's PENDING Order and Entered entry from their card
  // authorization, after checking that it is Authorized, in yen, for the
  // stock's seat type price times its ticket count, on an accepted card (every
  // brand except American Express), that the sale's end time has not passed
  // and that the application still fits the event. Confirming a card
  // authorization that already made an entry returns that entry. A card
  // authorization Confirm rejects is released at once, so the fan is not
  // charged. No money is captured at entry.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The caller has no stored account.
  // - INVALID_ARGUMENT: The card_authorization_id is missing or malformed, or
  //   the card authorization's amount does not match its ticket count; it is
  //   released.
  // - PERMISSION_DENIED: The card authorization does not exist, is not for a
  //   lottery entry or is another fan's. Non-revealing.
  // - FAILED_PRECONDITION: The card authorization is not Authorized (card
  //   authentication not completed, or already captured or released); or it
  //   is rejected and released: the card is American Express, the caller
  //   already has another entry in the sale for the stock's event, the
  //   application no longer fits the event, the sale's end time has passed,
  //   or the TicketStock no longer exists.
  // - UNAVAILABLE: Card payments are temporarily unavailable.
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);

  // ListByTicketType returns the caller's entries in a LOTTERY sale, at most
  // one for each event the sale names, with their Orders, so the fan sees
  // which stock and count they entered and, after the draw, whether they won.
  // A caller who never entered gets an empty list.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - NOT_FOUND: The sale does not exist, or the caller has no stored
  //   account.
  // - INVALID_ARGUMENT: The ticket_sale_id is missing or malformed.
  rpc ListByTicketType(ListByTicketTypeRequest) returns (ListByTicketTypeResponse);
}

// AuthorizeCardRequest carries the sale, the stock, the count and the 本人確認
// details.
message AuthorizeCardRequest {
  // Required. The LOTTERY sale to enter.
  entity.v1.TicketSaleId ticket_sale_id = 7 [(buf.validate.field).required = true];

  // Required. The TicketStock to enter for, a stock of an event the sale
  // names.
  entity.v1.TicketStockId ticket_stock_id = 8 [(buf.validate.field).required = true];

  // Required. The tickets requested for the companion group, allocated
  // all-or-nothing: at least 1 and at most the event's per-account limit
  // (never above 10).
  int32 ticket_count = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Required. The caller's real full name, saved on the caller's account.
  entity.v1.FullName full_name = 2 [(buf.validate.field).required = true];

  // Required. The caller's phone number in E.164 form, saved on the caller's
  // account.
  entity.v1.PhoneNumber phone_number = 3 [(buf.validate.field).required = true];

  // Optional. The referral code of the link the fan came from. It is kept on
  // the Order Confirm makes; a malformed code fails with INVALID_ARGUMENT.
  // Absent for an entry without a code.
  optional entity.v1.ReferralCode referral_code = 6;

  // Field 1 was the Draft entry the card authorization was opened for; there
  // is no Draft any more. Field 4 was the TicketType to enter, replaced by
  // ticket_sale_id and ticket_stock_id.
  reserved 1, 4;
  reserved "lottery_entry_id", "ticket_type_id";
}

// AuthorizeCardResponse returns the card authorization for the browser to
// authenticate.
message AuthorizeCardResponse {
  // The card authorization opened; Confirm names it.
  entity.v1.CardAuthorizationId card_authorization_id = 3 [(buf.validate.field).required = true];

  // The card authorization secret, which the browser confirms with the payment
  // provider's payment form (3D Secure). Short-lived; never stored by the
  // client or the server.
  entity.v1.CardAuthorizationSecret card_authorization_secret = 2 [(buf.validate.field).required = true];

  // Field 1 was the secret as a bare string under the provider's own name,
  // replaced by card_authorization_secret.
  reserved 1;
  reserved "client_secret";
}

// ConfirmRequest names the card authorization to make the entry from.
message ConfirmRequest {
  // Required. The caller's card authorization from AuthorizeCard.
  entity.v1.CardAuthorizationId card_authorization_id = 2 [(buf.validate.field).required = true];

  // Field 1 was the Draft entry to confirm; there is no Draft any more.
  reserved 1;
  reserved "lottery_entry_id";
}

// ConfirmResponse returns the entry and its Order.
message ConfirmResponse {
  // The entry, Entered.
  entity.v1.LotteryEntry lottery_entry = 1 [(buf.validate.field).required = true];

  // The entry's PENDING Order: its stock, ticket count and amount.
  entity.v1.Order order = 2 [(buf.validate.field).required = true];
}

// ListByTicketTypeRequest names the sale whose entries to list. The method
// keeps its former name until the rename that follows this change.
message ListByTicketTypeRequest {
  // Required. The LOTTERY sale whose entries of the caller to list.
  entity.v1.TicketSaleId ticket_sale_id = 2 [(buf.validate.field).required = true];

  // Field 1 was the TicketType whose entries to list, replaced by
  // ticket_sale_id.
  reserved 1;
  reserved "ticket_type_id";
}

// ListByTicketTypeResponse returns the caller's entries in the sale.
message ListByTicketTypeResponse {
  // The caller's entries in the sale, at most one for each event the sale
  // names. Empty when the caller never entered.
  repeated entity.v1.LotteryEntry lottery_entries = 1;

  // The entries' Orders, one for each entry above, with the stock and ticket
  // count each entry is for.
  repeated entity.v1.Order orders = 2;
}
