syntax = "proto3";

// Package liverty_music.rpc.admin.artist.v1 provides the admin-only
// ArtistService for reading artists from the developer admin console. It is
// served by the admin Connect server behind the admin-role gate.
package liverty_music.rpc.admin.artist.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/organizer.proto";

// ArtistService is the admin surface over Artists for the calls only the admin
// console offers. The browsing and search calls the admin console shares with
// the fan app stay on liverty_music.rpc.artist.v1.ArtistService, reached
// through the admin server with the same admin-role gate.
//
// All RPCs are authorized only for the admin organization; callers outside it
// are rejected with PERMISSION_DENIED at the admin server boundary.
service ArtistService {
  // Create registers an artist under the name and MBID an admin gives, such
  // as a test artist with a generated MBID. The artist takes the music
  // catalog's name for the MBID when the catalog knows it, and its MBID is
  // Verified, since the admin names it. When the MBID is already registered,
  // the registered Artist is returned unchanged.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The name is missing or empty, or the MBID is not a UUID.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Get returns one Artist by its id.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Artist id is missing or malformed.
  // - NOT_FOUND: No Artist has the id.
  rpc Get(GetRequest) returns (GetResponse);

  // ListByOrganizer returns the Artists an Organizer currently represents,
  // whatever the Organizer's status, so the admin console can inspect its
  // roster. Empty when it represents none (or its associations were freed by
  // deactivation).
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  rpc ListByOrganizer(ListByOrganizerRequest) returns (ListByOrganizerResponse);

  // ListByMbidStatus returns the Artists in one MBID status, the one
  // registered first listed first, so the admin console can show the
  // Ambiguous Artists waiting for an admin to choose their MBID.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The MBID status is missing or unspecified.
  rpc ListByMbidStatus(ListByMbidStatusRequest) returns (ListByMbidStatusResponse);

  // CorrectMbid gives an Artist the MBID an admin chose, keeping its id and
  // followers. The music catalog is read first: the Artist takes the MBID the
  // catalog returns for the given one (a merged MBID is redirected to its
  // canonical MBID) with the catalog's name and activity status, and becomes
  // Verified. A changed MBID clears the Artist's images and official site. On
  // failure the Artist is unchanged.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Artist id or the MBID is missing or malformed.
  // - NOT_FOUND: No Artist has the id, or the music catalog does not know the
  //   MBID.
  // - ALREADY_EXISTS: Another Artist has the MBID.
  // - UNAVAILABLE: The music catalog could not be reached.
  rpc CorrectMbid(CorrectMbidRequest) returns (CorrectMbidResponse);
}

// CreateRequest names the artist to register.
message CreateRequest {
  // Required. The name of the artist to register.
  entity.v1.ArtistName name = 1 [(buf.validate.field).required = true];

  // Required. The artist's MBID in the music catalog.
  entity.v1.Mbid mbid = 2 [(buf.validate.field).required = true];
}

// CreateResponse returns the registered Artist.
message CreateResponse {
  // The registered Artist: the new one, or the one already registered under
  // the MBID.
  entity.v1.Artist artist = 1 [(buf.validate.field).required = true];
}

// GetRequest names the Artist to read.
message GetRequest {
  // Required. The Artist to return.
  entity.v1.ArtistId artist_id = 1 [(buf.validate.field).required = true];
}

// GetResponse returns the Artist.
message GetResponse {
  // The requested Artist.
  entity.v1.Artist artist = 1 [(buf.validate.field).required = true];
}

// ListByOrganizerRequest identifies the Organizer whose represented Artists to
// list.
message ListByOrganizerRequest {
  // Required. The Organizer whose represented artists to return.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// ListByOrganizerResponse contains the Artists the Organizer currently
// represents.
message ListByOrganizerResponse {
  // The artists represented by the Organizer. Empty when it represents none.
  repeated entity.v1.Artist artists = 1;
}

// ListByMbidStatusRequest names the MBID status whose Artists to list.
message ListByMbidStatusRequest {
  // Required. The MBID status to list; UNSPECIFIED is rejected.
  entity.v1.ArtistMbidStatus mbid_status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// ListByMbidStatusResponse contains the Artists in the requested MBID status.
message ListByMbidStatusResponse {
  // The Artists, the one registered first listed first. Empty when none is in
  // the status.
  repeated entity.v1.Artist artists = 1;
}

// CorrectMbidRequest names the Artist to correct and the MBID an admin chose.
message CorrectMbidRequest {
  // Required. The Artist whose MBID to correct.
  entity.v1.ArtistId artist_id = 1 [(buf.validate.field).required = true];

  // Required. The MBID the admin chose, usually one of the namesakes
  // liverty_music.rpc.admin.catalog_artist.v1.CatalogArtistService.ListByArtist
  // returned.
  entity.v1.Mbid mbid = 2 [(buf.validate.field).required = true];
}

// CorrectMbidResponse returns the corrected Artist.
message CorrectMbidResponse {
  // The Artist with its new MBID and the catalog's name.
  entity.v1.Artist artist = 1 [(buf.validate.field).required = true];
}
