syntax = "proto3";

// Package liverty_music.rpc.admin.settlement.v1 provides the admin-only
// SettlementService for internal tooling exposed through the developer admin
// console.
package liverty_music.rpc.admin.settlement.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/settlement.proto";

// SettlementService is the admin-only, read-only observability surface over
// Order payouts (Settlements). It is authorized solely for the admin organization
// and never reachable by the consumer product.
//
// Releasing funds is deliberately NOT an RPC here: the Organizer payout is created
// by an INTERNAL SCHEDULED platform job only after the event's occurrence AND a
// dispute-safety window (gated on the event's current start time), never a manual
// admin action — mirroring the lottery draw-job precedent and the admin
// OrderService. The refund/clawback entry point is ⑤'s
// liverty_music.rpc.admin.order.v1.OrderService.Refund, and one Order's
// Settlement is read with that service's Get. This service only lists
// settlement state for support and reconciliation.
service SettlementService {
  // List returns Settlements filtered by payout status, so the admin
  // console can review held / released / reversed payouts. The list is unbounded on
  // the wire: pagination is deferred to a later phase.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The status filter is malformed.
  // - UNAUTHENTICATED: The request lacks valid admin credentials.
  rpc List(ListRequest) returns (ListResponse);
}

// ListRequest filters Settlements by payout status.
message ListRequest {
  // Optional. When set to a concrete status, returns only Settlements in that
  // status; UNSPECIFIED (the default) returns all statuses.
  entity.v1.SettlementStatus status_filter = 1 [(buf.validate.field).enum.defined_only = true];
}

// ListResponse contains the matching Settlements.
message ListResponse {
  // The Settlements matching the status filter.
  repeated entity.v1.Settlement settlements = 1;
}
