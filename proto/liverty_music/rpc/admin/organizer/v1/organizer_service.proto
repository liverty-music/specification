syntax = "proto3";

// Package liverty_music.rpc.admin.organizer.v1 provides the admin-only
// OrganizerService for managing Organizers from the developer admin console.
// It is served by the admin Connect server behind the admin-role gate; the
// organizer-facing surface lives separately in liverty_music.rpc.organizer.v1.
package liverty_music.rpc.admin.organizer.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/organizer.proto";
import "liverty_music/entity/v1/user.proto";

// OrganizerService is the admin surface for managing Organizers — the vetted
// businesses that represent artists. It creates an Organizer (provisioning its
// own Organization at the identity provider with an `owner` identity for the
// owner email), manages the Organizer↔Artist association (each artist is represented by at most one
// Organizer), lists Organizers for the admin console, records an Organizer's
// 特商法 business details and its platform fee rate at vetting, deactivates an
// Organizer as a minimal off-switch, and permanently deletes a deactivated
// Organizer. An Organizer is returned with its id, name, short name, legal name,
// representative name, business address, business phone number, contact email
// and platform fee rate. The artists an Organizer represents are listed by
// liverty_music.rpc.admin.artist.v1.ArtistService.ListByOrganizer, not here.
//
// All RPCs are authorized only for the admin organization; callers outside it
// are rejected with PERMISSION_DENIED at the admin server boundary.
service OrganizerService {
  // Create registers a new Organizer with a display name, a short name and an
  // owner email, then provisions its Organization at the identity provider,
  // named by the short name (passkey-primary sign-in policy, organizer-console
  // project grant), and adds the owner's identity to it with the `owner` role.
  // The owner identity has the user name `<owner email> (<short name>)` and the
  // owner email, which may also be the email of a fan account or of an identity
  // in another Organizer's Organization; the owner signs in by typing the
  // email. It is created without a password and receives a
  // passkey-registration link from the identity provider. Provisioning is
  // idempotent and compensating: retrying a Create that failed partway never
  // creates a duplicate Organizer or Organization and never leaves the
  // Organizer without its `owner` identity.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The name is empty or too long, the short name is
  //   missing or malformed, or the owner email is malformed or longer than 165
  //   characters.
  // - ALREADY_EXISTS: Another Organizer already has the short name.
  rpc Create(CreateRequest) returns (CreateResponse);

  // AssociateArtist links an existing Artist to an Organizer. There is no
  // create-on-demand: an unknown ArtistId is rejected. Each Artist is
  // represented by at most one Organizer, so an already-claimed Artist is
  // rejected; reassignment is DisassociateArtist followed by AssociateArtist.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id or artist id is missing or malformed.
  // - NOT_FOUND: The Organizer or the artist does not exist.
  // - ALREADY_EXISTS: The artist is already represented by an Organizer.
  rpc AssociateArtist(AssociateArtistRequest) returns (AssociateArtistResponse);

  // DisassociateArtist removes the link between an Artist and its Organizer,
  // freeing the Artist to be associated with another Organizer. It is
  // idempotent: disassociating an artist that is not associated succeeds.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id or artist id is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  rpc DisassociateArtist(DisassociateArtistRequest) returns (DisassociateArtistResponse);

  // List returns every Organizer so the admin console can render the
  // organizer-management screen. The artists an Organizer represents are
  // retrieved separately via
  // liverty_music.rpc.admin.artist.v1.ArtistService.ListByOrganizer.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  rpc List(ListRequest) returns (ListResponse);

  // Get returns a single Organizer by id, including a deactivated one.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  rpc Get(GetRequest) returns (GetResponse);

  // Deactivate turns an Organizer off: the backend thereafter rejects all
  // operations targeting it, the identities in its Organization are deactivated
  // at the identity provider, and its
  // artist associations are freed so the artists can be re-associated. Full
  // teardown of the Organization and grants is out of scope. It is idempotent:
  // deactivating an already-deactivated Organizer succeeds.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  rpc Deactivate(DeactivateRequest) returns (DeactivateResponse);

  // Delete permanently removes a deactivated Organizer together with everything
  // kept for it: its first-party Series with their ticket sales and ticket
  // types, and their Events (with their lottery entries, checkouts, ticket
  // journeys, performers and scanner records), the Orders, Tickets and
  // reversed settlements for those Events, its series images and their files,
  // its Organization at the identity provider with its identities, its artist
  // associations and its PayoutAccount record. Records in the payment provider
  // are kept.
  //
  // Nothing is removed when the Organizer is not deactivated, when any of its
  // Events has an Order that is not refunded or a settlement that is not
  // reversed, or when the Organizer has a payout account. Files and the
  // Organization are removed before the database records and an already
  // removed file or Organization counts as removed, so a call that failed
  // partway is completed by calling Delete again.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  // - FAILED_PRECONDITION: The Organizer is not deactivated, or an unrefunded
  //   order, an unreversed settlement or a payout account blocks deletion.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // SetBusinessDetails records an Organizer's 特商法 (Specified Commercial
  // Transactions Act) business details — legal name, representative name,
  // business address, business phone number and contact email — checked by an
  // admin during vetting. The five details are replaced together. An
  // Organizer's events can go on sale only once its business details are
  // complete.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed, or any of the
  //   business details is missing or malformed.
  // - NOT_FOUND: The Organizer does not exist.
  // - FAILED_PRECONDITION: The Organizer is deactivated.
  rpc SetBusinessDetails(SetBusinessDetailsRequest) returns (SetBusinessDetailsResponse);

  // SetPlatformFeeRate sets the platform fee rate applied to an Organizer's
  // future Orders, for example a pilot rate. Orders already issued keep the
  // rate of their Settlement.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The Organizer id is missing or malformed, or the rate is
  //   missing or outside 0 to 3000 basis points.
  // - NOT_FOUND: The Organizer does not exist.
  rpc SetPlatformFeeRate(SetPlatformFeeRateRequest) returns (SetPlatformFeeRateResponse);
}

// CreateRequest carries the new Organizer's name, short name and owner email.
message CreateRequest {
  // Required. The display name of the Organizer to create.
  entity.v1.OrganizerName name = 1 [(buf.validate.field).required = true];

  // Required. The email of the person who owns the Organizer. Their identity
  // is given the `owner` role and sent a passkey-registration link from the
  // identity provider.
  entity.v1.Email owner_email = 2 [(buf.validate.field).required = true];

  // Required. The Organizer's short name, unique and never changed. It names
  // the Organizer's Organization at the identity provider and the organizer
  // console's sign-in address.
  entity.v1.OrganizerShortName short_name = 3 [(buf.validate.field).required = true];
}

// CreateResponse returns the newly created Organizer.
message CreateResponse {
  // The created Organizer.
  entity.v1.Organizer organizer = 1 [(buf.validate.field).required = true];
}

// AssociateArtistRequest identifies the Organizer and the existing Artist to
// link.
message AssociateArtistRequest {
  // Required. The Organizer that will represent the artist.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];

  // Required. The existing artist to associate. Unknown ids are rejected with
  // NOT_FOUND (no create-on-demand).
  entity.v1.ArtistId artist_id = 2 [(buf.validate.field).required = true];
}

// AssociateArtistResponse is returned upon a successful association.
message AssociateArtistResponse {}

// DisassociateArtistRequest identifies the Organizer and the Artist to unlink.
message DisassociateArtistRequest {
  // Required. The Organizer to unlink the artist from.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];

  // Required. The artist to disassociate.
  entity.v1.ArtistId artist_id = 2 [(buf.validate.field).required = true];
}

// DisassociateArtistResponse is returned upon a successful disassociation
// (including the idempotent case where the artist was not associated).
message DisassociateArtistResponse {}

// ListRequest retrieves every Organizer. It takes no parameters.
message ListRequest {}

// ListResponse contains every Organizer.
message ListResponse {
  // The Organizers, in catalog order.
  repeated entity.v1.Organizer organizers = 1;
}

// GetRequest identifies the Organizer to retrieve.
message GetRequest {
  // Required. The unique identifier of the Organizer to retrieve.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// GetResponse returns the requested Organizer.
message GetResponse {
  // The requested Organizer.
  entity.v1.Organizer organizer = 1 [(buf.validate.field).required = true];
}

// DeactivateRequest identifies the Organizer to deactivate.
message DeactivateRequest {
  // Required. The unique identifier of the Organizer to deactivate.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// DeactivateResponse is returned upon a successful deactivation (including the
// idempotent case where the Organizer was already deactivated).
message DeactivateResponse {}

// DeleteRequest identifies the deactivated Organizer to delete.
message DeleteRequest {
  // Required. The unique identifier of the Organizer to delete.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// DeleteResponse is returned once the Organizer and everything kept for it
// have been removed.
message DeleteResponse {}

// SetBusinessDetailsRequest identifies the Organizer and carries its five
// business details, replacing any recorded before.
message SetBusinessDetailsRequest {
  // Required. The Organizer whose business details to record.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];

  // Required. The legal name of the business, shown in the 特商法 disclosure.
  entity.v1.LegalName legal_name = 2 [(buf.validate.field).required = true];

  // Required. The name of the business's representative.
  entity.v1.RepresentativeName representative_name = 3 [(buf.validate.field).required = true];

  // Required. The business address.
  entity.v1.BusinessAddress business_address = 4 [(buf.validate.field).required = true];

  // Required. The business phone number, in E.164 form.
  entity.v1.PhoneNumber business_phone_number = 5 [(buf.validate.field).required = true];

  // Required. The email address fans contact the business at.
  entity.v1.Email contact_email = 6 [(buf.validate.field).required = true];
}

// SetBusinessDetailsResponse returns the Organizer with its new business
// details.
message SetBusinessDetailsResponse {
  // The Organizer with its business details.
  entity.v1.Organizer organizer = 1 [(buf.validate.field).required = true];
}

// SetPlatformFeeRateRequest identifies the Organizer and carries its new rate.
message SetPlatformFeeRateRequest {
  // Required. The Organizer whose rate to set.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];

  // Required. The platform fee rate in basis points (hundredths of a percent):
  // 0 to 3000, i.e. 0% to 30%. For example 500 is 5%. 0 is a valid rate, so the
  // field tracks presence and an omitted rate is rejected.
  optional int32 platform_fee_rate_bps = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 3000
    }
  ];
}

// SetPlatformFeeRateResponse returns the Organizer with its new rate.
message SetPlatformFeeRateResponse {
  // The Organizer with its platform fee rate.
  entity.v1.Organizer organizer = 1 [(buf.validate.field).required = true];
}
