syntax = "proto3";

// Package liverty_music.rpc.admin.v1 provides admin-only gRPC service definitions
// for internal tooling exposed through the developer admin console.
//
// These services are authorized solely for the admin organization and are never
// reachable by the consumer product. The first capability is concert management:
// reviewing AI-discovered concerts before they are published to fans, and
// managing the published catalog thereafter.
package liverty_music.rpc.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert.proto";
import "liverty_music/entity/v1/coordinates.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/staged_concert.proto";
import "liverty_music/entity/v1/venue.proto";

// ConcertService is the admin-side counterpart to the consumer
// liverty_music.rpc.concert.v1.ConcertService: it manages concerts across their
// full lifecycle for internal developers. The proto package (admin.v1) conveys
// the admin audience, so the service name carries no role qualifier and the two
// ConcertService definitions are distinguished by package alone.
//
// Discovered concerts are held in a staging queue in a pending state. A developer
// approves a concert to publish it (and trigger the new-concert notification) or
// rejects it to drop it. Rejection is not permanent: a later discovery run may
// re-surface the same concert for re-review, and every rejection is recorded for
// search-quality analysis. Once published, a concert can be listed and, if it was
// approved in error, deleted.
//
// All RPCs are authorized only for the admin organization; callers outside it are
// rejected with PERMISSION_DENIED at the admin server boundary.
service ConcertService {
  // List returns every published concert, with no follower or proximity
  // filtering, so an operator can review the full catalog and act on it. Each
  // concert carries its event id (for deletion) and performing artists (for
  // client-side grouping).
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  rpc List(ListRequest) returns (ListResponse);

  // ListPending returns every concert currently awaiting review, including the
  // resolved-venue preview so the reviewer can judge venue accuracy.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);

  // Approve publishes a pending concert to fans and emits the new-concert
  // notification. The operation is idempotent: approving a staged concert that no
  // longer exists succeeds without creating a duplicate.
  //
  // Approve is two-phase for duplicate events. When the staged concert maps onto
  // an already-published event at the same resolved (venue, date, start time) and
  // the request's `resolution` is unset, the response carries a
  // `DuplicateConflict` (the existing event's display fields plus the staged
  // preview) and NO state is mutated; the reviewer then re-invokes Approve with a
  // `resolution` of `RESOLUTION_KEEP_EXISTING` or `RESOLUTION_ADOPT_STAGED`. A
  // non-duplicate approval publishes normally regardless of the `resolution`
  // value.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The staged concert id is missing or malformed.
  rpc Approve(ApproveRequest) returns (ApproveResponse);

  // Reject drops a pending concert and records the rejection (with reason) for
  // search-quality analysis. The operation is idempotent: rejecting a staged
  // concert that no longer exists succeeds.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The staged concert id is missing, or the reason is empty.
  rpc Reject(RejectRequest) returns (RejectResponse);

  // Delete permanently removes a published concert by its event id. The deletion
  // cascades through the database's referential integrity to every row that
  // references the event (performers, tickets, ticket journeys, ticket emails,
  // merkle tree nodes, and the series' sales phases). It is unconditional: it is
  // NOT blocked by dependent rows such as minted tickets or fan ticket journeys.
  // The operation is idempotent: deleting an event that no longer exists succeeds.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The event id is missing or malformed.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// ResolvedVenue is the venue preview produced by resolving the raw scraped venue
// name against Google Places at staging time. It is shown alongside the raw
// listed venue name so the reviewer can spot venue mis-resolution. No persisted
// Venue (and therefore no VenueId) exists yet — the venue row is created only on
// approval — so this is a dedicated review DTO rather than entity.v1.Venue.
message ResolvedVenue {
  // The canonical venue name as resolved by Google Places.
  entity.v1.VenueName name = 1;

  // The administrative area (ISO 3166-2) of the resolved venue, when determinable.
  entity.v1.AdminArea admin_area = 2;

  // The Google Places place id of the resolved venue, used as the stable venue
  // identity for staging-level deduplication. Absent when the venue did not
  // resolve.
  entity.v1.PlaceId place_id = 3;

  // The geographic coordinates of the resolved venue, when available.
  entity.v1.Coordinates coordinates = 4;
}

// PendingConcert is one concert awaiting developer review in the approval queue.
// It carries the raw scraped fields together with the resolved-venue preview so a
// reviewer has everything needed to judge accuracy without a follow-up fetch.
message PendingConcert {
  // The unique identifier of this staged concert, used to approve or reject it.
  entity.v1.StagedConcertId staged_id = 1 [(buf.validate.field).required = true];

  // The performing artist this concert was discovered for.
  entity.v1.Artist performer = 2 [(buf.validate.field).required = true];

  // The descriptive title extracted for the concert (e.g., the tour or show name).
  entity.v1.Title title = 3 [(buf.validate.field).required = true];

  // The scheduled calendar date of the concert in the venue's local timezone.
  entity.v1.LocalDate local_date = 4 [(buf.validate.field).required = true];

  // The scheduled start time. Optional; omitted when the source did not state one.
  entity.v1.StartTime start_time = 5;

  // The raw venue name exactly as scraped from the source, preserved for review.
  entity.v1.ListedVenueName listed_venue_name = 6 [(buf.validate.field).required = true];

  // The resolved-venue preview. Absent when the raw venue name could not be
  // resolved against Google Places.
  ResolvedVenue resolved_venue = 7;

  // The source URL where the concert was found.
  entity.v1.Url source_url = 8;

  // The time at which the discovery pipeline staged this concert.
  google.protobuf.Timestamp discovered_time = 9 [(buf.validate.field).required = true];
}

// ListRequest is the request for retrieving all published concerts. It takes no
// parameters; the full published catalog is returned.
message ListRequest {}

// ListResponse contains the published concerts. Each concert carries its event id
// and performing artists; the admin console groups by artist client-side.
message ListResponse {
  // The published concerts, in catalog order.
  repeated entity.v1.Concert concerts = 1;
}

// ListPendingRequest is the request for retrieving all concerts awaiting review.
// It takes no parameters; the full pending queue is returned.
message ListPendingRequest {}

// ListPendingResponse contains the concerts currently awaiting review.
message ListPendingResponse {
  // The concerts currently in the approval queue, in discovery order.
  repeated PendingConcert pending_concerts = 1;
}

// Resolution selects how Approve reconciles a staged concert that duplicates an
// already-published event. It is only consulted when a duplicate is detected; a
// non-duplicate approval ignores it.
enum Resolution {
  // Default: no reconciliation choice. On a duplicate, Approve returns a
  // DuplicateConflict without mutating state; otherwise it publishes normally.
  RESOLUTION_UNSPECIFIED = 0;

  // Keep the existing event unchanged: record the staged row in the rejection log
  // with a duplicate reason (attributed to the calling reviewer) and clear it from
  // the queue.
  RESOLUTION_KEEP_EXISTING = 1;

  // Adopt the staged row's display representation: overwrite the existing event's
  // listed venue name and fill its start/open time only where currently unset,
  // leaving venue identity (venue_id, place_id) and the shared series title
  // untouched, then clear the staged row.
  RESOLUTION_ADOPT_STAGED = 2;
}

// ExistingEvent is the display-field preview of an already-published event that a
// staged concert collides with. It carries only what the reviewer needs to choose
// a resolution; venue identity is intentionally omitted because reconciliation
// never changes it.
message ExistingEvent {
  // The unique identifier of the already-published event.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];

  // The descriptive title of the existing event (from its shared series).
  entity.v1.Title title = 2 [(buf.validate.field).required = true];

  // The venue name currently stored on the existing event (its display field,
  // the one ADOPT_STAGED would overwrite).
  entity.v1.ListedVenueName listed_venue_name = 3 [(buf.validate.field).required = true];

  // The local calendar date of the existing event.
  entity.v1.LocalDate local_date = 4 [(buf.validate.field).required = true];

  // The existing event's start time. Absent when the stored start time is unknown.
  entity.v1.StartTime start_time = 5;

  // The existing event's door-open time. Absent when the stored open time is unknown.
  entity.v1.OpenTime open_time = 6;
}

// DuplicateConflict describes a staged concert that maps onto an already-published
// event, offering the reviewer both records so they can choose a resolution.
message DuplicateConflict {
  // The already-published event the staged concert collides with.
  ExistingEvent existing = 1 [(buf.validate.field).required = true];

  // The staged concert the reviewer proposed to publish.
  PendingConcert staged = 2 [(buf.validate.field).required = true];
}

// ApproveRequest identifies the staged concert to publish and, on a second pass,
// how to reconcile a detected duplicate.
message ApproveRequest {
  // Required. The unique identifier of the staged concert to approve.
  entity.v1.StagedConcertId staged_id = 1 [(buf.validate.field).required = true];

  // Optional. How to reconcile a duplicate existing event. Left unset on the first
  // call; set to a concrete choice when re-invoking after a DuplicateConflict.
  Resolution resolution = 2 [(buf.validate.field).enum.defined_only = true];
}

// ApproveResponse is returned upon successful approval, or carries a
// DuplicateConflict when the first pass detected an unresolved duplicate.
message ApproveResponse {
  // Set only when the staged concert duplicates an existing event and the request
  // carried `RESOLUTION_UNSPECIFIED`; in that case no state was mutated and the
  // reviewer must re-invoke Approve with a resolution. Absent on a successful
  // approval or reconciliation.
  DuplicateConflict conflict = 1;
}

// RejectRequest identifies the staged concert to drop and the reason why.
message RejectRequest {
  // Required. The unique identifier of the staged concert to reject.
  entity.v1.StagedConcertId staged_id = 1 [(buf.validate.field).required = true];

  // Required. The reviewer's reason for rejecting the concert, recorded in the
  // rejection log for search-quality analysis.
  string reason = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// RejectResponse is returned upon successful rejection.
message RejectResponse {}

// DeleteRequest identifies the published concert to delete by its event id.
message DeleteRequest {
  // Required. The unique identifier of the published event to delete. The
  // deletion cascades to all rows referencing this event.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// DeleteResponse is returned upon successful deletion (including the idempotent
// case where the event was already absent).
message DeleteResponse {}
