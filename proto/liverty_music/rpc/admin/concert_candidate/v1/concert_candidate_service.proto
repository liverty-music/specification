syntax = "proto3";

// Package liverty_music.rpc.admin.concert_candidate.v1 provides the admin-only
// ConcertCandidateService for internal tooling exposed through the developer
// admin console: reviewing ConcertCandidates, the discovered performances held
// for review before they are published to fans.
// It is authorized solely for the admin organization and never reachable by the
// consumer product.
package liverty_music.rpc.admin.concert_candidate.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert_candidate.proto";
import "liverty_music/entity/v1/coordinates.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/venue.proto";

// ConcertCandidateService reviews the ConcertCandidates the discovery pipeline
// holds for review: performances whose venue could not be resolved or that
// collide with an Event already in the catalog. A developer approves a
// ConcertCandidate to publish it (and trigger the new-concert notification) or
// rejects it to drop it. Rejection is not permanent: a later discovery run may
// re-surface the same concert for re-review, and every rejection is recorded
// for search-quality analysis. Approve and Reject record the calling admin as
// the reviewer. Published concerts are managed by
// liverty_music.rpc.admin.concert.v1.ConcertService.
//
// All RPCs require a signed-in caller holding the admin role: a caller who is
// not signed in is rejected with UNAUTHENTICATED, and one outside the admin
// organization with PERMISSION_DENIED, before any usecase runs.
service ConcertCandidateService {
  // List returns every ConcertCandidate currently awaiting review, including the
  // resolved-venue preview so the reviewer can judge venue accuracy.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  rpc List(ListRequest) returns (ListResponse);

  // Approve publishes a pending concert to fans and emits the new-concert
  // notification. The operation is idempotent: approving a ConcertCandidate that
  // no longer exists succeeds without creating a duplicate.
  //
  // Approve is two-phase for duplicate events. When the ConcertCandidate maps
  // onto an already-published event at the same resolved (venue, date, start
  // time) and the request's `resolution` is unset, the response carries a
  // `DuplicateConflict` (the existing event's display fields plus the
  // ConcertCandidate) and NO state is mutated; the reviewer then re-invokes
  // Approve with a `resolution` of `RESOLUTION_KEEP_EXISTING` or
  // `RESOLUTION_ADOPT_STAGED`. A non-duplicate approval publishes normally
  // regardless of the `resolution` value.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The concert_candidate_id is missing or malformed.
  rpc Approve(ApproveRequest) returns (ApproveResponse);

  // Reject drops a pending concert and records the rejection (with reason) for
  // search-quality analysis. The operation is idempotent: rejecting a
  // ConcertCandidate that no longer exists succeeds.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The concert_candidate_id is missing, or the reason is
  //   empty.
  rpc Reject(RejectRequest) returns (RejectResponse);
}

// ResolvedVenue is the venue preview produced by resolving the raw scraped
// venue name against the map catalog when the candidate was held for review. It
// is shown alongside the raw listed venue name so the reviewer can spot venue
// mis-resolution. No persisted Venue (and therefore no VenueId) exists yet —
// the venue row is created only on approval — so this is a dedicated review DTO
// rather than entity.v1.Venue.
message ResolvedVenue {
  // The canonical venue name as resolved by the map catalog.
  entity.v1.VenueName name = 1;

  // The administrative area (ISO 3166-2) of the resolved venue, when
  // determinable.
  entity.v1.AdminArea admin_area = 2;

  // The map place id of the resolved venue, used as the stable venue identity
  // for deduplicating candidates. Absent when the venue did not
  // resolve.
  entity.v1.PlaceId place_id = 3;

  // The geographic coordinates of the resolved venue, when available.
  entity.v1.Coordinates coordinates = 4;
}

// ConcertCandidate is one discovered performance awaiting developer review. It
// carries the raw scraped fields together with the resolved-venue preview so a
// reviewer has everything needed to judge accuracy without a follow-up fetch.
message ConcertCandidate {
  // The unique identifier of this ConcertCandidate, used to approve or reject
  // it.
  entity.v1.ConcertCandidateId id = 11 [(buf.validate.field).required = true];

  // The performing artist this concert was discovered for.
  entity.v1.Artist performer = 2 [(buf.validate.field).required = true];

  // The descriptive title extracted for the concert (e.g., the tour or show
  // name).
  entity.v1.Title title = 3 [(buf.validate.field).required = true];

  // The scheduled calendar date of the concert in the venue's local timezone.
  entity.v1.LocalDate local_date = 4 [(buf.validate.field).required = true];

  // The scheduled start time. Optional; omitted when the source did not state
  // one.
  entity.v1.StartTime start_time = 5;

  // The raw venue name exactly as scraped from the source, preserved for review.
  entity.v1.ListedVenueName listed_venue_name = 6 [(buf.validate.field).required = true];

  // The resolved-venue preview. Absent when the raw venue name could not be
  // resolved against the map catalog.
  ResolvedVenue resolved_venue = 7;

  // The source URL where the concert was found.
  entity.v1.Url source_url = 8;

  // The time at which the discovery pipeline first held this candidate for
  // review.
  google.protobuf.Timestamp discovered_time = 9 [(buf.validate.field).required = true];

  // The scheduled door-open time. Optional; omitted when the source did not
  // state one.
  entity.v1.OpenTime open_time = 10;

  // Field 1 was the id under its former name, replaced by id.
  reserved 1;
  reserved "staged_id";
}

// ListRequest is the request for retrieving all ConcertCandidates awaiting
// review. It takes no parameters; every pending candidate is returned.
message ListRequest {}

// ListResponse contains the ConcertCandidates currently awaiting review.
message ListResponse {
  // The ConcertCandidates currently awaiting review, in discovery order.
  repeated ConcertCandidate concert_candidates = 2;

  // Field 1 was the list under its former name, replaced by
  // concert_candidates.
  reserved 1;
  reserved "pending_concerts";
}

// Resolution selects how Approve reconciles a ConcertCandidate that duplicates an
// already-published event. It is only consulted when a duplicate is detected; a
// non-duplicate approval ignores it.
enum Resolution {
  // Default: no reconciliation choice. On a duplicate, Approve returns a
  // DuplicateConflict without mutating state; otherwise it publishes normally.
  RESOLUTION_UNSPECIFIED = 0;

  // Keep the existing event unchanged: record the ConcertCandidate as a
  // RejectedConcert with a duplicate reason (attributed to the calling reviewer)
  // and drop it.
  RESOLUTION_KEEP_EXISTING = 1;

  // Adopt the ConcertCandidate's display representation: overwrite the existing
  // event's listed venue name and fill its start/open time only where currently
  // unset, leaving venue identity (venue_id, place_id) and the shared series
  // title untouched, then drop the ConcertCandidate.
  RESOLUTION_ADOPT_STAGED = 2;
}

// ExistingEvent is the display-field preview of an already-published event that
// a ConcertCandidate collides with. It carries only what the reviewer needs to
// choose a resolution; venue identity is intentionally omitted because
// reconciliation never changes it.
message ExistingEvent {
  // The unique identifier of the already-published event.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];

  // The descriptive title of the existing event (from its shared series).
  entity.v1.Title title = 2 [(buf.validate.field).required = true];

  // The venue name currently stored on the existing event (its display field,
  // the one ADOPT_STAGED would overwrite).
  entity.v1.ListedVenueName listed_venue_name = 3 [(buf.validate.field).required = true];

  // The local calendar date of the existing event.
  entity.v1.LocalDate local_date = 4 [(buf.validate.field).required = true];

  // The existing event's start time. Absent when the stored start time is
  // unknown.
  entity.v1.StartTime start_time = 5;

  // The existing event's door-open time. Absent when the stored open time is
  // unknown.
  entity.v1.OpenTime open_time = 6;
}

// DuplicateConflict describes a ConcertCandidate that maps onto an
// already-published event, offering the reviewer both records so they can
// choose a resolution.
message DuplicateConflict {
  // The already-published event the ConcertCandidate collides with.
  ExistingEvent existing = 1 [(buf.validate.field).required = true];

  // The ConcertCandidate the reviewer proposed to publish.
  ConcertCandidate concert_candidate = 3 [(buf.validate.field).required = true];

  // Field 2 was the candidate under its former name, replaced by
  // concert_candidate.
  reserved 2;
  reserved "staged";
}

// ApproveRequest identifies the ConcertCandidate to publish and, on a second
// pass, how to reconcile a detected duplicate.
message ApproveRequest {
  // Required. The ConcertCandidate to approve.
  entity.v1.ConcertCandidateId concert_candidate_id = 3 [(buf.validate.field).required = true];

  // Optional. How to reconcile a duplicate existing event. Left unset on the
  // first call; set to a concrete choice when re-invoking after a
  // DuplicateConflict.
  Resolution resolution = 2 [(buf.validate.field).enum.defined_only = true];

  // Field 1 was the candidate id under its former name, replaced by
  // concert_candidate_id.
  reserved 1;
  reserved "staged_id";
}

// ApproveResponse is returned upon successful approval, or carries a
// DuplicateConflict when the first pass detected an unresolved duplicate.
message ApproveResponse {
  // Set only when the ConcertCandidate duplicates an existing event and the
  // request carried `RESOLUTION_UNSPECIFIED`; in that case no state was mutated
  // and the reviewer must re-invoke Approve with a resolution. Absent on a
  // successful approval or reconciliation.
  DuplicateConflict conflict = 1;
}

// RejectRequest identifies the ConcertCandidate to drop and the reason why.
message RejectRequest {
  // Required. The ConcertCandidate to reject.
  entity.v1.ConcertCandidateId concert_candidate_id = 3 [(buf.validate.field).required = true];

  // Required. The reviewer's reason for rejecting the concert, recorded in the
  // RejectedConcert for search-quality analysis.
  string reason = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Field 1 was the candidate id under its former name, replaced by
  // concert_candidate_id.
  reserved 1;
  reserved "staged_id";
}

// RejectResponse is returned upon successful rejection.
message RejectResponse {}
