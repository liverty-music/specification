syntax = "proto3";

// Package liverty_music.rpc.admin.order.v1 provides the admin-only
// OrderService for internal tooling exposed through the developer admin
// console.
package liverty_music.rpc.admin.order.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/order.proto";
import "liverty_music/entity/v1/settlement.proto";

// OrderService is the admin-only operations surface over ⑤'s Orders: reading
// an Order with its payout record, and the refund / dispute-clawback path. It
// is authorized solely for the admin organization and never reachable by the
// consumer product: a caller who is not signed in fails with UNAUTHENTICATED,
// and a signed-in caller without the admin role fails with PERMISSION_DENIED,
// before anything is read.
//
// The Organizer PAYOUT is deliberately NOT an RPC here: fans' payments stay with
// the platform and the Organizer's net share is paid out to its PayoutAccount
// by an INTERNAL SCHEDULED platform job only after the
// event's occurrence AND a dispute-safety window (gated on the event's current
// start time) — it is never a manual admin/organizer action, mirroring the
// lottery draw-job precedent.
service OrderService {
  // Get returns one Order together with its Settlement and the Settlement's
  // splits, for support and reconciliation, or the Order alone when it has no
  // Settlement yet; an Order without a Settlement is not an error.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The order_id is missing or malformed.
  // - NOT_FOUND: No such Order.
  // - PERMISSION_DENIED: The caller lacks the admin role.
  // - UNAUTHENTICATED: The request lacks valid admin credentials.
  rpc Get(GetRequest) returns (GetResponse);

  // ListByEvent returns every Order whose Tickets admit to the Event, in any
  // status and oldest pay time first, including Orders from an official resale
  // purchase. It lets an admin see and refund the purchases of a cancelled
  // Event. An Event with no Order, and an id no Event has, yield an empty list.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The event_id is missing or malformed.
  // - PERMISSION_DENIED: The caller lacks the admin role.
  // - UNAUTHENTICATED: The request lacks valid admin credentials.
  rpc ListByEvent(ListByEventRequest) returns (ListByEventResponse);

  // Refund refunds the Order's user the face value + system/発券
  // fee (retaining the payment-processor fee, the JP norm) with a payment
  // provider refund, and claws back the Organizer's payout. It covers event
  // cancellation (中止) and dispute/chargeback handling (see RefundReason). A
  // postponed show is handled as a cancellation followed by a new event. It is
  // idempotent: a replay records the refund once (no double-refund). On a
  // cancellation while the ticket is listed for ⑦ resale, the listing is
  // cancelled and this path refunds the ticket's user (the resale fresh-sale leg does
  // not run).
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The Order is not refundable in its current state
  //   (e.g. not paid), or the reason is CANCELLATION and the Order's Event is
  //   not CANCELLED. No money moves in either case.
  // - INVALID_ARGUMENT: The order_id is missing/malformed or the reason is
  //   UNSPECIFIED.
  // - NOT_FOUND: No such Order.
  // - UNAUTHENTICATED: The request lacks valid admin credentials.
  rpc Refund(RefundRequest) returns (RefundResponse);
}

// RefundReason classifies why an Order is being refunded — it selects the refund
// policy and the operational audit trail. New values may be appended; existing
// values must not be renumbered.
enum RefundReason {
  // Value 2 was previously REFUND_REASON_POSTPONEMENT_WINDOW, a postponement
  // (延期) refund window that was never built. Reserved to prevent accidental reuse.
  reserved 2;
  reserved "REFUND_REASON_POSTPONEMENT_WINDOW";

  // Default value, rejected at the boundary.
  REFUND_REASON_UNSPECIFIED = 0;

  // Event cancellation (中止): the Order's user is refunded face + system/発券 fee and
  // the Organizer's share is clawed back. Any live ⑦ resale listing is cancelled.
  // Accepted only when the Order's Event is CANCELLED.
  REFUND_REASON_CANCELLATION = 1;

  // A chargeback / dispute: the captured payment is reversed and the Organizer's
  // payout clawed back.
  REFUND_REASON_DISPUTE = 3;
}

// GetRequest names the Order to read.
message GetRequest {
  // Required. The Order to read.
  entity.v1.OrderId order_id = 1 [(buf.validate.field).required = true];
}

// GetResponse returns the Order with its payout record.
message GetResponse {
  // The requested Order.
  entity.v1.Order order = 1 [(buf.validate.field).required = true];

  // The Order's Settlement with its splits. Unset when the Order has no
  // Settlement.
  entity.v1.Settlement settlement = 2;
}

// ListByEventRequest names the Event whose Orders to list.
message ListByEventRequest {
  // Required. The Event whose Orders to list.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// ListByEventResponse contains the Event's Orders.
message ListByEventResponse {
  // The Event's Orders, in any status, oldest pay time first.
  repeated entity.v1.Order orders = 1;
}

// RefundRequest identifies the Order to refund and why.
message RefundRequest {
  // Required. The Order to refund. Its tickets are voided and its user is
  // refunded per the reason's policy.
  entity.v1.OrderId order_id = 1 [(buf.validate.field).required = true];

  // Required. Why the Order is being refunded — selects the refund policy.
  RefundReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RefundResponse returns the refunded Order.
message RefundResponse {
  // The Order after the refund, with status `refunded`.
  entity.v1.Order order = 1 [(buf.validate.field).required = true];
}
