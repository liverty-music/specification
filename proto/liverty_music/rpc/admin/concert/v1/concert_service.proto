syntax = "proto3";

// Package liverty_music.rpc.admin.concert.v1 provides the admin-only
// ConcertService for internal tooling exposed through the developer admin
// console: managing the published concert catalog. Reviewing ConcertCandidates
// before they are published lives in
// liverty_music.rpc.admin.concert_candidate.v1.ConcertCandidateService. It is
// authorized solely for the admin organization and never reachable by the
// consumer product.
package liverty_music.rpc.admin.concert.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/series.proto";

// ConcertService is the admin-side counterpart to the consumer
// liverty_music.rpc.concert.v1.ConcertService: it manages published concerts
// for internal developers. The proto package (admin.concert.v1) conveys the
// admin audience, so the service name carries no role qualifier and the two
// ConcertService definitions are distinguished by package alone.
//
// A published concert can be listed and, if it was approved in error, deleted.
// The review of discovered concerts before publication is on
// liverty_music.rpc.admin.concert_candidate.v1.ConcertCandidateService.
//
// All RPCs require a signed-in caller holding the admin role: a caller who is
// not signed in is rejected with UNAUTHENTICATED, and one outside the admin
// organization with PERMISSION_DENIED, before any usecase runs.
service ConcertService {
  // List returns every published concert, with no follower or proximity
  // filtering, so an admin can review the full catalog and act on it. Each
  // concert carries its event id (for deletion) and the ids of its performing
  // artists (for client-side grouping); the response carries each referenced
  // Series and Artist once.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  rpc List(ListRequest) returns (ListResponse);

  // Delete permanently removes a published concert by its event id. The deletion
  // cascades through the database's referential integrity to every row that
  // references the event (performers, ticket journeys, ticket emails, and the
  // event's ticket types). It is unconditional: it is NOT blocked by dependent
  // rows such as fan ticket journeys.
  // The operation is idempotent: deleting an event that no longer exists succeeds.
  //
  // Possible errors:
  // - UNAUTHENTICATED: The request carries no valid sign-in.
  // - PERMISSION_DENIED: The caller is not a member of the admin organization.
  // - INVALID_ARGUMENT: The event id is missing or malformed.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// ListRequest is the request for retrieving all published concerts. It takes no
// parameters; the full published catalog is returned.
message ListRequest {}

// ListResponse contains the published concerts. Each concert carries its event id
// and the ids of its performing artists; the admin console groups by artist
// client-side.
message ListResponse {
  // The published concerts, in catalog order.
  repeated entity.v1.Concert concerts = 1;

  // Every Series the concerts refer to, once each, in the order the concerts
  // first refer to them. A Series carries the same fields as on the fan
  // ConcertService and never its share token.
  repeated entity.v1.Series series = 2;

  // Every Artist the concerts refer to, once each, in the order the concerts
  // first refer to them.
  repeated entity.v1.Artist artists = 3;
}

// DeleteRequest identifies the published concert to delete by its event id.
message DeleteRequest {
  // Required. The unique identifier of the published event to delete. The
  // deletion cascades to all rows referencing this event.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// DeleteResponse is returned upon successful deletion (including the idempotent
// case where the event was already absent).
message DeleteResponse {}
