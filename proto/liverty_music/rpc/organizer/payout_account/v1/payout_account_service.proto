syntax = "proto3";

// Package liverty_music.rpc.organizer.payout_account.v1 provides the
// organizer-facing PayoutAccountService that a member uses from the organizer
// console; the Organizer identity surface lives in
// liverty_music.rpc.organizer.v1.
package liverty_music.rpc.organizer.payout_account.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/payout_account.proto";

// PayoutAccountService is the organizer-facing surface for the Organizer's
// PayoutAccount: an authenticated member reads its Organizer's account at the
// payment provider and its payout onboarding status, and starts the payment
// provider's onboarding. The caller's Organizer is resolved from the token
// (org-scoped from the role claim; failures that would concern another org
// never reveal whether such an Organizer exists), mirroring the organizer
// OrganizerService.
service PayoutAccountService {
  // Get returns the caller's own PayoutAccount and its payout onboarding
  // status. It only reads: it never opens an account at the payment provider
  // and never creates an onboarding URL. Onboarding status never blocks ticket
  // sale or issuance; only the payout waits until the account is active.
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated. Because
  //   this is the caller's own org, the state is not concealed.
  // - NOT_FOUND: The caller's Organizer has no PayoutAccount yet; call
  //   StartOnboarding to open one.
  // - PERMISSION_DENIED: The token carries no organizer-console role, its audience
  //   lacks the organizer-console project id, or its login-scope org and role-claim
  //   org disagree, or the caller's Organizer is no longer found. The response
  //   never reveals whether such an Organizer exists.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Get(GetRequest) returns (GetResponse);

  // StartOnboarding opens the caller's Organizer's PayoutAccount at the payment
  // provider when it has none (stored pending, with the owner's email as
  // contact) and returns a fresh single-use URL to the provider-hosted
  // onboarding page. Every call returns a new URL, whatever the account's
  // status. The provider brings the member back to the organizer console when
  // they finish or when the URL has expired.
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated. Because
  //   this is the caller's own org, the state is not concealed.
  // - PERMISSION_DENIED: The token carries no organizer-console role, its audience
  //   lacks the organizer-console project id, or its login-scope org and role-claim
  //   org disagree, or the caller's Organizer is no longer found. The response
  //   never reveals whether such an Organizer exists.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  // - UNAVAILABLE: The payment provider cannot be reached. An account opened
  //   before the failure stays stored, so a later call returns a URL for it.
  rpc StartOnboarding(StartOnboardingRequest) returns (StartOnboardingResponse);
}

// GetRequest is empty: the caller's Organizer, and its PayoutAccount, are
// resolved from the authenticated token.
message GetRequest {}

// GetResponse returns the caller's PayoutAccount.
message GetResponse {
  // The caller's PayoutAccount and its payout onboarding status.
  entity.v1.PayoutAccount payout_account = 3 [(buf.validate.field).required = true];

  // Field 1 was the account under its former name and type, replaced by
  // payout_account. Field 2 was the onboarding URL, now returned by
  // StartOnboarding.
  reserved 1, 2;
  reserved "account", "onboarding_url";
}

// StartOnboardingRequest is empty: the caller's Organizer, and its
// PayoutAccount, are resolved from the authenticated token.
message StartOnboardingRequest {}

// StartOnboardingResponse returns the URL of the payment provider's onboarding
// page for the caller's PayoutAccount.
message StartOnboardingResponse {
  // The provider-hosted onboarding page the client opens. Single use and valid
  // for a short time; call StartOnboarding again for a new one.
  entity.v1.Url onboarding_url = 1 [(buf.validate.field).required = true];
}
