syntax = "proto3";

// Package liverty_music.rpc.organizer.series.v1 provides the organizer-facing
// SeriesService, the authoring surface an organizer uses to create and
// publish first-party series for the artists it represents. It is served by
// the dedicated organizer Connect server behind org-scoped role-claim
// authorization; the admin-facing catalog management lives separately in
// liverty_music.rpc.admin.concert.v1.ConcertService.
package liverty_music.rpc.organizer.series.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/series.proto";
import "liverty_music/entity/v1/series_image.proto";
import "liverty_music/entity/v1/venue.proto";

// SeriesService is the organizer-facing authoring surface: an authenticated
// operator creates a first-party Series as an informational event page,
// edits it, publishes its dates to fans, corrects it after publish, and
// cancels dates. A Series is a single show, a multi-day run, or a tour with
// one or more dates; times live on each date, so a 2部制 day is two dates
// under one Series.
//
// Each date is an Event with its own publish state: DRAFT, PUBLISHED or
// CANCELLED (entity.v1.Event.publish_state). A new date starts DRAFT, and a
// published Series can gain new DRAFT dates and publish them on their own.
// The Series stores no state of its own; its publish_state is derived from
// its Events.
//
// Create, Update, Publish and List return each Series together with every
// one of its dates, DRAFT ones included, as Concerts and, once each, every
// Artist those Concerts refer to. A Concert carries only the id of its Series
// (through its Event), its Event's publish state, and the ids of its Artists.
//
// The caller's Organizer is resolved from the token (the identity provider
// organization the token is scoped to), so requests never carry an
// organizer_id; a series is addressed by its SeriesId. An organizer may author
// only for artists it represents (the same represented-artists set returned by
// liverty_music.rpc.organizer.artist.v1.ArtistService.List). Authorization is
// org-scoped from the token's role claim, and failures that would concern
// another org's series never reveal whether such a series exists.
//
// Publishing dates of a PUBLIC series announces only the newly published
// Events to the followers of each performer; DRAFT dates and UNLISTED series
// never announce. UNLISTED series are reachable only through a signed
// tokenized share URL and are excluded from discovery, lists, and
// notifications.
service SeriesService {
  // Create authors a new first-party series whose Events are all DRAFT: it
  // mints a Series (title, type, visibility, optional description) with its
  // performers and one or more DRAFT Events (venue, date, optional start/open
  // times). Nothing is announced to fans — a draft is visible only in the
  // organizer console until Publish. The venue of each event is the Venue
  // holding the event's picked place id, or a new Venue created from the map
  // catalog's place.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed (including an
  //   event without a picked place id), the event list is empty, a time is
  //   inconsistent (e.g. open time after start time, or a date in the past),
  //   or the map catalog has no place with a given place id.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role, or a
  //   requested performer is not among the artists the caller's Organizer
  //   represents. Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAVAILABLE: The map catalog could not be reached to read a new place.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Update edits an existing series. The whole authoring payload is supplied
  // and replaces the prior content, together or not at all. Each EventDraft
  // with an event_id edits that Event of the series; one without it adds a new
  // DRAFT Event; a DRAFT Event that is left out is removed. Nothing is
  // announced, whether the series is a draft or has PUBLISHED Events.
  //
  // While every Event is DRAFT, any authored field may change. Once the series
  // has a PUBLISHED or CANCELLED Event, Update is a correction: the title,
  // description, performers and each PUBLISHED Event's open time may change,
  // and a PUBLISHED Event's start time may be set or changed while no
  // TicketSale offers it. A new start time takes its slot again: a discovered
  // Event at that slot is merged into the PUBLISHED Event, which keeps its id.
  //
  // Each new or DRAFT event's venue is found or created from its picked place
  // id exactly as in Create. The date of a PUBLISHED or CANCELLED Event is not
  // checked against the current day.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed (including an
  //   event without a picked place id), a time is inconsistent (e.g. open time
  //   after start time, or a new or DRAFT event dated in the past), or the map
  //   catalog has no place with a given place id.
  // - PERMISSION_DENIED: The series does not exist or is not owned by the
  //   caller's Organizer, or a requested performer is not represented.
  //   Non-revealing.
  // - FAILED_PRECONDITION: Nothing changes when
  //   - a PUBLISHED or CANCELLED Event of the series is left out (a published
  //     date is cancelled, not removed);
  //   - a given event_id is not an Event of the series;
  //   - a PUBLISHED Event's venue or date differs from the stored one;
  //   - a CANCELLED Event differs from the stored one in any value;
  //   - the series has a PUBLISHED or CANCELLED Event and the type, source page
  //     or visibility differs from the stored one;
  //   - a PUBLISHED Event's start time changes while a TicketSale offers it;
  //   - a PUBLISHED Event's new start time lands on a suppressed slot or on an
  //     Event of another first-party series.
  // - UNAVAILABLE: The map catalog could not be reached to read a new place.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Publish publishes the named DRAFT Events of a series, or every DRAFT
  // Event when none is named. A published series can publish a new date the
  // same way; its other Events are unchanged. For a PUBLIC series each
  // performer's followers are told about the newly published Events only;
  // UNLISTED series announce nothing. An UNLISTED series gets a signed share
  // token on its first publish and keeps it afterwards.
  //
  // At each Event's venue, date and start time, a discovered Event (or an
  // Event of another series of the same Organizer) is claimed: it joins this
  // series as PUBLISHED, kept by id with the fans tracking it, the DRAFT Event
  // is removed, and the claimed Event is not announced. A pending
  // ConcertCandidate of the series is dropped.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series does not exist or is not owned by the
  //   caller's Organizer. Non-revealing.
  // - FAILED_PRECONDITION: Nothing is published when
  //   - the title is blank, there is no performer, or an Event to publish has
  //     no venue or no date;
  //   - a named Event is not a DRAFT Event of the series;
  //   - no Event is named and the series has no DRAFT Event;
  //   - an Event's slot is suppressed, is held by another Organizer's Event
  //     (routed to admin reconciliation rather than taken over), or is held by
  //     a CANCELLED Event.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Cancel cancels the named Events of a series, or every PUBLISHED and DRAFT
  // Event when none is named, together or not at all. A PUBLISHED Event
  // becomes CANCELLED: it is dropped from fan lists, keeps its event page with
  // a cancellation banner, and never changes again. A DRAFT Event is removed,
  // never cancelled. A series left with no Event is removed. A
  // CONCERT.cancelled event carrying the ids of the Events that became
  // CANCELLED is emitted; none is emitted when only drafts were removed.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series does not exist or is not owned by the
  //   caller's Organizer. Non-revealing.
  // - FAILED_PRECONDITION: Nothing changes when a named Event is not an Event
  //   of the series or is already CANCELLED, or when no Event is named and the
  //   series has no PUBLISHED or DRAFT Event.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // SetCoverImage sets a previously uploaded SeriesImage as the cover image
  // of a series the caller owns and enqueues asynchronous processing. It
  // records the image and publishes an event carrying { series_image_id,
  // series_id }; an off-service consumer then validates and processes the
  // original into the served variants, atomically re-points the series to the
  // new cover once the variants exist, and reclaims any previous image.
  // Because the consumer owns that cut-over, SetCoverImage does not itself
  // re-point the series or return the image, and the image is not yet
  // servable when it returns. It is idempotent per series_image_id; a later
  // SetCoverImage for the same series replaces the cover without a serving
  // gap.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed.
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetCoverImage(SetCoverImageRequest) returns (SetCoverImageResponse);

  // RegenerateShareUrl issues a fresh signed share token for an UNLISTED series,
  // invalidating the previous share URL, and returns the new URL. It applies
  // only to UNLISTED series.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The series is not UNLISTED, so it has no share token.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc RegenerateShareUrl(RegenerateShareUrlRequest) returns (RegenerateShareUrlResponse);

  // List returns the series authored by the caller's own Organizer, both
  // drafts and published, so the console can render the authoring dashboard.
  // The Organizer is resolved from the token; the list is unbounded on the
  // wire because an organizer's own catalog is small.
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role.
  //   Non-revealing.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc List(ListRequest) returns (ListResponse);
}

// EventDraft is one performance being authored under a series: its calendar
// date, optional start and open times, its venue and, for an Event that
// already exists, its id. The venue is the map place the operator picked from
// liverty_music.rpc.organizer.venue.v1.VenueService.Search; a typed name alone
// is never saved.
message EventDraft {
  // Required. The venue name as the operator saw it for the picked place, kept
  // as the event's listed venue name.
  entity.v1.VenueName venue_name = 1 [(buf.validate.field).required = true];

  // Required. The place id of the candidate the operator picked from
  // VenueService.Search; the operator never types it. The Venue holding this
  // place id is used, or a new Venue is created from the map catalog's place
  // (name, coordinates and admin area). There is no resolution by name.
  entity.v1.PlaceId place_id = 2 [(buf.validate.field).required = true];

  // Required. The calendar date of this performance in the venue's local
  // timezone.
  entity.v1.LocalDate local_date = 3 [(buf.validate.field).required = true];

  // Optional. The scheduled start time; omitted when not yet confirmed.
  entity.v1.StartTime start_time = 4;

  // Optional. The door-open time; omitted when not yet announced.
  entity.v1.OpenTime open_time = 5;

  // Optional. The Event of the series this entry edits, as returned in a
  // Concert's event. Omitted for a new date, which is added as a DRAFT Event.
  entity.v1.EventId event_id = 6;
}

// SeriesDraft is the authoring payload for a first-party series, shared by
// Create and Update. It carries the series-level metadata, the performers, and
// the events being authored. The cover image and unlisted share token are
// managed out of band (the SeriesImageService.CreateUploadUrl/SetCoverImage
// flow and the publish/RegenerateShareUrl flow), so they are not part of this
// payload.
message SeriesDraft {
  // Required. The title shared by every event in the series.
  entity.v1.Title title = 1 [(buf.validate.field).required = true];

  // Required. The classification of the series (single, tour, or festival).
  // The unspecified zero value is rejected at the boundary.
  entity.v1.SeriesType type = 2 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // Required. Who can reach the series once published (PUBLIC or UNLISTED).
  // The unspecified zero value is rejected at the boundary.
  entity.v1.Visibility visibility = 3 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // Optional. The free-form body text shown on the series page.
  entity.v1.Description description = 4;

  // Optional. The official source URL for series-level information.
  entity.v1.Url source_url = 5;

  // Required. The performing artists, each of which MUST be among the artists
  // the caller's Organizer represents. At least one performer is required.
  repeated entity.v1.ArtistId artist_ids = 6 [(buf.validate.field).repeated.min_items = 1];

  // Required. The events (performances) under this series. At least one event
  // is required.
  repeated EventDraft events = 7 [(buf.validate.field).repeated.min_items = 1];
}

// CreateRequest carries the authoring payload for a new draft series.
message CreateRequest {
  // Required. The series to author. Its Events are created DRAFT.
  SeriesDraft draft = 1 [(buf.validate.field).required = true];
}

// CreateResponse returns the newly-created draft series with its dates.
message CreateResponse {
  // The created series, whose derived publish state is DRAFT, including its
  // authoring fields (description, cover image, visibility, publish state,
  // organizer id).
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// UpdateRequest identifies the series to edit and supplies the full authoring
// payload that replaces its prior content.
message UpdateRequest {
  // Required. The series to edit. It MUST be owned by the caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The authoring payload that replaces the series' prior content.
  SeriesDraft draft = 2 [(buf.validate.field).required = true];
}

// UpdateResponse returns the updated series with its dates.
message UpdateResponse {
  // The updated series, including its authoring fields.
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// PublishRequest identifies the series to publish and, optionally, which of
// its DRAFT Events.
message PublishRequest {
  option (buf.validate.message).cel = {
    id: "publish_request.distinct_events"
    message: "event_ids must not repeat an event"
    expression: "this.event_ids.map(e, e.value).unique()"
  };

  // Required. The series to publish. It MUST be owned by the caller's
  // Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Optional. The DRAFT Events of the series to publish. Empty publishes every
  // DRAFT Event of the series.
  repeated entity.v1.EventId event_ids = 2;
}

// PublishResponse returns the series with its dates after the publish.
message PublishResponse {
  // The series, including its authoring fields.
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// CancelRequest identifies the series to cancel and, optionally, which of its
// Events.
message CancelRequest {
  option (buf.validate.message).cel = {
    id: "cancel_request.distinct_events"
    message: "event_ids must not repeat an event"
    expression: "this.event_ids.map(e, e.value).unique()"
  };

  // Required. The series to cancel. It MUST be owned by the caller's
  // Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Optional. The PUBLISHED or DRAFT Events of the series to cancel. Empty
  // cancels every PUBLISHED and DRAFT Event of the series.
  repeated entity.v1.EventId event_ids = 2;
}

// CancelResponse is returned upon successful cancellation.
message CancelResponse {}

// SetCoverImageRequest names the series and the uploaded SeriesImage to set as
// its cover image.
message SetCoverImageRequest {
  // Required. The series whose cover image is set. It MUST be owned by the
  // caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The SeriesImage minted by
  // liverty_music.rpc.organizer.series_image.v1.SeriesImageService.CreateUploadUrl
  // and uploaded by the client.
  entity.v1.SeriesImageId series_image_id = 2 [(buf.validate.field).required = true];
}

// SetCoverImageResponse is empty: the image is not yet processed or servable
// when SetCoverImage returns, so there is nothing meaningful to return. The
// console shows an optimistic local preview until the processed variants
// become available.
message SetCoverImageResponse {}

// RegenerateShareUrlRequest identifies the UNLISTED series whose share token is
// being rotated.
message RegenerateShareUrlRequest {
  // Required. The UNLISTED series to rotate the share token for. It MUST be
  // owned by the caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];
}

// RegenerateShareUrlResponse returns the new signed share URL; the previous URL
// is invalidated.
message RegenerateShareUrlResponse {
  // The new signed share URL for the UNLISTED series.
  entity.v1.Url share_url = 1 [(buf.validate.field).required = true];
}

// ListRequest is empty: the caller's Organizer is resolved from the token, and
// the full own catalog (drafts and published) is returned.
message ListRequest {}

// ListResponse contains the series authored by the caller's Organizer with
// their dates.
message ListResponse {
  // The series authored by the caller's Organizer, drafts and published,
  // including their authoring fields.
  repeated entity.v1.Series series = 1;

  // The dates of every listed series, as Concerts. A Concert's series is the
  // one its event's series_id names; within a series they are in date order.
  repeated entity.v1.Concert concerts = 2;

  // Every Artist the concerts refer to, once each, in the order the concerts
  // first refer to them.
  repeated entity.v1.Artist artists = 3;
}
