syntax = "proto3";

// Package liverty_music.rpc.organizer.series.v1 provides the organizer-facing
// SeriesService, the authoring surface an organizer uses to create and
// publish first-party series for the artists it represents. It is served by
// the dedicated organizer Connect server behind org-scoped role-claim
// authorization; the admin-facing catalog management lives separately in
// liverty_music.rpc.admin.concert.v1.ConcertService.
package liverty_music.rpc.organizer.series.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/concert.proto";
import "liverty_music/entity/v1/entity.proto";
import "liverty_music/entity/v1/media.proto";
import "liverty_music/entity/v1/series.proto";
import "liverty_music/entity/v1/venue.proto";

// SeriesService is the organizer-facing authoring surface: an authenticated
// operator creates a first-party Series as an informational event page,
// edits it while it is a draft, publishes it to fans, and manages its
// lifecycle thereafter. A Series is a single show, a multi-day run, or a tour
// with one or more dates; times live on each date, so a 2部制 day is two dates
// under one Series.
//
// Create, Update, Publish and List return each Series together with its dates
// as Concerts and, once each, every Artist those Concerts refer to. A Concert
// carries only the id of its Series (through its Event) and the ids of its
// Artists. A DRAFT Series' dates are returned as Concerts whose event id is
// the draft date's id and whose artist ids are the Series' draft performers.
//
// The caller's Organizer is resolved from the token (the Zitadel org the token
// is scoped to), so requests never carry an organizer_id; a series is
// addressed by its SeriesId. An organizer may author only for artists it
// represents (the same represented-artists set returned by
// liverty_music.rpc.organizer.v1.OrganizerService.ListArtists). Authorization is org-scoped from the token's
// role claim, and failures that would concern another org's series never
// reveal whether such a series exists.
//
// Publishing a PUBLIC series emits exactly one CONCERT.created per series
// (carrying the newly-published event ids), which drives the existing follower
// push; DRAFT and UNLISTED series never emit. UNLISTED series are reachable
// only through a signed tokenized share URL and are excluded from discovery,
// lists, and notifications.
service SeriesService {
  // Create authors a new first-party series in the DRAFT state: it mints a
  // Series (title, type, visibility, optional description) with its
  // performers and one or more Events (venue, date, optional start/open
  // times). Nothing is announced to fans — a draft is visible only in the
  // organizer console until Publish. The venue of each event is the Venue
  // holding the event's picked place id, or a new Venue created from the map
  // catalog's place.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed (including an
  //   event without a picked place id), the event list is empty, a time is
  //   inconsistent (e.g. open time after start time, or a date in the past),
  //   or the map catalog has no place with a given place id.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role, or a
  //   requested performer is not among the artists the caller's Organizer
  //   represents. Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAVAILABLE: The map catalog could not be reached to read a new place.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Update edits an existing series. While the series is a DRAFT this may
  // change any authored field, add events, or change performers. Once
  // PUBLISHED it is a correction: it revises the page in place and does NOT
  // re-notify followers. The whole authoring payload is supplied and replaces
  // the prior draft content.
  //
  // Each event's venue is found or created from its picked place id exactly as
  // in Create.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed (including an
  //   event without a picked place id), a time is inconsistent, or the map
  //   catalog has no place with a given place id.
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer, or
  //   a requested performer is not represented. Non-revealing.
  // - FAILED_PRECONDITION: The series has been CANCELLED (terminal).
  // - UNAVAILABLE: The map catalog could not be reached to read a new place.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Publish transitions a DRAFT series to PUBLISHED. For a PUBLIC series this
  // emits exactly one CONCERT.created carrying the newly-published event ids,
  // which notifies followers; publishing a further event under an
  // already-published series emits once for only the new event id(s). UNLISTED
  // series publish without emitting. On publish the natural-key upsert
  // supersedes any matching discovered slot: a pending staged concert is
  // dropped and an already-published discovered event is claimed (re-pointed to
  // this series, kept by id, marked organizer-owned) without re-notifying.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The series is already PUBLISHED with no new events,
  //   is CANCELLED, or a target (venue, date, start time) slot is suppressed or
  //   owned by a different organizer — the latter is routed to admin
  //   reconciliation rather than taken over.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Cancel marks a series CANCELLED. This is terminal: the series is dropped
  // from every fan surface and cannot be re-published. A CONCERT.cancelled
  // event is emitted so downstream consumers and caches can drop it.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The series is already CANCELLED.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // CreateMediaUploadURL authorizes a direct-to-storage upload: it mints a new
  // MediaId and returns a short-lived signed URL the client PUTs the original
  // image bytes to, without the bytes ever passing through this service. The
  // authorization is scoped to the caller's Organizer and to a fixed content
  // type and maximum byte size; it does not reference a series yet, so ownership
  // of the target series is enforced later by AttachMedia. The client MUST send
  // the same Content-Type it declared here and a body within max_bytes; the
  // storage upload itself rejects a mismatching or over-size object.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The content type is not an accepted image type.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc CreateMediaUploadURL(CreateMediaUploadURLRequest) returns (CreateMediaUploadURLResponse);

  // AttachMedia records a previously uploaded media object as belonging to a
  // series the caller owns and enqueues asynchronous processing. It records the
  // media and publishes a MEDIA.uploaded event carrying { media_id, series_id };
  // an off-service consumer then validates and processes the original into
  // responsive WebP variants, atomically re-points the series to the new media
  // once the variants exist, and reclaims any previous image. Because the
  // consumer owns that cut-over, AttachMedia does not itself re-point the series
  // or return the media, and the image is not yet servable when it returns.
  // Attaching is idempotent per media_id; a subsequent AttachMedia for the same
  // series replaces the image without a serving gap.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: A required field is missing or malformed.
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc AttachMedia(AttachMediaRequest) returns (AttachMediaResponse);

  // RegenerateToken issues a fresh signed share token for an UNLISTED series,
  // invalidating the previous share URL, and returns the new URL. It applies
  // only to UNLISTED series.
  //
  // Possible errors:
  // - PERMISSION_DENIED: The series is not owned by the caller's Organizer.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The series is not UNLISTED, so it has no share token.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc RegenerateToken(RegenerateTokenRequest) returns (RegenerateTokenResponse);

  // List returns the series authored by the caller's own Organizer, both
  // drafts and published, so the console can render the authoring dashboard.
  // The Organizer is resolved from the token; the list is unbounded on the
  // wire because an organizer's own catalog is small.
  //
  // Possible errors:
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role.
  //   Non-revealing.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc List(ListRequest) returns (ListResponse);

  // SearchVenues looks up a venue name in the map catalog while an operator
  // authors a series, and returns up to 5 candidate places, best match first,
  // with places in Japan ranked first. The operator picks one and its place id
  // goes into EventDraft.place_id. Nothing is stored: a Venue is matched or
  // created only when a series is saved with the picked place.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The text is shorter than 2 or longer than 100
  //   characters after trimming spaces.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role, or no
  //   Organizer is linked to the caller's tenant or it is provisioning.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAVAILABLE: The map catalog could not be reached.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SearchVenues(SearchVenuesRequest) returns (SearchVenuesResponse);
}

// EventDraft is one performance being authored under a series: its calendar
// date, optional start and open times, and its venue. The venue is the map
// place the operator picked from SearchVenues; a typed name alone is never
// saved.
message EventDraft {
  // Required. The venue name as the operator saw it for the picked place, kept
  // as the event's listed venue name.
  entity.v1.VenueName venue_name = 1 [(buf.validate.field).required = true];

  // Required. The place id of the candidate the operator picked from
  // SearchVenues; the operator never types it. The Venue holding this place id
  // is used, or a new Venue is created from the map catalog's place (name,
  // coordinates and admin area). There is no resolution by name.
  entity.v1.PlaceId place_id = 2 [(buf.validate.field).required = true];

  // Required. The calendar date of this performance in the venue's local
  // timezone.
  entity.v1.LocalDate local_date = 3 [(buf.validate.field).required = true];

  // Optional. The scheduled start time; omitted when not yet confirmed.
  entity.v1.StartTime start_time = 4;

  // Optional. The door-open time; omitted when not yet announced.
  entity.v1.OpenTime open_time = 5;
}

// SeriesDraft is the authoring payload for a first-party series, shared by
// Create and Update. It carries the series-level metadata, the performers, and
// the events being authored. The image and unlisted share token are managed
// out of band (the CreateMediaUploadURL/AttachMedia flow and the
// publish/RegenerateToken flow), so they are not part of this payload.
message SeriesDraft {
  // Required. The title shared by every event in the series.
  entity.v1.Title title = 1 [(buf.validate.field).required = true];

  // Required. The classification of the series (single, tour, or festival).
  // The unspecified zero value is rejected at the boundary.
  entity.v1.SeriesType type = 2 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // Required. Who can reach the series once published (PUBLIC or UNLISTED).
  // The unspecified zero value is rejected at the boundary.
  entity.v1.Visibility visibility = 3 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // Optional. The free-form body text shown on the series page.
  entity.v1.Description description = 4;

  // Optional. The official source URL for series-level information.
  entity.v1.Url source_url = 5;

  // Required. The performing artists, each of which MUST be among the artists
  // the caller's Organizer represents. At least one performer is required.
  repeated entity.v1.ArtistId artist_ids = 6 [(buf.validate.field).repeated.min_items = 1];

  // Required. The events (performances) under this series. At least one event
  // is required.
  repeated EventDraft events = 7 [(buf.validate.field).repeated.min_items = 1];
}

// CreateRequest carries the authoring payload for a new draft series.
message CreateRequest {
  // Required. The series to author. It is created in the DRAFT state.
  SeriesDraft draft = 1 [(buf.validate.field).required = true];
}

// CreateResponse returns the newly-created draft series with its dates.
message CreateResponse {
  // The created series, in the DRAFT state, including its authoring fields
  // (description, cover image, visibility, publish state, organizer id).
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// UpdateRequest identifies the series to edit and supplies the full authoring
// payload that replaces its prior content.
message UpdateRequest {
  // Required. The series to edit. It MUST be owned by the caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The authoring payload that replaces the series' prior content.
  SeriesDraft draft = 2 [(buf.validate.field).required = true];
}

// UpdateResponse returns the updated series with its dates.
message UpdateResponse {
  // The updated series, including its authoring fields.
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// PublishRequest identifies the series to publish.
message PublishRequest {
  // Required. The series to publish. It MUST be owned by the caller's
  // Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];
}

// PublishResponse returns the published series with its dates.
message PublishResponse {
  // The published series, including its authoring fields.
  entity.v1.Series series = 1 [(buf.validate.field).required = true];

  // The dates of the series, as Concerts in date order. Always contains at
  // least one Concert.
  repeated entity.v1.Concert concerts = 2 [(buf.validate.field).repeated.min_items = 1];

  // Every Artist the concerts refer to, once each, in display order.
  repeated entity.v1.Artist artists = 3 [(buf.validate.field).repeated.min_items = 1];
}

// CancelRequest identifies the series to cancel.
message CancelRequest {
  // Required. The series to cancel. It MUST be owned by the caller's
  // Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];
}

// CancelResponse is returned upon successful cancellation.
message CancelResponse {}

// CreateMediaUploadURLRequest declares the content type of the image the client
// intends to upload directly to storage.
message CreateMediaUploadURLRequest {
  // Required. The IANA media type of the image the client will upload. Only
  // common web image types are accepted; the signed URL is bound to this type.
  string content_type = 1 [(buf.validate.field).string = {
    in: [
      "image/jpeg",
      "image/png",
      "image/webp"
    ]
  }];
}

// CreateMediaUploadURLResponse returns everything the client needs to upload the
// original bytes directly to storage and later attach them.
message CreateMediaUploadURLResponse {
  // The short-lived signed URL the client PUTs the original image bytes to.
  entity.v1.Url upload_url = 1 [(buf.validate.field).required = true];

  // The identifier minted for this upload, passed back to AttachMedia once the
  // client has uploaded the bytes.
  entity.v1.MediaId media_id = 2 [(buf.validate.field).required = true];

  // The maximum size, in bytes, the uploaded object may be. The client MUST
  // keep its body within this bound (the signed URL enforces the same limit);
  // it is the single source of truth for the size cap.
  int64 max_bytes = 3 [(buf.validate.field).int64.gt = 0];
}

// AttachMediaRequest records an uploaded media object as the image of a series
// the caller owns.
message AttachMediaRequest {
  // Required. The series to attach the image to. It MUST be owned by the
  // caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The media object previously minted by CreateMediaUploadURL and
  // uploaded by the client.
  entity.v1.MediaId media_id = 2 [(buf.validate.field).required = true];
}

// AttachMediaResponse is empty: the image is not yet processed or servable when
// AttachMedia returns, so there is nothing meaningful to return. The console
// shows an optimistic local preview until the processed variants become
// available.
message AttachMediaResponse {}

// RegenerateTokenRequest identifies the UNLISTED series whose share token is
// being rotated.
message RegenerateTokenRequest {
  // Required. The UNLISTED series to rotate the share token for. It MUST be
  // owned by the caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];
}

// RegenerateTokenResponse returns the new signed share URL; the previous URL is
// invalidated.
message RegenerateTokenResponse {
  // The new signed share URL for the UNLISTED series.
  entity.v1.Url share_url = 1 [(buf.validate.field).required = true];
}

// ListRequest is empty: the caller's Organizer is resolved from the token, and
// the full own catalog (drafts and published) is returned.
message ListRequest {}

// ListResponse contains the series authored by the caller's Organizer with
// their dates.
message ListResponse {
  // The series authored by the caller's Organizer, drafts and published,
  // including their authoring fields.
  repeated entity.v1.Series series = 1;

  // The dates of every listed series, as Concerts. A Concert's series is the
  // one its event's series_id names; within a series they are in date order.
  repeated entity.v1.Concert concerts = 2;

  // Every Artist the concerts refer to, once each, in the order the concerts
  // first refer to them.
  repeated entity.v1.Artist artists = 3;
}

// SearchVenuesRequest carries the venue name an operator typed.
message SearchVenuesRequest {
  // Required. The venue name to look up, 2 to 100 characters after trimming
  // spaces. The schema bounds the raw length; the usecase trims and applies
  // the exact bounds.
  string text = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 100
  }];
}

// SearchVenuesResponse returns the candidate places for the typed name.
message SearchVenuesResponse {
  // Up to 5 candidate places, best match first. Empty when the map catalog has
  // no match.
  repeated VenueCandidate candidates = 1 [(buf.validate.field).repeated.max_items = 5];
}

// VenueCandidate is one map place an operator can pick as an event's venue.
message VenueCandidate {
  // The map place id; sent back as EventDraft.place_id when picked.
  entity.v1.PlaceId place_id = 1 [(buf.validate.field).required = true];

  // The place's canonical name, in Japanese when the map catalog has one.
  entity.v1.VenueName name = 2 [(buf.validate.field).required = true];

  // The place's formatted address as the map catalog gives it, shown so the
  // operator can tell same-named places apart.
  string address = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
}
