syntax = "proto3";

// Package liverty_music.rpc.organizer.ticket_type.v1 provides the
// organizer-facing TicketTypeService, the surface an operator uses from the
// organizer console to change what one of its TicketSales offers for one
// event: the price, the quantity and the per-account limit. It is served by
// the dedicated organizer Connect server behind org-scoped role-claim
// authorization. Sales themselves are created and changed through
// liverty_music.rpc.organizer.ticket_sale.v1.
package liverty_music.rpc.organizer.ticket_type.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/ticket_type.proto";

// TicketTypeService changes the TicketTypes of the caller's own sales. Every
// call passes the same organizer-console sign-in checks as the organizer
// OrganizerService and then resolves the caller's own Organizer from the
// caller's tenant (never carried in the request): a caller with no tenant, a
// tenant with no linked Organizer and a provisioning Organizer fail with
// PERMISSION_DENIED, and a deactivated Organizer fails with
// FAILED_PRECONDITION, before anything else runs.
service TicketTypeService {
  // Update replaces the price, quantity and per-account limit of a TicketType
  // of one of the caller's sales and returns the updated TicketType. A
  // TicketType of a LOTTERY sale can change only before the sale's window
  // opens, so every entry is made against the price and quantity that are
  // drawn. A TicketType of a FIRST_COME sale can change at any time, but its
  // price only while no ticket is sold or held, and its quantity only down to
  // the sold count plus the tickets held at that moment; the check and the
  // change are one step, so a checkout started meanwhile is counted.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The ticket_type_id, price, quantity or per-account
  //   limit is missing or malformed, or the values break the TicketType rules
  //   (a price outside 1 to 1,000,000, a quantity below 1, or a per-account
  //   limit outside 1 to 10 or above the quantity).
  // - NOT_FOUND: The TicketType does not exist.
  // - PERMISSION_DENIED: The TicketType's sale is on a Series owned by another
  //   Organizer, or any organizer-console authorization failure.
  // - FAILED_PRECONDITION: The TicketType's LOTTERY sale has already opened, the
  //   price of a FIRST_COME TicketType changes while tickets are sold or held,
  //   its quantity is below the sold count plus the tickets held, or the
  //   caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Update(UpdateRequest) returns (UpdateResponse);
}

// UpdateRequest names the TicketType and carries all three of its editable
// values, which replace the stored ones.
message UpdateRequest {
  // Required. The TicketType to change. Its sale's Series MUST be owned by the
  // caller's Organizer.
  entity.v1.TicketTypeId ticket_type_id = 1 [(buf.validate.field).required = true];

  // Required. The price of one ticket in yen, tax-inclusive (税込). 1 to
  // 1,000,000.
  entity.v1.TicketPrice price = 2 [(buf.validate.field).required = true];

  // Required. The tickets offered, at least 1.
  int32 quantity = 3 [(buf.validate.field).int32.gte = 1];

  // Required. The most tickets one account may hold for the event once the
  // sale is done, counting tickets it already holds: 1 to 10 and at most the
  // quantity.
  int32 per_account_limit = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
}

// UpdateResponse returns the changed TicketType.
message UpdateResponse {
  // The updated TicketType with its new price, quantity and per-account limit.
  entity.v1.TicketType ticket_type = 1 [(buf.validate.field).required = true];
}
