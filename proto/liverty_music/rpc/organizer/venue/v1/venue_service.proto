syntax = "proto3";

// Package liverty_music.rpc.organizer.venue.v1 provides the organizer-facing
// VenueService, which a member uses from the organizer console to find the
// venue of an event while authoring a series.
package liverty_music.rpc.organizer.venue.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/area.proto";
import "liverty_music/entity/v1/user.proto";
import "liverty_music/entity/v1/venue.proto";

// VenueService looks up venues in the map catalog for the caller's own
// Organizer. The caller's Organizer is resolved from the token, with the same
// organizer-console sign-in checks as the organizer OrganizerService; failures
// that would concern another org never reveal whether such an Organizer exists.
service VenueService {
  // Search looks up a venue name in the map catalog while a member authors
  // a series, and returns up to 5 candidate places, best match first, with
  // places in Japan ranked first. The member picks one and its place id goes
  // into liverty_music.rpc.organizer.series.v1.EventDraft.place_id. Nothing is
  // stored: a Venue is matched or created only when a series is saved with the
  // picked place.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The text is shorter than 2 or longer than 100
  //   characters after trimming spaces.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role, or no
  //   Organizer is linked to the caller's Organization or it is provisioning.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAVAILABLE: The map catalog could not be reached.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Search(SearchRequest) returns (SearchResponse);

  // ResolvePlace is called after the member picks a candidate from Search. It
  // returns the Venue that already holds the place id, or, for a place no Venue
  // holds, a PlaceDraft the member confirms: the place's name, its country,
  // the area its address suggests and a time zone. Nothing is stored: a Venue
  // is created only when a series is saved with the values the member
  // confirmed (liverty_music.rpc.organizer.series.v1.EventDraft).
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The place id is missing.
  // - NOT_FOUND: The map catalog has no place with the id.
  // - PERMISSION_DENIED: The caller lacks the organizer-console role, or no
  //   Organizer is linked to the caller's Organization or it is provisioning.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAVAILABLE: The map catalog could not be reached.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc ResolvePlace(ResolvePlaceRequest) returns (ResolvePlaceResponse);
}

// SearchRequest carries the venue name a member typed.
message SearchRequest {
  // Required. The venue name to look up, 2 to 100 characters after trimming
  // spaces. The schema bounds the raw length; the usecase trims and applies
  // the exact bounds.
  string text = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 100
  }];
}

// SearchResponse returns the candidate places for the typed name.
message SearchResponse {
  // Up to 5 candidate places, best match first. Empty when the map catalog has
  // no match.
  repeated VenueCandidate candidates = 1 [(buf.validate.field).repeated.max_items = 5];
}

// VenueCandidate is one map place a member can pick as an event's venue.
message VenueCandidate {
  // The map place id; sent back as EventDraft.place_id when picked.
  entity.v1.PlaceId place_id = 1 [(buf.validate.field).required = true];

  // The place's name as the map catalog suggests it for the typed text, in
  // Japanese when the catalog has one.
  entity.v1.VenueName name = 2 [(buf.validate.field).required = true];

  // The rest of the place's description as the map catalog suggests it
  // (usually the address without the postal code), shown so the member can
  // tell same-named places apart.
  string address = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
}

// ResolvePlaceRequest names the map place a member picked.
message ResolvePlaceRequest {
  // Required. The place id of the candidate the member picked from Search.
  entity.v1.PlaceId place_id = 1 [(buf.validate.field).required = true];
}

// ResolvePlaceResponse is the stored Venue that holds the place, or the draft
// of a new one.
message ResolvePlaceResponse {
  // Exactly one is set.
  oneof result {
    option (buf.validate.oneof).required = true;

    // The Venue that holds the place id. The editor shows its name, area and
    // time zone as text.
    entity.v1.Venue venue = 1;

    // The place is no Venue yet. The editor prefills the venue name, country,
    // area and time zone from it and the member confirms or edits each.
    PlaceDraft draft = 2;
  }
}

// PlaceDraft is what the map catalog and the reference data suggest for a
// place that is no Venue yet. It is a suggestion only: it is never stored as
// it is, and a Venue is created from what the member saved.
message PlaceDraft {
  // The place's name as the map catalog gives it.
  entity.v1.VenueName name = 1 [(buf.validate.field).required = true];

  // The country or territory of the place's address.
  entity.v1.CountryCode country_code = 2 [(buf.validate.field).required = true];

  // The first-level Area the place's address suggests, resolved within the
  // country. Absent when the address names no Area the reference data knows.
  optional entity.v1.AdminArea suggested_admin_area = 3;

  // The time zone suggested for the venue: the suggested Area's zone, else the
  // place's own zone when it is one of the country's zones. Absent when neither
  // applies; the member chooses one.
  optional entity.v1.TimeZone time_zone = 4;
}
