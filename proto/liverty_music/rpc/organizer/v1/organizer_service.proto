syntax = "proto3";

// Package liverty_music.rpc.organizer.v1 provides the organizer-facing
// OrganizerService that an operator uses to read their own Organizer from the
// organizer console. It is served by the dedicated organizer Connect server
// behind org-scoped role-claim authorization; the admin-facing surface for
// managing Organizers lives separately in liverty_music.rpc.admin.organizer.v1.
package liverty_music.rpc.organizer.v1;

import "buf/validate/validate.proto";
import "liverty_music/entity/v1/artist.proto";
import "liverty_music/entity/v1/organizer.proto";

// OrganizerService is the organizer-facing surface: an authenticated operator
// reads their own Organizer and the artists it represents. Every request
// carries an organizer_id that MUST resolve to the caller's own Organizer — the
// one whose Zitadel org (the org the token is scoped to) it matches; any other
// organizer_id is rejected. Authorization is org-scoped from the token's role
// claim, and failures never reveal whether another Organizer exists.
service OrganizerService {
  // Get returns the caller's own Organizer identity (id and name). The roster
  // of represented artists is retrieved separately via ListArtists, mirroring
  // the admin OrganizerService and the fan UserService.Get.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The organizer_id is missing or malformed.
  // - PERMISSION_DENIED: The organizer_id does not resolve to the caller's own
  //   Organizer, the caller holds no role for that Zitadel org, the token
  //   audience lacks the organizer-console project id, or the Organizer is
  //   deactivated. The response never reveals whether the Organizer exists.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Get(GetRequest) returns (GetResponse);

  // ListArtists returns the artists the caller's own Organizer represents, in a
  // stable order ascending by artist id, so the organizer console can render
  // the roster. Empty when it represents none.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The organizer_id is missing or malformed.
  // - PERMISSION_DENIED: The organizer_id does not resolve to the caller's own
  //   Organizer, the caller holds no role for that Zitadel org, the token
  //   audience lacks the organizer-console project id, or the Organizer is
  //   deactivated. The response never reveals whether the Organizer exists.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc ListArtists(ListArtistsRequest) returns (ListArtistsResponse);
}

// GetRequest identifies the Organizer to retrieve. The organizer_id MUST
// resolve to the caller's own Organizer; any other value is rejected with
// PERMISSION_DENIED.
message GetRequest {
  // Required. The caller's own organizer identifier.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// GetResponse returns the caller's Organizer identity.
message GetResponse {
  // The caller's organizer (id and name).
  entity.v1.Organizer organizer = 1 [(buf.validate.field).required = true];
}

// ListArtistsRequest identifies the Organizer whose represented artists to
// list. The organizer_id MUST resolve to the caller's own Organizer; any other
// value is rejected with PERMISSION_DENIED.
message ListArtistsRequest {
  // Required. The caller's own organizer identifier.
  entity.v1.OrganizerId organizer_id = 1 [(buf.validate.field).required = true];
}

// ListArtistsResponse contains the artists the caller's Organizer represents,
// ascending by artist id (stable). Empty when it represents none.
message ListArtistsResponse {
  // The artists represented by the organizer, ascending by artist id. Empty
  // when it represents none.
  repeated entity.v1.Artist artists = 1;
}
