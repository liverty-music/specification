syntax = "proto3";

// Package liverty_music.rpc.organizer.ticket_sale.v1 provides the
// organizer-facing TicketSaleService, the surface a member uses from the
// organizer console to open a sale (受付) on the published events of one of its
// Organizer's Series, by lottery or first come, first served, and to see how it
// stands. It is served by the dedicated organizer Connect server behind
// org-scoped role-claim authorization. A sale sells the TicketStocks of the
// events it names, which are made through
// liverty_music.rpc.organizer.ticket_stock.v1; fans read sales through
// liverty_music.rpc.ticket_sale.v1 and take part through
// liverty_music.rpc.lottery_entry.v1 and liverty_music.rpc.checkout.v1.
package liverty_music.rpc.organizer.ticket_sale.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/referral.proto";
import "liverty_music/entity/v1/seat_type.proto";
import "liverty_music/entity/v1/series.proto";
import "liverty_music/entity/v1/ticket_sale.proto";
import "liverty_music/entity/v1/ticket_stock.proto";

// TicketSaleService is the organizer-facing sale surface: an authenticated
// member creates the TicketSales of its Organizer's Series, lists the sales of
// one of its events with their lottery entry stats, and moves a sale's window or changes its
// verification requirement. Every call passes the same organizer-console
// sign-in checks as the organizer OrganizerService and then resolves the
// caller's own Organizer from the caller's Organization (never carried in the
// request): a caller with no Organization, an Organization with no linked
// Organizer and a provisioning Organizer fail with PERMISSION_DENIED, and a
// deactivated Organizer fails with FAILED_PRECONDITION, before anything else
// runs. Failures that would concern another Organizer's Series, event or sale
// never reveal whether it exists.
service TicketSaleService {
  // Create opens a sale on published events of one of the caller's Series: a
  // name, the method LOTTERY or FIRST_COME, a window, an optional verification
  // requirement and the events it sells. A sale given no verification
  // requirement requires none. Every event must be one of the Series' events,
  // published, with a start time and with at least one TicketStock; the sale
  // sells every TicketStock of its events. A LOTTERY sale's window lasts 1 to
  // 14 days and ends before the start of every event it covers; a FIRST_COME
  // sale ends no later than the start of any event it covers. The new window
  // must not overlap the window of another sale of any event it covers, and
  // the caller's Organizer must have complete business details (legal name,
  // representative name, business address, business phone number and contact
  // email) for the 特商法 disclosure. The stored sale is returned naming its
  // events, not drawn.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The series_id, name, method, sale start, sale end or
  //   events are missing or malformed, an event is not one of the Series'
  //   events, or the values break the TicketSale rules (the end not after the
  //   start, a LOTTERY window shorter than 1 day or longer than 14 days, an
  //   event named twice).
  // - PERMISSION_DENIED: The Series does not exist or is owned by another
  //   Organizer, or any organizer-console authorization failure. Non-revealing.
  // - FAILED_PRECONDITION: An event is not published, has no start time or has
  //   no TicketStock, the sale ends too late for an event it covers, its window
  //   overlaps another sale of one of its events, the caller's Organizer has
  //   no complete business details, or the Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Create(CreateRequest) returns (CreateResponse);

  // ListByEvent returns every sale of one of the caller's events in start
  // order and, for each LOTTERY sale, the LotteryEntryStats of each
  // TicketStock of the event (entry, ticket, winner and loser counts),
  // returned beside the sales. A closed LOTTERY sale is drawn when none of its
  // entries is ENTERED: every one of its stats has an entry count equal to its
  // won plus lost entry counts. The stocks' quantities and their sold and held
  // counts come from liverty_music.rpc.organizer.ticket_stock.v1. Beside the
  // sales it returns the event's Paid Orders per referral code
  // (ReferralCodeStats), with the purchases without a code as one direct
  // group. An event that no sale offers returns an empty list.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The event_id is missing or malformed.
  // - PERMISSION_DENIED: The event does not exist or is not owned by the
  //   caller's Organizer, or any organizer-console authorization failure.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc ListByEvent(ListByEventRequest) returns (ListByEventResponse);

  // SetWindow moves the start and end times of one of the caller's sales: a
  // LOTTERY sale only before its window opens, a FIRST_COME sale at any time.
  // The new window keeps the sale rules: a LOTTERY window lasts 1 to 14 days
  // and ends before the start of every event the sale covers, a FIRST_COME
  // window ends no later than the start of any event it covers, and it must not
  // overlap the window of another sale of any of its events (the sale's own
  // current window is not compared). The updated sale is returned naming its
  // events.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The ticket_sale_id, sale start or sale end is missing or
  //   malformed, or the window breaks the TicketSale rules (the end not after
  //   the start, or a LOTTERY window shorter than 1 day or longer than 14 days).
  // - NOT_FOUND: The sale does not exist.
  // - PERMISSION_DENIED: The sale's Series is owned by another Organizer, or
  //   any organizer-console authorization failure.
  // - FAILED_PRECONDITION: A LOTTERY sale's window has already opened, the new
  //   window ends too late for an event the sale covers or overlaps another
  //   sale of one of its events, or the caller's own Organizer has been
  //   deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetWindow(SetWindowRequest) returns (SetWindowResponse);

  // SetVerificationRequirement changes whether fans taking part in one of the
  // caller's sales must hold an Active IdentityVerification: none, VERIFIED_ANY
  // (admits the driver's-licence fallback) or JPKI_ONLY. It may be changed at
  // any time, whether or not the window is open and whether or not the sale is
  // drawn; entries and checkouts already made are not re-checked. The updated
  // sale is returned naming its events.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The ticket_sale_id is missing or malformed, or the
  //   requirement is not a defined value.
  // - NOT_FOUND: The sale does not exist.
  // - PERMISSION_DENIED: The sale's Series is owned by another Organizer, or
  //   any organizer-console authorization failure.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetVerificationRequirement(SetVerificationRequirementRequest) returns (SetVerificationRequirementResponse);
}

// CreateRequest carries the Series, the sale's settings and its events.
message CreateRequest {
  option (buf.validate.message).cel = {
    id: "create_request.distinct_events"
    message: "event_ids must not repeat an event"
    expression: "this.event_ids.map(e, e.value).unique()"
  };

  // Required. The Series whose events the sale offers. It MUST be owned by the
  // caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The sale's name, for example ファンクラブ先行 or 一般発売.
  entity.v1.TicketSaleName name = 2 [(buf.validate.field).required = true];

  // Required. How the sale allocates its tickets: LOTTERY or FIRST_COME.
  entity.v1.TicketSaleMethod method = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Required. When the sale opens.
  google.protobuf.Timestamp sale_start_time = 4 [(buf.validate.field).required = true];

  // Required. When the sale closes, after the sale start.
  google.protobuf.Timestamp sale_end_time = 5 [(buf.validate.field).required = true];

  // Optional. Whether fans taking part must hold an Active
  // IdentityVerification. UNSPECIFIED (the default) requires none.
  entity.v1.VerificationRequirement verification_requirement = 6 [(buf.validate.field).enum.defined_only = true];

  // Required. The events the sale sells, at least one, each named once. Each
  // MUST be one of the Series' events, published, with a start time and with
  // at least one TicketStock.
  repeated entity.v1.EventId event_ids = 8 [(buf.validate.field).repeated.min_items = 1];

  // Field 7 was one ticket type for each event, with its price, quantity and
  // per-account limit; prices are now on SeatTypes, quantities on
  // TicketStocks and the limit on the Event.
  reserved 7;
  reserved "ticket_types";
}

// CreateResponse returns the stored sale.
message CreateResponse {
  // The created sale, not drawn, naming its events.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}

// ListByEventRequest names the event whose sales to list.
message ListByEventRequest {
  // Required. The event whose sales to list. Its concert MUST be owned by the
  // caller's Organizer.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// LotteryEntryStats counts the entries (Entered, Won and Lost) of one LOTTERY
// sale for one TicketStock of the event. Every count is 0 for a stock with no
// entry, and the Won and Lost counts stay 0 until the sale is drawn.
message LotteryEntryStats {
  // The LOTTERY sale the stats are for.
  entity.v1.TicketSaleId ticket_sale_id = 8 [(buf.validate.field).required = true];

  // The TicketStock the stats are for.
  entity.v1.TicketStockId ticket_stock_id = 9 [(buf.validate.field).required = true];

  // The SeatType of the TicketStock.
  entity.v1.SeatTypeId seat_type_id = 10 [(buf.validate.field).required = true];

  // The number of entries.
  int32 entry_count = 2 [(buf.validate.field).int32.gte = 0];

  // The sum of the entries' ticket counts: the demand to compare with the
  // TicketStock's remaining tickets.
  int32 ticket_count = 7 [(buf.validate.field).int32.gte = 0];

  // The number of Won entries.
  int32 won_entry_count = 4 [(buf.validate.field).int32.gte = 0];

  // The sum of the Won entries' ticket counts, never above the stock's
  // quantity.
  int32 won_ticket_count = 5 [(buf.validate.field).int32.gte = 0];

  // The number of Lost entries: the sale's losers for the stock.
  int32 lost_entry_count = 6 [(buf.validate.field).int32.gte = 0];

  // Field 3 was the sum of ticket counts under its former name, replaced by
  // ticket_count. Field 1 was the TicketType, replaced by ticket_sale_id and
  // ticket_stock_id.
  reserved 1, 3;
  reserved "requested_ticket_count", "ticket_type_id";
}

// ReferralCodeStats counts the Paid Orders of one event that have one referral
// code. Pending, Void and Refunded Orders are not counted.
message ReferralCodeStats {
  // The referral code. Absent for the direct group: the Paid Orders without a
  // code.
  optional entity.v1.ReferralCode code = 1;

  // The number of Paid Orders, at least 1.
  int32 order_count = 2 [(buf.validate.field).int32.gte = 0];

  // The sum of the Orders' ticket counts.
  int32 ticket_count = 3 [(buf.validate.field).int32.gte = 0];

  // The sum of the Orders' amounts, in whole yen, 税込 (tax-inclusive).
  int64 amount = 4 [(buf.validate.field).int64.gte = 0];
}

// ListByEventResponse returns the event's sales with their entry stats.
message ListByEventResponse {
  // The event's sales in start order, each naming its events. Empty when no
  // sale names the event.
  repeated entity.v1.TicketSale ticket_sales = 1;

  // The entry stats of the LOTTERY sales above, one per sale and TicketStock
  // of the event. Empty when none of the sales is a LOTTERY sale.
  repeated LotteryEntryStats lottery_entry_stats = 2;

  // The event's Paid Orders per referral code, most Orders first, then by
  // code; the direct group has no code. Empty when the event has no Paid
  // Order.
  repeated ReferralCodeStats referral_code_stats = 3;
}

// SetWindowRequest names the sale and its new window.
message SetWindowRequest {
  // Required. The sale to change. Its Series MUST be owned by the caller's
  // Organizer.
  entity.v1.TicketSaleId ticket_sale_id = 1 [(buf.validate.field).required = true];

  // Required. When the sale opens.
  google.protobuf.Timestamp sale_start_time = 2 [(buf.validate.field).required = true];

  // Required. When the sale closes, after the sale start.
  google.protobuf.Timestamp sale_end_time = 3 [(buf.validate.field).required = true];
}

// SetWindowResponse returns the sale with its new window.
message SetWindowResponse {
  // The updated sale, naming its events.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}

// SetVerificationRequirementRequest names the sale and the requirement to set.
message SetVerificationRequirementRequest {
  // Required. The sale to change. Its Series MUST be owned by the caller's
  // Organizer.
  entity.v1.TicketSaleId ticket_sale_id = 1 [(buf.validate.field).required = true];

  // The requirement to set. UNSPECIFIED requires no verification; VERIFIED_ANY
  // and JPKI_ONLY require an Active IdentityVerification.
  entity.v1.VerificationRequirement verification_requirement = 2 [(buf.validate.field).enum.defined_only = true];
}

// SetVerificationRequirementResponse returns the sale with its new requirement.
message SetVerificationRequirementResponse {
  // The updated sale, naming its events.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}
