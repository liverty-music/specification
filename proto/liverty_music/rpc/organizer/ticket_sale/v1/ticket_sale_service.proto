syntax = "proto3";

// Package liverty_music.rpc.organizer.ticket_sale.v1 provides the
// organizer-facing TicketSaleService, the surface an operator uses from the
// organizer console to open a sale (受付) on the published events of one of its
// Series, by lottery or first come, first served, and to see how it stands. It
// is served by the dedicated organizer Connect server behind org-scoped
// role-claim authorization. A sale's per-event price, quantity and per-account
// limit are changed through liverty_music.rpc.organizer.ticket_type.v1; fans
// read sales through liverty_music.rpc.ticket_sale.v1 and take part through
// liverty_music.rpc.lottery_entry.v1 and liverty_music.rpc.checkout.v1.
package liverty_music.rpc.organizer.ticket_sale.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "liverty_music/entity/v1/event.proto";
import "liverty_music/entity/v1/series.proto";
import "liverty_music/entity/v1/ticket_sale.proto";
import "liverty_music/entity/v1/ticket_type.proto";

// TicketSaleService is the organizer-facing sale surface: an authenticated
// operator creates the TicketSales of its own Series, lists the sales of one of
// its events with their counts, and moves a sale's window or changes its
// verification requirement. Every call passes the same organizer-console
// sign-in checks as the organizer OrganizerService and then resolves the
// caller's own Organizer from the caller's tenant (never carried in the
// request): a caller with no tenant, a tenant with no linked Organizer and a
// provisioning Organizer fail with PERMISSION_DENIED, and a deactivated
// Organizer fails with FAILED_PRECONDITION, before anything else runs. Failures
// that would concern another Organizer's Series, event or sale never reveal
// whether it exists.
service TicketSaleService {
  // Create opens a sale on published events of one of the caller's Series: a
  // name, the method LOTTERY or FIRST_COME, a window, an optional verification
  // requirement and one TicketType for each event it covers, with a price, a
  // quantity and an optional per-account limit. A FIRST_COME sale given no end
  // time ends at the earliest start time among its events; a TicketType given
  // no per-account limit has a limit of 4; a sale given no verification
  // requirement requires none. Every event must be one of the Series' events,
  // published and with a start time. A LOTTERY sale's window lasts 1 to 14 days
  // and ends before the start of every event it covers; a FIRST_COME sale ends
  // no later than the start of any event it covers. The new window must not
  // overlap the window of another sale of any event it covers, and the caller's
  // Organizer must have complete business details (legal name, representative
  // name, business address, business phone number and contact email) for the
  // 特商法 disclosure. The stored sale is returned with its TicketTypes, not
  // drawn.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The series_id, name, method, sale start or ticket types
  //   are missing or malformed, a TicketType has no event, price or quantity,
  //   a LOTTERY sale has no end time, a TicketType's event is not one of the
  //   Series' events, or the values break the TicketSale or TicketType rules
  //   (the end not after the start, a LOTTERY window shorter than 1 day or
  //   longer than 14 days, a price outside 1 to 1,000,000, a per-account limit
  //   outside 1 to 10 or above the quantity).
  // - PERMISSION_DENIED: The Series does not exist or is owned by another
  //   Organizer, or any organizer-console authorization failure. Non-revealing.
  // - FAILED_PRECONDITION: An event is not published or has no start time, the
  //   sale ends too late for an event it covers, its window overlaps another
  //   sale of one of its events, the caller's Organizer has no complete
  //   business details, or the Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc Create(CreateRequest) returns (CreateResponse);

  // ListByEvent returns every sale of one of the caller's events in start
  // order, each with its TicketTypes and their counts: for a LOTTERY sale
  // whether it is drawn and, per TicketType, its LotteryEntryStats (entry,
  // ticket, winner and loser counts, returned beside the sales); for a FIRST_COME
  // sale, per TicketType, its quantity, sold count, held count and state now.
  // An event that no sale offers returns an empty list.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The event_id is missing or malformed.
  // - PERMISSION_DENIED: The event does not exist or is not owned by the
  //   caller's Organizer, or any organizer-console authorization failure.
  //   Non-revealing.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc ListByEvent(ListByEventRequest) returns (ListByEventResponse);

  // SetWindow moves the start and end times of one of the caller's sales: a
  // LOTTERY sale only before its window opens, a FIRST_COME sale at any time.
  // The new window keeps the sale rules: a LOTTERY window lasts 1 to 14 days
  // and ends before the start of every event the sale covers, a FIRST_COME
  // window ends no later than the start of any event it covers, and it must not
  // overlap the window of another sale of any of its events (the sale's own
  // current window is not compared). The updated sale is returned with its
  // TicketTypes.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The ticket_sale_id, sale start or sale end is missing or
  //   malformed, or the window breaks the TicketSale rules (the end not after
  //   the start, or a LOTTERY window shorter than 1 day or longer than 14 days).
  // - NOT_FOUND: The sale does not exist.
  // - PERMISSION_DENIED: The sale's Series is owned by another Organizer, or
  //   any organizer-console authorization failure.
  // - FAILED_PRECONDITION: A LOTTERY sale's window has already opened, the new
  //   window ends too late for an event the sale covers or overlaps another
  //   sale of one of its events, or the caller's own Organizer has been
  //   deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetWindow(SetWindowRequest) returns (SetWindowResponse);

  // SetVerificationRequirement changes whether fans taking part in one of the
  // caller's sales must hold an Active IdentityVerification: none, VERIFIED_ANY
  // (admits the driver's-licence fallback) or JPKI_ONLY. It may be changed at
  // any time, whether or not the window is open and whether or not the sale is
  // drawn; entries and checkouts already made are not re-checked. The updated
  // sale is returned with its TicketTypes.
  //
  // Possible errors:
  // - INVALID_ARGUMENT: The ticket_sale_id is missing or malformed, or the
  //   requirement is not a defined value.
  // - NOT_FOUND: The sale does not exist.
  // - PERMISSION_DENIED: The sale's Series is owned by another Organizer, or
  //   any organizer-console authorization failure.
  // - FAILED_PRECONDITION: The caller's own Organizer has been deactivated.
  // - UNAUTHENTICATED: The request lacks valid authentication credentials.
  rpc SetVerificationRequirement(SetVerificationRequirementRequest) returns (SetVerificationRequirementResponse);
}

// TicketTypeInput is what a new sale offers for one event, given at Create.
// The ticket type's id, sale and counts are assigned by the server.
message TicketTypeInput {
  // Required. The event the ticket type admits to. It MUST be one of the
  // Series' events, published and with a start time, and at most one ticket
  // type of the sale may name it.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];

  // Required. The price of one ticket in yen, tax-inclusive (税込). 1 to
  // 1,000,000.
  entity.v1.TicketTypePrice price = 2 [(buf.validate.field).required = true];

  // Required. The tickets offered, at least 1.
  int32 quantity = 3 [(buf.validate.field).int32.gte = 1];

  // Optional. The most tickets one account may hold for the event once this
  // sale is done, counting tickets it already holds: 1 to 10 and at most the
  // quantity. 4 when omitted.
  optional int32 per_account_limit = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
}

// CreateRequest carries the Series, the sale's settings and its ticket types.
message CreateRequest {
  // Required. The Series whose events the sale offers. It MUST be owned by the
  // caller's Organizer.
  entity.v1.SeriesId series_id = 1 [(buf.validate.field).required = true];

  // Required. The sale's name, for example ファンクラブ先行 or 一般発売.
  entity.v1.TicketSaleName name = 2 [(buf.validate.field).required = true];

  // Required. How the sale allocates its tickets: LOTTERY or FIRST_COME.
  entity.v1.TicketSaleMethod method = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Required. When the sale opens.
  google.protobuf.Timestamp sale_start_time = 4 [(buf.validate.field).required = true];

  // When the sale closes, after the sale start. Required for a LOTTERY sale;
  // optional for a FIRST_COME sale, which ends at the earliest start time among
  // its events when omitted.
  google.protobuf.Timestamp sale_end_time = 5;

  // Optional. Whether fans taking part must hold an Active
  // IdentityVerification. UNSPECIFIED (the default) requires none.
  entity.v1.VerificationRequirement verification_requirement = 6 [(buf.validate.field).enum.defined_only = true];

  // Required. One ticket type for each event the sale covers, at least one.
  repeated TicketTypeInput ticket_types = 7 [(buf.validate.field).repeated.min_items = 1];
}

// CreateResponse returns the stored sale.
message CreateResponse {
  // The created sale, not drawn, with its TicketTypes.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}

// ListByEventRequest names the event whose sales to list.
message ListByEventRequest {
  // Required. The event whose sales to list. Its concert MUST be owned by the
  // caller's Organizer.
  entity.v1.EventId event_id = 1 [(buf.validate.field).required = true];
}

// LotteryEntryStats tallies the Entered, Won and Lost entries of one
// TicketType of a LOTTERY sale; Draft and Withdrawn entries are not counted.
// Every count is 0 for a TicketType with no entry, and the Won and Lost counts
// stay 0 until the sale is drawn.
message LotteryEntryStats {
  // The TicketType the tallies are for.
  entity.v1.TicketTypeId ticket_type_id = 1 [(buf.validate.field).required = true];

  // The number of entries.
  int32 entry_count = 2 [(buf.validate.field).int32.gte = 0];

  // The sum of the entries' ticket counts: the demand to compare with the
  // TicketType's quantity.
  int32 ticket_count = 7 [(buf.validate.field).int32.gte = 0];

  // The number of Won entries.
  int32 won_entry_count = 4 [(buf.validate.field).int32.gte = 0];

  // The sum of the Won entries' ticket counts, never above the quantity.
  int32 won_ticket_count = 5 [(buf.validate.field).int32.gte = 0];

  // The number of Lost entries: the TicketType's losers.
  int32 lost_entry_count = 6 [(buf.validate.field).int32.gte = 0];

  // Field 3 was the sum of ticket counts under its former name, replaced by
  // ticket_count.
  reserved 3;
  reserved "requested_ticket_count";
}

// ListByEventResponse returns the event's sales with their counts.
message ListByEventResponse {
  // The event's sales in start order, each with its TicketTypes. A FIRST_COME
  // sale's TicketTypes carry their quantity, sold count, held count and state;
  // a LOTTERY sale carries whether it is drawn. Empty when no sale offers the
  // event.
  repeated entity.v1.TicketSale ticket_sales = 1;

  // The entry tallies of every TicketType of the LOTTERY sales above, one per
  // TicketType. Empty when none of the sales is a LOTTERY sale.
  repeated LotteryEntryStats lottery_entry_stats = 2;
}

// SetWindowRequest names the sale and its new window.
message SetWindowRequest {
  // Required. The sale to change. Its Series MUST be owned by the caller's
  // Organizer.
  entity.v1.TicketSaleId ticket_sale_id = 1 [(buf.validate.field).required = true];

  // Required. When the sale opens.
  google.protobuf.Timestamp sale_start_time = 2 [(buf.validate.field).required = true];

  // Required. When the sale closes, after the sale start.
  google.protobuf.Timestamp sale_end_time = 3 [(buf.validate.field).required = true];
}

// SetWindowResponse returns the sale with its new window.
message SetWindowResponse {
  // The updated sale with its TicketTypes.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}

// SetVerificationRequirementRequest names the sale and the requirement to set.
message SetVerificationRequirementRequest {
  // Required. The sale to change. Its Series MUST be owned by the caller's
  // Organizer.
  entity.v1.TicketSaleId ticket_sale_id = 1 [(buf.validate.field).required = true];

  // The requirement to set. UNSPECIFIED requires no verification; VERIFIED_ANY
  // and JPKI_ONLY require an Active IdentityVerification.
  entity.v1.VerificationRequirement verification_requirement = 2 [(buf.validate.field).enum.defined_only = true];
}

// SetVerificationRequirementResponse returns the sale with its new requirement.
message SetVerificationRequirementResponse {
  // The updated sale with its TicketTypes.
  entity.v1.TicketSale ticket_sale = 1 [(buf.validate.field).required = true];
}
