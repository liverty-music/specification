schema: liverty-clean-arch

context: |
  Product: Liverty Music - a personalized concert notification and ticketing platform.
  Stack: proto3 on Buf/BSR with protovalidate, Connect RPC, Go backend (Clean Architecture), Aurelia 2 PWA frontend.
  Audiences: fan, admin, organizer.

  openspec/specs/
  ├── stories/<story>/                  one user goal across all layers; verified by an E2E test
  └── components/
      ├── entity/<entity>/              the noun -> proto message, Go and TS entity
      │   └── <operation>/              one operation on it -> interface method declared in backend/internal/entity
      ├── usecase/<entity>/<method>/    -> usecase method in backend/internal/usecase (exposed as a Connect RPC)
      ├── adapter/<audience>/api/
      │   ├── rpc/<handler>/            the audience gate of an RPC handler
      │   └── webhook/<component>/      a call from an external system (audience: fan)
      └── infrastructure/
          ├── fan/api/server/<component>/   a server-wide rule (rate limiting)
          ├── backend/process/<component>/  a rule every backend process obeys (startup, health checks, logging);
          │                                 the one shared slot: API servers, event consumers and jobs serve no single audience
          └── <audience>/web/
              ├── route/<screen>/           one screen
              └── global/<surface>/         a surface shared by screens (shell, sheets, hosted login, service worker, i18n)

  Error vocabulary: NotFound, AlreadyExists, InvalidArgument, FailedPrecondition, PermissionDenied,
  Unauthenticated, Unavailable, ResourceExhausted, DeadlineExceeded, Internal.

rules:
  specs:
    - Legal and commercial terms are written in Japanese with an English gloss on first use (特定興行入場券 covered ticket, 本人確認 identity check, 収納代行 collection agency, 特商法 表記, 中止, 延期, 繰上げ); enum values and channel names are English.

operations:
  apply:
    guidance:
      - Record task progress in this store's working tree on main (check off tasks.md, update design.md) and never commit it; implementation repositories only cite the change and store commit in their PRs.
      - Several changes share the store's working tree. Never run git stash, git reset --hard, git checkout -- . / git restore . or git clean there, never git add -A / git add ., never git pull, and never switch its branch; branch work happens in a worktree (README "Branch work in this repository").
  archive:
    guidance:
      - Confirm every implementing PR is merged and cite them before archiving.
      - Archive in a worktree on a <change>-archive branch cut from origin/main (git worktree add .claude/worktrees/<change>-archive -b <change>-archive origin/main), after copying the change's latest progress from the store's working tree into it; stage only openspec/changes/<change>, openspec/changes/archive and openspec/specs, then push and open one PR. After it merges, sync the store's working tree for that change only (README "Branch work in this repository").
